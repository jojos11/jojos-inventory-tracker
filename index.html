<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoJo's Cookie Co. — Inventory Tracker</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#A2CCEB;--bg:#1A1A1A;--card:#242424;--border:#333;--gray:#999;--gray2:#666;--green:#4CAF50;--yellow:#FFB300;--red:#EF5350;--orange:#FF9800}
body{background:var(--bg);color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh}
input,select,textarea,button{font-family:'DM Sans',sans-serif}
.serif{font-family:'Playfair Display',serif}
header{background:var(--card);border-bottom:2px solid var(--blue);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-logo{height:36px;object-fit:contain}
.nav{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.nav button{padding:7px 12px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:transparent;color:var(--gray);transition:all .15s;white-space:nowrap}
.nav button.active{background:var(--blue);color:#000}
.loc-toggle{display:flex;gap:2px;background:var(--bg);border-radius:6px;padding:2px;border:1px solid var(--border)}
.loc-toggle button{padding:6px 12px;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:transparent;color:var(--gray)}
.loc-toggle button.active{background:var(--blue);color:#000}
main{padding:20px;max-width:1200px;margin:0 auto}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:14px 18px;flex:1;min-width:120px}
.stat-val{font-size:24px;font-weight:700;font-family:'Playfair Display',serif}
.stat-lbl{font-size:11px;color:var(--gray);margin-top:2px}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.card h3{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .sub{font-size:12px;color:var(--gray);margin:4px 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)}
th.c{text-align:center}
td{padding:7px 12px;border-bottom:1px solid rgba(51,51,51,.15)}
td.c{text-align:center}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0;margin-right:7px}
.tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;margin-left:6px}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-blue{background:var(--blue);color:#000}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--gray)}
.btn-outline:hover{border-color:var(--gray)}
.bar-wrap{display:flex;align-items:center;gap:5px}
.bar{width:50px;height:4px;border-radius:2px;background:#333;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .3s}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;padding:10px 12px 4px}
.input{width:52px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px 6px;color:#fff;font-size:13px;text-align:center}
.input:focus{border-color:var(--blue);outline:none}
.input-wide{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:#fff;font-size:13px}
.input-wide:focus{border-color:var(--blue);outline:none}
.select{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:#fff;font-size:13px;width:100%}
.select:focus{border-color:var(--blue);outline:none}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:24px;max-width:560px;width:90%;max-height:85vh;overflow-y:auto}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:8px}
.alert-critical{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.25);color:var(--red)}
.alert-warning{background:rgba(255,179,0,.1);border:1px solid rgba(255,179,0,.2);color:var(--yellow)}
.alert-transfer{background:rgba(162,204,235,.1);border:1px solid rgba(162,204,235,.2);color:var(--blue)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:40px;text-align:center;width:360px}
.login-logo{width:120px;height:120px;border-radius:50%;object-fit:cover;margin-bottom:20px;border:3px solid var(--blue)}
.prep-group{background:var(--bg);border-radius:10px;padding:14px;margin-bottom:10px}
.prep-group h4{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.prep-item{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(51,51,51,.15)}
.prep-item:last-child{border-bottom:none}
.tab-pills{display:flex;gap:4px;margin-bottom:12px}
.tab-pills button{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--gray);font-size:12px;font-weight:600;cursor:pointer}
.tab-pills button.active{background:var(--blue);color:#000;border-color:var(--blue)}

/* ─── Nightly Count Screen ─── */
.count-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(51,51,51,.25);flex-wrap:wrap}
.count-row:hover{background:rgba(162,204,235,.03)}
.count-row .flav-name{flex:1;min-width:140px;font-weight:500;font-size:14px}
.count-row .prev-count{font-size:11px;color:var(--gray);font-weight:400;margin-left:6px}
.count-row .variance-warn{font-size:10px;color:var(--yellow);margin-left:6px;font-weight:600}
.quick-btns{display:flex;gap:3px;flex-wrap:wrap}
.quick-btn{min-width:34px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:#ccc;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;font-family:inherit}
.quick-btn:hover{border-color:var(--gray)}
.quick-btn.active{background:var(--blue);color:#000;border-color:var(--blue)}
.quick-btn.custom{background:var(--card);color:var(--blue);font-style:italic}
.quick-btn.not-stocked{background:transparent;color:var(--gray2);font-size:10px;padding:6px 10px}
.quick-btn.not-stocked.active{background:var(--gray2);color:#fff;border-color:var(--gray2)}
.custom-input{width:56px;background:var(--bg);border:1px solid var(--blue);border-radius:6px;padding:6px 8px;color:#fff;font-size:13px;text-align:center;font-family:inherit}
.count-row.counted{background:rgba(76,175,80,.04)}
.count-row.not-stocked{opacity:.6}

/* Count status banner */
.count-status{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.count-chip{flex:1;min-width:180px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px}
.count-chip .icon{font-size:16px}
.count-chip.ok{border-left:3px solid var(--green)}
.count-chip.stale{border-left:3px solid var(--yellow)}
.count-chip.missing{border-left:3px solid var(--red)}
.count-chip .label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px}
.count-chip .value{font-size:13px;font-weight:600;margin-top:1px}
.count-chip .who{font-size:11px;color:var(--gray);margin-top:1px}

/* Production plan */
.plan-section{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:10px}
.plan-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.plan-row{display:grid;grid-template-columns:minmax(140px,2fr) 1fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(51,51,51,.15);font-size:13px}
.plan-row:last-child{border-bottom:none}
.plan-row .flav{font-weight:500}
.plan-row .num{text-align:center;font-weight:600}
.plan-row .small{font-size:11px;color:var(--gray)}
.plan-row .batches{background:var(--blue);color:#000;padding:4px 10px;border-radius:6px;font-weight:700;text-align:center;min-width:60px}
.plan-row.critical .flav{color:var(--red)}
.stocked-chips{display:flex;flex-wrap:wrap;gap:6px}
.stocked-chip{padding:4px 10px;border-radius:6px;background:rgba(76,175,80,.08);color:var(--green);font-size:12px}
.summary-box{background:var(--bg);border:1px solid var(--blue);border-radius:10px;padding:14px;margin-top:12px}
.summary-box h4{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;margin-bottom:8px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:8px}
.summary-item{text-align:center}
.summary-item .val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--blue)}
.summary-item .lbl{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}

/* Variance confirm modal */
.confirm-modal{background:var(--card);border:2px solid var(--yellow);border-radius:12px;padding:20px;max-width:420px}
@media(max-width:900px){
  header{flex-direction:column;gap:8px;padding:10px 14px}
  .nav{flex-wrap:wrap;justify-content:center}
  .header-logo{height:28px}
  .plan-row{grid-template-columns:1fr 1fr;font-size:12px}
  .plan-row .small{display:none}
}
@media(max-width:600px){
  .stats{flex-direction:column}
  .stat{min-width:auto}
  main{padding:12px}
  .nav button{font-size:10px;padding:6px 8px}
  .count-row .flav-name{min-width:100%}
  .quick-btn{min-width:30px;padding:5px 6px;font-size:11px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const CIRCLE_LOGO = '/api/config'; // placeholder - will use text instead
const { useState, useEffect, useCallback } = React;

let AUTH_TOKEN = null;
const api = async (endpoint, body = {}) => {
  const r = await fetch(`/api/${endpoint}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${AUTH_TOKEN}` },
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
};
const db = (table, action, opts = {}) => api('db', { table, action, ...opts });

const sColor = (cur, par) => !par ? '#666' : cur/par >= .7 ? 'var(--green)' : cur/par >= .4 ? 'var(--yellow)' : 'var(--red)';
const Dot = ({color}) => <span className="dot" style={{background:color}}/>;
const Tag = ({children,color}) => <span className="tag" style={{background:(color||'var(--blue)')+'20',color:color||'var(--blue)'}}>{children}</span>;
const Bar = ({pct,color}) => {
  const safePct = isNaN(pct) ? 0 : pct;
  return (
    <div className="bar-wrap">
      <div className="bar"><div className="bar-fill" style={{width:`${Math.min(safePct,100)}%`,background:color}}/></div>
      <span style={{fontSize:11,color,fontWeight:600,minWidth:32}}>{Math.round(safePct)}%</span>
    </div>
  );
};
const Stat = ({value,label,color}) => (
  <div className="stat">
    <div className="stat-val" style={{color:color||'#fff'}}>{value}</div>
    <div className="stat-lbl">{label}</div>
  </div>
);

// ─── LOGIN ──────────────────────────
function LoginScreen({onLogin}) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const tryLogin = async () => {
    setLoading(true); setErr('');
    AUTH_TOKEN = pw;
    try {
      await db('flavors', 'select', { limit: 1 });
      localStorage.setItem('jojo_inv_token', pw);
      onLogin();
    } catch(e) { setErr('Invalid password'); AUTH_TOKEN = null; }
    setLoading(false);
  };
  return (
    <div className="login-wrap">
      <div className="login-box">
        <div style={{width:100,height:100,borderRadius:'50%',background:'var(--blue)',margin:'0 auto 20px',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span className="serif" style={{fontSize:28,color:'#000',fontWeight:700}}>JJ</span>
        </div>
        <h2 className="serif" style={{fontSize:22,marginBottom:4}}>Inventory Tracker</h2>
        <p style={{color:'var(--gray)',fontSize:13,marginBottom:24}}>JoJo's Cookie Co.</p>
        <input className="input-wide" type="password" placeholder="Enter password" value={pw}
          onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&tryLogin()}
          style={{marginBottom:12,textAlign:'center'}} autoFocus />
        {err && <p style={{color:'var(--red)',fontSize:12,marginBottom:8}}>{err}</p>}
        <button className="btn btn-blue" onClick={tryLogin} disabled={loading}
          style={{width:'100%',padding:'10px',fontSize:14}}>{loading?'Checking...':'Sign In'}</button>
      </div>
    </div>
  );
}

// ─── NIGHTLY COUNT TAB (replaces old DoughTab + InitialSetup) ───────────────
function DoughTab({loc, setLoc, flavors, dashData, onSaved}) {
  const locId = loc === 'petoskey' ? 1 : 2;
  const locName = loc === 'petoskey' ? 'Petoskey' : 'Traverse City';
  const storageKey = `jojo_count_draft_${locId}`;

  // Nightly count only operates on LIVE flavors — pre_production flavors have no bins yet
  const liveFlavors = flavors.filter(f => f.status === 'live' || !f.status);

  const [employees, setEmployees] = useState([]);
  const [countedBy, setCountedBy] = useState('');
  const [counts, setCounts] = useState({});       // {flavorId: '0.5' or number}
  const [notStocked, setNotStocked] = useState({}); // {flavorId: true}
  const [notes, setNotes] = useState('');
  const [saving, setSaving] = useState(false);
  const [confirmFlavor, setConfirmFlavor] = useState(null); // variance confirm
  const [saveMsg, setSaveMsg] = useState('');

  // Previous counts (for reference + variance detection)
  const [prevCounts, setPrevCounts] = useState({}); // {flavorId: number}

  // Load employees + previous night's counts + any local draft on mount / loc change
  useEffect(() => {
    (async () => {
      const {data: emps} = await db('employees','select',{filters:{active:true},orderBy:'name'});
      setEmployees(emps || []);

      // Get previous (most recent) count per flavor at this location
      const prev = {};
      for (const f of liveFlavors) {
        const {data} = await db('inventory_snapshots','select',{
          filters:{flavor_id:f.id,location_id:locId},
          orderBy:'created_at:desc',
          limit:1
        });
        if (data && data.length > 0 && data[0].actual_bins !== null) {
          prev[f.id] = Number(data[0].actual_bins);
        }
      }
      setPrevCounts(prev);

      // Restore local draft if present (survives refresh/sleep)
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) {
          const draft = JSON.parse(raw);
          const ageMs = Date.now() - (draft.savedAt || 0);
          // Only restore drafts younger than 18 hours
          if (ageMs < 18 * 3600000) {
            if (draft.counts) setCounts(draft.counts);
            if (draft.notStocked) setNotStocked(draft.notStocked);
            if (draft.countedBy) setCountedBy(draft.countedBy);
            if (draft.notes) setNotes(draft.notes);
          } else {
            localStorage.removeItem(storageKey);
          }
        }
      } catch(e) { /* ignore parse errors */ }
    })();
  }, [locId, flavors]);

  // Persist draft whenever it changes
  useEffect(() => {
    if (Object.keys(counts).length === 0 && Object.keys(notStocked).length === 0 && !countedBy && !notes) return;
    try {
      localStorage.setItem(storageKey, JSON.stringify({
        counts, notStocked, countedBy, notes, savedAt: Date.now()
      }));
    } catch(e) { /* quota or disabled */ }
  }, [counts, notStocked, countedBy, notes, storageKey]);

  const setCount = (fId, val) => {
    setCounts(c => ({...c, [fId]: val}));
    setNotStocked(ns => {
      if (ns[fId]) { const next = {...ns}; delete next[fId]; return next; }
      return ns;
    });
  };

  const toggleNotStocked = (fId) => {
    setNotStocked(ns => {
      const next = {...ns};
      if (next[fId]) delete next[fId];
      else next[fId] = true;
      return next;
    });
    setCounts(c => { const n = {...c}; delete n[fId]; return n; });
  };

  // Variance check for one flavor: flag if >2x or <0.5x previous, and value is nonzero
  const hasVariance = (fId, val) => {
    const prev = prevCounts[fId];
    if (prev === undefined || prev === null) return false;
    const num = parseFloat(val);
    if (isNaN(num)) return false;
    if (prev === 0 && num > 3) return true; // big jump from zero
    if (prev > 0) {
      if (num > prev * 2.5) return true;
      if (num < prev * 0.3 && prev > 1) return true;
    }
    return false;
  };

  // Completion status for save button
  const totalFlavors = liveFlavors.length;
  const completedFlavors = liveFlavors.filter(f =>
    notStocked[f.id] || (counts[f.id] !== undefined && counts[f.id] !== '')
  ).length;
  const ready = countedBy && completedFlavors === totalFlavors;

  const doSave = async () => {
    setSaving(true);
    setSaveMsg('');
    const today = new Date().toISOString().split('T')[0];

    try {
      for (const f of liveFlavors) {
        const isNotStocked = !!notStocked[f.id];
        const raw = counts[f.id];
        const val = isNotStocked ? null : (raw === '' || raw === undefined ? null : parseFloat(raw));

        // Upsert by flavor+loc+date — last save for the day wins
        await db('inventory_snapshots','upsert',{data:{
          flavor_id: f.id,
          location_id: locId,
          date: today,
          actual_bins: val,
          calculated_bins: val,
          counted_by: countedBy,
          notes: notes || null
        }});
      }

      // Clear draft
      localStorage.removeItem(storageKey);
      setCounts({});
      setNotStocked({});
      setNotes('');

      // Check if the other location still needs a count
      const otherLocId = locId === 1 ? 2 : 1;
      const otherLocName = locId === 1 ? 'Traverse City' : 'Petoskey';
      const otherCf = dashData?.countFreshness?.[otherLocId];
      const otherDone = otherCf && !otherCf.missing && otherCf.hoursAgo !== null && otherCf.hoursAgo < 18;

      if (!otherDone) {
        setSaveMsg(`✓ ${locName} saved — don't forget ${otherLocName}!`);
        setTimeout(()=>setSaveMsg(''), 6000);
      } else {
        setSaveMsg(`✓ Count saved for ${locName} — both locations complete!`);
        setTimeout(()=>setSaveMsg(''), 4000);
      }
      if (onSaved) onSaved();
    } catch(e) {
      setSaveMsg('Error saving: ' + e.message);
    }
    setSaving(false);
  };

  const handleSaveClick = () => {
    // Check for any unconfirmed variances
    const variant = liveFlavors.find(f => {
      if (notStocked[f.id]) return false;
      return hasVariance(f.id, counts[f.id]);
    });
    if (variant) {
      setConfirmFlavor(variant);
      return;
    }
    doSave();
  };

  const renderFlavorRow = (f) => {
    const curVal = counts[f.id] !== undefined ? String(counts[f.id]) : '';
    const isNS = !!notStocked[f.id];
    const prev = prevCounts[f.id];
    const presets = ['0','0.25','0.5','0.75','1','2','3','4','5'];
    const showCustom = curVal !== '' && !presets.includes(curVal);
    const counted = isNS || curVal !== '';
    const variance = hasVariance(f.id, curVal);

    return (
      <div key={f.id} className={`count-row ${counted ? 'counted' : ''} ${isNS ? 'not-stocked' : ''}`}>
        <div className="flav-name">
          {f.name}
          {prev !== undefined && <span className="prev-count">last: {prev}</span>}
          {variance && <span className="variance-warn">⚠ variance</span>}
        </div>
        <div className="quick-btns">
          {presets.map(p => (
            <button key={p}
              className={`quick-btn ${curVal===p && !isNS ? 'active' : ''}`}
              onClick={()=>setCount(f.id, p)}>
              {p === '0.25' ? '¼' : p === '0.5' ? '½' : p === '0.75' ? '¾' : p === '5' ? '5' : p}
            </button>
          ))}
          {showCustom ? (
            <input
              className="custom-input"
              type="number" step="0.25" min="0"
              value={curVal}
              onChange={e=>setCount(f.id, e.target.value)}
              onBlur={e=>{ if (e.target.value === '') setCounts(c=>{const n={...c};delete n[f.id];return n;}); }}
            />
          ) : (
            <button className="quick-btn custom" onClick={()=>{
              const v = prompt(`Enter count for ${f.name} (bins, supports decimals like 1.5):`, prev !== undefined ? String(prev) : '');
              if (v !== null && v !== '') setCount(f.id, v);
            }}>custom</button>
          )}
          <button
            className={`quick-btn not-stocked ${isNS ? 'active' : ''}`}
            onClick={()=>toggleNotStocked(f.id)}>
            {isNS ? '✓ Not stocked' : 'Not stocked'}
          </button>
        </div>
      </div>
    );
  };

  // Nightly count only shows live flavors — pre_production flavors have no bins yet
  const classics = liveFlavors.filter(f=>f.type==='classic');
  const specialties = liveFlavors.filter(f=>f.type==='specialty');
  const extras = liveFlavors.filter(f=>f.type==='extra');

  const countFreshness = dashData?.countFreshness || {};
  const fmtHours = (h) => {
    if (h === null || h === undefined) return 'never';
    if (h < 1) return 'just now';
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h/24);
    return `${d}d ${h%24}h ago`;
  };

  return (
    <div>
      {/* Location switcher — big and unmissable */}
      <div className="card" style={{padding:'14px 16px',marginBottom:12}}>
        <div style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'1px',fontWeight:700,marginBottom:10}}>
          Which location are you counting tonight?
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[
            {id:1, key:'petoskey', name:'Petoskey'},
            {id:2, key:'tc', name:'Traverse City'}
          ].map(location => {
            const active = loc === location.key;
            const cf = countFreshness[location.id];
            const done = cf && !cf.missing && cf.hoursAgo !== null && cf.hoursAgo < 18;
            return (
              <button key={location.key}
                onClick={()=>setLoc(location.key)}
                style={{
                  padding:'16px 14px',
                  borderRadius:10,
                  border: active ? '2px solid var(--blue)' : '2px solid var(--border)',
                  background: active ? 'rgba(162,204,235,.08)' : 'var(--bg)',
                  color:'#fff',
                  cursor:'pointer',
                  textAlign:'left',
                  fontFamily:'inherit',
                  transition:'all .15s'
                }}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <span className="serif" style={{fontSize:17,fontWeight:700,color:active?'var(--blue)':'#fff'}}>
                    {location.name}
                  </span>
                  {done
                    ? <span style={{fontSize:11,color:'var(--green)',fontWeight:700}}>✓ COUNTED</span>
                    : <span style={{fontSize:11,color:'var(--yellow)',fontWeight:700}}>○ NEEDS COUNT</span>}
                </div>
                <div style={{fontSize:11,color:'var(--gray)'}}>
                  {cf && !cf.missing
                    ? <>Last count {fmtHours(cf.hoursAgo)}{cf.countedBy ? ` by ${cf.countedBy}` : ''}</>
                    : 'No count on record'}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,flexWrap:'wrap',gap:10}}>
          <div>
            <h3>Counting {locName}</h3>
            <p className="sub">Count each flavor before close. Draft auto-saves. Tap Save when done.</p>
          </div>
          <div style={{fontSize:12,color:'var(--gray)'}}>
            {completedFlavors} of {totalFlavors} counted
          </div>
        </div>

        <div style={{display:'flex',gap:10,marginTop:10,marginBottom:4,flexWrap:'wrap'}}>
          <select className="select" style={{flex:1,minWidth:200,maxWidth:300}}
            value={countedBy} onChange={e=>setCountedBy(e.target.value)}>
            <option value="">Counted by...</option>
            {employees.map(e=><option key={e.id} value={e.name}>{e.name}</option>)}
          </select>
          {employees.length === 0 && (
            <span style={{fontSize:11,color:'var(--yellow)',alignSelf:'center'}}>
              Add employees in Settings first
            </span>
          )}
        </div>
      </div>

      {classics.length > 0 && <div className="card">
        <h3 style={{color:'var(--blue)',marginBottom:4}}>Classics</h3>
        <div>{classics.map(renderFlavorRow)}</div>
      </div>}

      {specialties.length > 0 && <div className="card">
        <h3 style={{color:'var(--orange)',marginBottom:4}}>Monthly Specialties</h3>
        <div>{specialties.map(renderFlavorRow)}</div>
      </div>}

      {extras.length > 0 && <div className="card">
        <h3 style={{color:'var(--green)',marginBottom:4}}>Extras</h3>
        <div>{extras.map(renderFlavorRow)}</div>
      </div>}

      <div className="card">
        <input className="input-wide" placeholder="Notes (optional — spilled bin, found extras, etc.)"
          value={notes} onChange={e=>setNotes(e.target.value)}/>
        <div style={{display:'flex',gap:10,marginTop:12,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn btn-outline"
            onClick={()=>{
              if (confirm('Clear all entries for this count?')) {
                setCounts({}); setNotStocked({}); setNotes('');
                localStorage.removeItem(storageKey);
              }
            }}>Clear</button>
          <button className="btn btn-green"
            onClick={handleSaveClick}
            disabled={!ready || saving}
            style={{padding:'10px 24px',fontSize:14,flex:1,maxWidth:300}}>
            {saving ? 'Saving…' : ready ? `✓ Save Count for ${locName}` : countedBy ? `Count all flavors (${totalFlavors - completedFlavors} left)` : 'Select employee & count all flavors'}
          </button>
          {saveMsg && <span style={{color: saveMsg.startsWith('✓') ? 'var(--green)' : 'var(--red)',fontSize:13,fontWeight:600}}>{saveMsg}</span>}
        </div>
      </div>

      {/* Variance confirm modal */}
      {confirmFlavor && (
        <div className="modal-overlay" onClick={()=>setConfirmFlavor(null)}>
          <div className="confirm-modal" onClick={e=>e.stopPropagation()}>
            <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:'var(--yellow)',marginBottom:10}}>⚠ Double-check this count</h3>
            <p style={{fontSize:13,lineHeight:1.5,marginBottom:14}}>
              <strong>{confirmFlavor.name}</strong>: you entered <strong>{counts[confirmFlavor.id]}</strong> bins.<br/>
              Last count was <strong>{prevCounts[confirmFlavor.id]}</strong> bins.<br/>
              <span style={{color:'var(--gray)'}}>That's a big change. Make sure the number is right.</span>
            </p>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setConfirmFlavor(null)}>Go back & fix</button>
              <button className="btn btn-blue" style={{flex:1}} onClick={()=>{setConfirmFlavor(null);doSave();}}>Yes, that's right</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PRODUCTION PLAN ────────────────────────────────────────────────────────
function ProductionTab({dashData}) {
  const plan = dashData?.productionPlan || [];
  const alerts = dashData?.alerts || [];
  const projDays = dashData?.projectionDays || 14;
  const countFreshness = dashData?.countFreshness || {};
  const thisWeek = dashData?.thisWeek || {totalBatches:0,byBase:{},byFlavor:{}};
  const batchesByBase = dashData?.summary?.batchesByBase || {};

  const needs = plan.filter(p=>p.needsProduction);
  const stocked = plan.filter(p=>!p.needsProduction);
  const totalBatches = needs.reduce((s,p)=>s+p.batches,0);

  const fmtHours = (h) => {
    if (h === null || h === undefined) return 'never';
    if (h < 1) return 'just now';
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h/24);
    return `${d}d ${h%24}h ago`;
  };

  const renderCountChip = (locId, locName) => {
    const cf = countFreshness[locId];
    if (!cf || cf.missing) {
      return (
        <div className="count-chip missing">
          <span className="icon">●</span>
          <div><div className="label">{locName}</div><div className="value">No count yet</div></div>
        </div>
      );
    }
    const klass = cf.stale ? 'stale' : 'ok';
    return (
      <div className={`count-chip ${klass}`}>
        <span className="icon">{cf.stale ? '⚠' : '✓'}</span>
        <div>
          <div className="label">{locName}</div>
          <div className="value">Counted {fmtHours(cf.hoursAgo)}</div>
          {cf.countedBy && <div className="who">by {cf.countedBy}</div>}
        </div>
      </div>
    );
  };

  return (
    <div>
      {/* Count status */}
      <div className="count-status">
        {renderCountChip(1, 'Petoskey')}
        {renderCountChip(2, 'Traverse City')}
      </div>

      <div className="stats">
        <Stat value={totalBatches} label="Batches Needed Next Week"/>
        <Stat value={needs.length} label="Flavors Need Dough" color="var(--orange)"/>
        <Stat value={stocked.length} label="Stocked" color="var(--green)"/>
        <Stat value={`${projDays}d`} label="Projection Window"/>
      </div>

      {/* Alerts */}
      {alerts.length > 0 && (
        <div className="card">
          <h3>⚠️ Alerts</h3>
          <div style={{marginTop:10}}>
            {alerts.map((a,i) => <div key={i} className={`alert alert-${a.type}`}>{a.message}</div>)}
          </div>
        </div>
      )}

      {/* This week's production so far */}
      {thisWeek.totalBatches > 0 && (
        <div className="card" style={{padding:'14px 18px'}}>
          <h3 style={{fontSize:13,marginBottom:8}}>This Week's Production So Far</h3>
          <div style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'center'}}>
            <div><span className="serif" style={{fontSize:22,fontWeight:700,color:'var(--green)'}}>{thisWeek.totalBatches}</span> <span style={{fontSize:12,color:'var(--gray)'}}>batches logged</span></div>
            {Object.entries(thisWeek.byBase).sort((a,b)=>b[1]-a[1]).map(([base,cnt]) => (
              <div key={base} style={{fontSize:12,color:'var(--gray)'}}>
                <span style={{color:'#fff',fontWeight:600}}>{cnt}</span> {cnt===1?'batch':'batches'} <span>{base}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Batch-to-base summary for upcoming production */}
      {Object.keys(batchesByBase).length > 0 && (
        <div className="card" style={{padding:'14px 18px'}}>
          <h3 style={{fontSize:13,marginBottom:10}}>Next Production Cycle — Base Dough Summary</h3>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {Object.entries(batchesByBase).sort((a,b)=>b[1]-a[1]).map(([base,cnt]) => (
              <div key={base} style={{background:'var(--bg)',borderRadius:8,padding:'8px 14px',display:'flex',alignItems:'center',gap:8}}>
                <span className="serif" style={{fontSize:20,fontWeight:700,color:'var(--blue)'}}>{cnt}</span>
                <span style={{fontSize:12,color:'var(--gray)'}}>{cnt===1?'batch':'batches'} of <span style={{color:'#fff',fontWeight:600}}>{base}</span></span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Production plan — flavors needing production */}
      <div className="card">
        <h3>Production Plan <Tag>next {projDays} days</Tag></h3>
        <p className="sub">Bins needed to keep both locations at par through the full production cycle (order Tue → truck Wed → prep Wed-Sun → dough Mon-Tue).</p>
        {needs.length > 0 ? (
          <table>
            <thead><tr>
              <th>Flavor</th>
              <th className="c">On Hand</th>
              <th className="c">Velocity /wk</th>
              <th className="c">Demand {projDays}d</th>
              <th className="c">Projected End</th>
              <th className="c">Batches</th>
            </tr></thead>
            <tbody>{needs.map(p => (
              <tr key={p.flavor.id} className={p.critical?'critical':''}>
                <td>
                  <Dot color={p.critical?'var(--red)':p.batches>=3?'var(--yellow)':'var(--blue)'}/>
                  <span style={{fontWeight:500}}>{p.flavor.name}</span>
                  {p.tcNeedsTransfer && <Tag color="var(--blue)">TC TRANSFER</Tag>}
                  {p.upcomingDemand > 0 && <Tag color="var(--orange)">+{p.upcomingDemand} order</Tag>}
                  {!p.velocityReliable && <Tag color="var(--gray)">LIMITED DATA</Tag>}
                </td>
                <td className="c" style={{fontWeight:600}}>{p.current}
                  <div style={{fontSize:10,color:'var(--gray)',fontWeight:400}}>P:{p.petoskey} TC:{p.tc}</div>
                </td>
                <td className="c" style={{color:'var(--gray)'}}>{p.velocity}</td>
                <td className="c" style={{color:'var(--gray)'}}>{p.totalDemand}</td>
                <td className="c" style={{color:p.endingWithoutProduction<0?'var(--red)':p.endingWithoutProduction<p.targetEnding?'var(--yellow)':'var(--gray)',fontWeight:p.endingWithoutProduction<0?700:400}}>{p.endingWithoutProduction}</td>
                <td className="c">
                  <span className="serif" style={{background:'rgba(162,204,235,.15)',color:'var(--blue)',fontWeight:700,padding:'4px 12px',borderRadius:6,fontSize:14}}>{p.batches}</span>
                </td>
              </tr>
            ))}</tbody>
          </table>
        ) : (
          <p style={{color:'var(--green)',padding:20,textAlign:'center'}}>✓ All flavors stocked through the projection window.</p>
        )}

        {stocked.length > 0 && (
          <div style={{marginTop:14}}>
            <div className="section-label" style={{color:'var(--green)'}}>Stocked — Skip Next Week</div>
            <div className="stocked-chips" style={{padding:'0 12px'}}>
              {stocked.map(p => (
                <span key={p.flavor.id} className="stocked-chip">
                  {p.flavor.name} ({p.current})
                </span>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── PREP LIST ──────────────────────
function PrepListTab({dashData}) {
  const [prepData, setPrepData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    (async () => {
      try {
        const plan = dashData?.productionPlan?.filter(p=>p.needsProduction).map(p=>({flavor_id:p.flavor.id,batch_count:p.batches})) || [];
        if (plan.length === 0) { setPrepData({ bases:[], subRecipes:[], addOns:[], totalBatches:0 }); setLoading(false); return; }
        const data = await api('prep-list', { batches: plan });
        setPrepData(data);
      } catch(e) { console.error(e); }
      setLoading(false);
    })();
  }, [dashData]);

  if (loading) return <div className="card"><p style={{color:'var(--gray)',padding:20,textAlign:'center'}}>Building prep list...</p></div>;
  if (!prepData || prepData.totalBatches === 0) return <div className="card"><p style={{color:'var(--green)',padding:20,textAlign:'center'}}>✓ No production planned — no prep needed.</p></div>;

  const typeColors = { frosting:'var(--blue)', center:'var(--orange)', glaze:'var(--yellow)' };

  return (
    <div>
      <div className="stats">
        <Stat value={prepData.totalBatches} label="Total Batches"/>
        <Stat value={prepData.bases.length} label="Base Doughs to Mix"/>
        <Stat value={prepData.subRecipes.length} label="Frostings/Centers"/>
        <Stat value={prepData.addOns.length} label="Add-On Ingredients"/>
      </div>

      <div className="card">
        <h3>🥣 Base Doughs to Mix</h3>
        <p className="sub">Mix these bases first. Each batch makes ~300 cookies worth of dough.</p>
        {prepData.bases.map((b,i) => (
          <div key={i} className="prep-group">
            <h4>
              <span style={{color:'var(--blue)'}} className="serif">{b.totalBatches}×</span>
              {b.base.name || b.base.label}
              <span style={{fontSize:11,color:'var(--gray)',fontWeight:400}}>for {b.flavors.map(f=>`${f.name} (${f.batches})`).join(', ')}</span>
            </h4>
            {b.ingredients.map((ing,j) => (
              <div key={j} className="prep-item">
                <span>{ing.name}</span>
                <span style={{color:'var(--blue)',fontWeight:600}}>{ing.total_grams.toLocaleString()}g</span>
              </div>
            ))}
          </div>
        ))}
      </div>

      {prepData.subRecipes.length > 0 && (
        <div className="card">
          <h3>🧁 Frostings, Centers & Glazes</h3>
          <p className="sub">Prep these alongside or after base doughs.</p>
          {prepData.subRecipes.map((sr,i) => (
            <div key={i} className="prep-group">
              <h4>
                <Tag color={typeColors[sr.subRecipe.type]||'var(--gray)'}>{sr.subRecipe.type.toUpperCase()}</Tag>
                {sr.subRecipe.name}
                <span style={{fontSize:11,color:'var(--gray)',fontWeight:400}}>for {sr.flavors.map(f=>f.name).join(', ')} ({sr.totalCookies} cookies)</span>
              </h4>
              {sr.ingredients.map((ing,j) => (
                <div key={j} className="prep-item">
                  <span>{ing.name}</span>
                  <span style={{color:'var(--orange)',fontWeight:600}}>{ing.total_grams.toLocaleString()}g</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {prepData.addOns.length > 0 && (
        <div className="card">
          <h3>🍫 Add-On Ingredients to Pull</h3>
          <p className="sub">Pull these from pantry before production day. Amounts for all planned batches.</p>
          <table>
            <thead><tr><th>Ingredient</th><th className="c">Amount</th><th>Used In</th></tr></thead>
            <tbody>{prepData.addOns.map((ao,i) => (
              <tr key={i}>
                <td style={{fontWeight:500}}>{ao.name}</td>
                <td className="c" style={{fontWeight:600,color:'var(--green)'}}>{ao.total_grams.toLocaleString()}g</td>
                <td style={{fontSize:12,color:'var(--gray)'}}>{ao.flavors.map(f=>f.name).join(', ')}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

                    <td className="c" style={{color:'var(--gray)'}}>{i.par_level || '—'}</td>
                    <td className="c"><span style={{fontWeight:700,color:sc,background:sc.replace('var(','rgba(').replace(')','')+',0.12)',padding:'3px 10px',borderRadius:5}}>{i.need_to_order} {i.unit}</span></td>

                <tr key={i.ingredient.id}>
                  <td><Dot color="var(--green)"/><span style={{fontWeight:500,color:'var(--gray)'}}>{i.ingredient.nickname||i.ingredient.name}</span></td>
                  <td className="c" style={{color:'var(--gray)'}}>{i.on_hand} {i.unit}</td>
                  <td className="c" style={{color:'var(--gray)'}}>{i.par_level || '—'}</td>
                  <td className="c" style={{color:'var(--green)'}}>—</td>
                  <td><Bar pct={i.par_level > 0 ? i.on_hand/i.par_level*100 : 0} color="var(--green)"/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ))}
    </div>
  );
}

// ─── MANUAL ORDERS ──────────────────
function ManualOrdersTab({flavors}) {
  const [orders, setOrders] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [newOrder, setNewOrder] = useState({order_type:'catering',customer_name:'',fulfillment_date:'',notes:'',items:[]});
  const [newItem, setNewItem] = useState({flavor_id:'',quantity:'',cookie_oz:4});
  const load = () => db('manual_orders','select',{select:'*, manual_order_items(*)',orderBy:'fulfillment_date'}).then(d=>setOrders(d.data||[]));
  useEffect(() => { load(); }, []);
  const addItem = () => {
    if (!newItem.flavor_id || !newItem.quantity) return;
    setNewOrder({...newOrder, items:[...newOrder.items, {...newItem, flavor_name: flavors.find(f=>f.id==newItem.flavor_id)?.name}]});
    setNewItem({flavor_id:'',quantity:'',cookie_oz:4});
  };
  const saveOrder = async () => {
    try {
      const {data} = await db('manual_orders','insert',{data:{order_type:newOrder.order_type, customer_name:newOrder.customer_name, fulfillment_date:newOrder.fulfillment_date||null, notes:newOrder.notes, location_id:1}});
      if (data?.[0]) for (const item of newOrder.items) await db('manual_order_items','insert',{data:{manual_order_id:data[0].id, flavor_id:parseInt(item.flavor_id), quantity:parseInt(item.quantity), cookie_oz:parseFloat(item.cookie_oz), pack_size: item.cookie_oz==1?'mini-1oz':item.cookie_oz==2?'mini-2oz':'standard'}});
      setShowAdd(false); setNewOrder({order_type:'catering',customer_name:'',fulfillment_date:'',notes:'',items:[]}); load();
    } catch(e) { alert('Error: ' + e.message); }
  };
  const updateStatus = async (id, status) => { await db('manual_orders','update',{id,data:{status}}); load(); };
  return (
    <div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>

  const syncClover = async () => { setSyncing('clover'); try { const r = await api('clover',{since:new Date(Date.now()-86400000).toISOString()}); setResults(p=>({...p,clover:r.results})); } catch(e) { setResults(p=>({...p,clover:{errors:[e.message]}})); } setSyncing(null); };
  const syncShopify = async (days) => { 
    setSyncing('shopify'); 
    try { 
      const r = await api('shopify', { days: days || shopifyDays }); 
      setResults(p=>({...p,shopify:r.results, shopifyError:null})); 
    } catch(e) { 
      setResults(p=>({...p,shopify:null, shopifyError:e.message})); 
    }
