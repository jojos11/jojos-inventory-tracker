// ─── SETTINGS ───────────────────────
function SettingsTab({flavors, onRefresh}) {
  const [settingsTab, setSettingsTab] = useState('flavors');
  const [showAdd, setShowAdd] = useState(false);
  const [nf, setNf] = useState({name:'',type:'specialty',base_dough_id:'',is_stuffed:false,par_level_bins:6,restock_trigger_bins:3,status:'live',schedule_start_month:'',schedule_start_year:2026,schedule_end_month:'',schedule_end_year:2026,schedule_repeats:false});
  const [bases, setBases] = useState([]);
  const [pantryItems, setPantryItems] = useState([]);
  const [pantryEdits, setPantryEdits] = useState({});
  const [savingPantry, setSavingPantry] = useState(false);
  const [ingredients, setIngredients] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [newEmpName, setNewEmpName] = useState('');

  // Flavor lifecycle state
  const [allFlavors, setAllFlavors] = useState([]);   // includes retired
  const [schedule, setSchedule] = useState([]);        // flavor_schedule rows
  const [flavorEdits, setFlavorEdits] = useState({}); // {flavorId: {field: val}}
  const [savingFlavor, setSavingFlavor] = useState(null);
  const [showScheduleAdd, setShowScheduleAdd] = useState(false);
  const [newSched, setNewSched] = useState({flavor_id:'',start_month:'',start_year:2026,end_month:'',end_year:2026,repeats_annually:false,notes:''});
  const [showRetired, setShowRetired] = useState(false);

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthIdx = m => MONTHS.indexOf(m);

  useEffect(() => {
    db('base_doughs','select').then(d=>setBases(d.data||[]));
    loadPantry();
    loadEmployees();
    loadAllFlavors();
    loadSchedule();
  }, []);

  const loadAllFlavors = async () => {
    const {data} = await db('flavors','select',{orderBy:'type'});
    setAllFlavors(data || []);
  };

  const loadSchedule = async () => {
    const {data} = await db('flavor_schedule','select',{orderBy:'start_year'});
    setSchedule(data || []);
  };

  const loadEmployees = async () => {
    const {data} = await db('employees','select',{orderBy:'name'});
    setEmployees(data || []);
  };

  const addEmployee = async () => {
    const name = newEmpName.trim();
    if (!name) return;
    await db('employees','insert',{data:{name, active:true}});
    setNewEmpName('');
    loadEmployees();
  };

  const toggleEmployee = async (emp) => {
    await db('employees','update',{id:emp.id, data:{active:!emp.active}});
    loadEmployees();
  };

  const deleteEmployee = async (emp) => {
    if (!confirm(`Delete ${emp.name}? This cannot be undone. (Consider deactivating instead to preserve history.)`)) return;
    await db('employees','delete',{id:emp.id});
    loadEmployees();
  };

  const loadPantry = async () => {
    const {data: p} = await db('pantry','select',{orderBy:'ingredient_id'});
    const {data: ings} = await db('ingredients','select',{filters:{active:true},orderBy:'name'});
    setPantryItems(p || []);
    setIngredients(ings || []);
  };

  const addFlavor = async () => {
    if (!nf.name) return;
    // Insert the flavor
    const {data: inserted} = await db('flavors','insert',{data:{
      name:nf.name,
      type:nf.type,
      base_dough_id:nf.base_dough_id?parseInt(nf.base_dough_id):null,
      is_stuffed:nf.is_stuffed,
      bin_capacity_cookies:nf.is_stuffed?56:80,
      par_level_bins:parseFloat(nf.par_level_bins),
      restock_trigger_bins:parseFloat(nf.restock_trigger_bins),
      batch_size_cookies:300,
      status: nf.status,
      active: nf.status !== 'retired'
    }});
    // If a schedule was specified, create the schedule entry too
    if (inserted && inserted[0] && nf.schedule_start_month && nf.schedule_end_month) {
      await db('flavor_schedule','insert',{data:{
        flavor_id: inserted[0].id,
        start_month: nf.schedule_start_month,
        start_year: parseInt(nf.schedule_start_year),
        end_month: nf.schedule_end_month,
        end_year: parseInt(nf.schedule_end_year),
        repeats_annually: nf.schedule_repeats,
        notes: null
      }});
    }
    setShowAdd(false);
    setNf({name:'',type:'specialty',base_dough_id:'',is_stuffed:false,par_level_bins:6,restock_trigger_bins:3,status:'live',schedule_start_month:'',schedule_start_year:2026,schedule_end_month:'',schedule_end_year:2026,schedule_repeats:false});
    loadAllFlavors();
    loadSchedule();
    onRefresh();
  };

  // Change flavor status: pre_production | live | retired
  const setFlavorStatus = async (flavorId, newStatus) => {
    setSavingFlavor(flavorId);
    await db('flavors','update',{id:flavorId, data:{
      status: newStatus,
      active: newStatus !== 'retired'
    }});
    await loadAllFlavors();
    onRefresh();
    setSavingFlavor(null);
  };

  // Inline flavor edits
  const setFlavorField = (flavorId, field, val) => {
    setFlavorEdits(prev => ({...prev, [flavorId]: {...(prev[flavorId]||{}), [field]: val}}));
  };

  const saveFlavorEdit = async (flavorId) => {
    const edits = flavorEdits[flavorId];
    if (!edits) return;
    setSavingFlavor(flavorId);
    const data = {};
    if ('name' in edits) data.name = edits.name;
    if ('par_level_bins' in edits) data.par_level_bins = parseFloat(edits.par_level_bins);
    if ('restock_trigger_bins' in edits) data.restock_trigger_bins = parseFloat(edits.restock_trigger_bins);
    if ('is_stuffed' in edits) {
      data.is_stuffed = edits.is_stuffed;
      data.bin_capacity_cookies = edits.is_stuffed ? 56 : 80;
    }
    if ('base_dough_id' in edits) data.base_dough_id = edits.base_dough_id ? parseInt(edits.base_dough_id) : null;
    await db('flavors','update',{id:flavorId, data});
    setFlavorEdits(prev => { const n = {...prev}; delete n[flavorId]; return n; });
    await loadAllFlavors();
    onRefresh();
    setSavingFlavor(null);
  };

  const cancelFlavorEdit = (flavorId) => {
    setFlavorEdits(prev => { const n = {...prev}; delete n[flavorId]; return n; });
  };

  // Schedule operations
  const addSchedule = async () => {
    if (!newSched.flavor_id || !newSched.start_month || !newSched.end_month) return;
    await db('flavor_schedule','insert',{data:{
      flavor_id: parseInt(newSched.flavor_id),
      start_month: newSched.start_month,
      start_year: parseInt(newSched.start_year),
      end_month: newSched.end_month,
      end_year: parseInt(newSched.end_year),
      repeats_annually: newSched.repeats_annually,
      notes: newSched.notes || null
    }});
    setShowScheduleAdd(false);
    setNewSched({flavor_id:'',start_month:'',start_year:2026,end_month:'',end_year:2026,repeats_annually:false,notes:''});
    loadSchedule();
  };

  const deleteSchedule = async (id) => {
    if (!confirm('Delete this scheduled run?')) return;
    await db('flavor_schedule','delete',{id});
    loadSchedule();
  };

  // Month transition helper: determine what needs to change based on current date
  const getMonthTransitionPlan = () => {
    const now = new Date();
    const currentMonth = MONTHS[now.getMonth()];
    const currentYear = now.getFullYear();

    // Does a scheduled run "cover" this month? (accounting for annual repeats)
    const isActiveNow = (sched) => {
      const sMonth = monthIdx(sched.start_month), eMonth = monthIdx(sched.end_month);
      const sYear = sched.start_year, eYear = sched.end_year;
      const mIdx = monthIdx(currentMonth);

      if (sched.repeats_annually) {
        // Annual: ignore year, check month range
        if (sMonth <= eMonth) return mIdx >= sMonth && mIdx <= eMonth;
        return mIdx >= sMonth || mIdx <= eMonth; // wraps (e.g. Nov-Jan)
      }
      // One-off: must be within date range
      const curDate = currentYear * 12 + mIdx;
      const startDate = sYear * 12 + sMonth;
      const endDate = eYear * 12 + eMonth;
      return curDate >= startDate && curDate <= endDate;
    };

    const shouldBeLiveFlavorIds = new Set(
      schedule.filter(isActiveNow).map(s => s.flavor_id)
    );

    // Specialties currently live that shouldn't be (past their run)
    const toRetire = allFlavors.filter(f =>
      f.type === 'specialty' &&
      f.status === 'live' &&
      !shouldBeLiveFlavorIds.has(f.id)
    );

    // Specialties currently pre_production that should be live now
    const toGoLive = allFlavors.filter(f =>
      f.type === 'specialty' &&
      f.status === 'pre_production' &&
      shouldBeLiveFlavorIds.has(f.id)
    );

    // Retired specialties that are scheduled to run now (e.g. annual repeats)
    const toReactivate = allFlavors.filter(f =>
      f.type === 'specialty' &&
      f.status === 'retired' &&
      shouldBeLiveFlavorIds.has(f.id)
    );

    return { toRetire, toGoLive, toReactivate, currentMonth, currentYear };
  };

  const savePantryEdits = async () => {
    setSavingPantry(true);
    for (const [ingId, vals] of Object.entries(pantryEdits)) {
      const ingIdNum = parseInt(ingId);
      const existing = pantryItems.find(p => p.ingredient_id === ingIdNum);
      const ing = ingredients.find(i => i.id === ingIdNum);
      const data = {
        quantity_on_hand: parseFloat(vals.on_hand || 0),
        par_level: parseFloat(vals.par || 0),
        unit: ing?.order_unit || 'unit',
        updated_by: 'manager'
      };
      if (existing) {
        await db('pantry','update',{id:existing.id, data});
      } else {
        // Create new pantry row if it doesn't exist yet
        await db('pantry','insert',{data: {ingredient_id: ingIdNum, ...data}});
      }
    }
    setPantryEdits({});
    setSavingPantry(false);
    loadPantry();
  };

  const getPantryVal = (ingId, field) => {
    if (pantryEdits[ingId] && pantryEdits[ingId][field] !== undefined) return pantryEdits[ingId][field];
    const p = pantryItems.find(pi => pi.ingredient_id === ingId);
    return p ? (field === 'on_hand' ? p.quantity_on_hand : p.par_level) : 0;
  };

  const setPantryField = (ingId, field, val) => {
    setPantryEdits(prev => ({...prev, [ingId]: {...(prev[ingId]||{}), [field]: val}}));
  };

  const supplierNames = {1:'GFS',2:'Webstaurant',3:'Amazon'};

  return (
    <div>
      <div className="tab-pills">
        <button className={settingsTab==='flavors'?'active':''} onClick={()=>setSettingsTab('flavors')}>Flavors</button>
        <button className={settingsTab==='schedule'?'active':''} onClick={()=>setSettingsTab('schedule')}>Schedule</button>
        <button className={settingsTab==='pantry'?'active':''} onClick={()=>setSettingsTab('pantry')}>Pantry & Par Levels</button>
        <button className={settingsTab==='employees'?'active':''} onClick={()=>setSettingsTab('employees')}>Employees</button>
      </div>

      {settingsTab === 'flavors' && (() => {
        const liveFlavs = allFlavors.filter(f => f.status === 'live');
        const preProdFlavs = allFlavors.filter(f => f.status === 'pre_production');
        const retiredFlavs = allFlavors.filter(f => f.status === 'retired');
        const liveClassics = liveFlavs.filter(f => f.type === 'classic');
        const liveSpecialties = liveFlavs.filter(f => f.type === 'specialty');
        const liveExtras = liveFlavs.filter(f => f.type === 'extra');
        const transition = getMonthTransitionPlan();
        const needsTransition = transition.toRetire.length > 0 || transition.toGoLive.length > 0 || transition.toReactivate.length > 0;

        const renderFlavorRow = (f) => {
          const editing = flavorEdits[f.id];
          const isSaving = savingFlavor === f.id;
          const baseLetters = ['','A','B','C','D','F'];
          return (
            <tr key={f.id}>
              <td style={{fontWeight:500}}>
                {editing && 'name' in editing ? (
                  <input className="input-wide" style={{maxWidth:180}} value={editing.name} onChange={e=>setFlavorField(f.id,'name',e.target.value)}/>
                ) : (
                  <span onClick={()=>setFlavorField(f.id,'name',f.name)} style={{cursor:'text'}}>{f.name}</span>
                )}
              </td>
              <td>
                <Tag color={f.type==='classic'?'var(--blue)':f.type==='specialty'?'var(--orange)':'var(--green)'}>{f.type.toUpperCase()}</Tag>
              </td>
              <td className="c">
                {editing ? (
                  <select className="select" style={{width:80}} value={editing.base_dough_id ?? (f.base_dough_id||'')} onChange={e=>setFlavorField(f.id,'base_dough_id',e.target.value)}>
                    <option value="">—</option>
                    {bases.map(b=><option key={b.id} value={b.id}>{b.label||b.name}</option>)}
                  </select>
                ) : (f.base_dough_id ? baseLetters[f.base_dough_id] || '?' : '—')}
              </td>
              <td className="c">
                {editing ? (
                  <input type="checkbox" checked={editing.is_stuffed ?? f.is_stuffed} onChange={e=>setFlavorField(f.id,'is_stuffed',e.target.checked)}/>
                ) : (f.is_stuffed ? '✓' : '—')}
              </td>
              <td className="c" style={{color:'var(--gray)',fontSize:12}}>{f.bin_capacity_cookies}</td>
              <td className="c">
                {editing ? (
                  <input className="input" type="number" step="0.25" value={editing.par_level_bins ?? f.par_level_bins} onChange={e=>setFlavorField(f.id,'par_level_bins',e.target.value)}/>
                ) : f.par_level_bins}
              </td>
              <td className="c">
                {editing ? (
                  <input className="input" type="number" step="0.25" value={editing.restock_trigger_bins ?? f.restock_trigger_bins} onChange={e=>setFlavorField(f.id,'restock_trigger_bins',e.target.value)}/>
                ) : f.restock_trigger_bins}
              </td>
              <td className="c" style={{whiteSpace:'nowrap'}}>
                {editing ? (
                  <>
                    <button className="btn btn-green" style={{fontSize:10,padding:'3px 8px',marginRight:4}} onClick={()=>saveFlavorEdit(f.id)} disabled={isSaving}>{isSaving?'...':'Save'}</button>
                    <button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>cancelFlavorEdit(f.id)}>Cancel</button>
                  </>
                ) : (
                  <>
                    <button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px',marginRight:4}} onClick={()=>setFlavorField(f.id,'name',f.name)}>Edit</button>
                    {f.type !== 'classic' && f.status !== 'retired' && (
                      <button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px',color:'var(--red)',borderColor:'rgba(239,83,80,.3)'}} onClick={()=>{if(confirm(`Retire ${f.name}? Bins will sell through as-is.`))setFlavorStatus(f.id,'retired');}} disabled={isSaving}>Retire</button>
                    )}
                    {f.status === 'pre_production' && (
                      <button className="btn btn-blue" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>setFlavorStatus(f.id,'live')} disabled={isSaving}>Go Live</button>
                    )}
                  </>
                )}
              </td>
            </tr>
          );
        };

        const renderRetiredRow = (f) => {
          const isSaving = savingFlavor === f.id;
          return (
            <tr key={f.id} style={{opacity:.65}}>
              <td style={{fontWeight:500}}>{f.name}</td>
              <td><Tag color="var(--gray)">{f.type.toUpperCase()}</Tag></td>
              <td className="c" colSpan={5} style={{fontSize:12,color:'var(--gray)'}}>Retired — recipe preserved</td>
              <td className="c" style={{whiteSpace:'nowrap'}}>
                <button className="btn btn-green" style={{fontSize:10,padding:'3px 8px',marginRight:4}} onClick={()=>setFlavorStatus(f.id,'live')} disabled={isSaving}>Bring Back</button>
                <button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>setFlavorStatus(f.id,'pre_production')} disabled={isSaving}>Pre-production</button>
              </td>
            </tr>
          );
        };

        return (
          <>
            {/* Menu Overview */}
            <div className="card">
              <h3>Menu Overview</h3>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10,marginTop:10}}>
                <div style={{background:'var(--bg)',borderRadius:8,padding:12,borderLeft:'3px solid var(--green)'}}>
                  <div className="serif" style={{fontSize:22,fontWeight:700,color:'var(--green)'}}>{liveFlavs.length}</div>
                  <div style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.8px'}}>Live on Menu</div>
                  <div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>{liveClassics.length} classics · {liveSpecialties.length} specialties · {liveExtras.length} extras</div>
                </div>
                <div style={{background:'var(--bg)',borderRadius:8,padding:12,borderLeft:'3px solid var(--blue)'}}>
                  <div className="serif" style={{fontSize:22,fontWeight:700,color:'var(--blue)'}}>{preProdFlavs.length}</div>
                  <div style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.8px'}}>Pre-production</div>
                  <div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>{preProdFlavs.length > 0 ? preProdFlavs.map(f=>f.name).join(', ') : 'None scheduled'}</div>
                </div>
                <div style={{background:'var(--bg)',borderRadius:8,padding:12,borderLeft:'3px solid var(--gray2)'}}>
                  <div className="serif" style={{fontSize:22,fontWeight:700,color:'var(--gray)'}}>{retiredFlavs.length}</div>
                  <div style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.8px'}}>Retired</div>
                  <div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>Ready to bring back</div>
                </div>
              </div>
            </div>

            {/* Month Transition Card (only shows when needed) */}
            {needsTransition && (
              <div className="card" style={{borderLeft:'3px solid var(--yellow)'}}>
                <h3 style={{color:'var(--yellow)'}}>⚠ Menu Transition Needed — {transition.currentMonth} {transition.currentYear}</h3>
                <p className="sub">The schedule says your menu should look different right now. Review and apply.</p>

                {transition.toRetire.length > 0 && (
                  <div style={{marginTop:12}}>
                    <div className="section-label" style={{color:'var(--red)'}}>Should be retired (past scheduled run)</div>
                    {transition.toRetire.map(f => (
                      <div key={f.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid rgba(51,51,51,.15)'}}>
                        <span>{f.name}</span>
                        <div>
                          <button className="btn btn-outline" style={{fontSize:11,padding:'4px 10px',marginRight:6}} onClick={()=>setFlavorStatus(f.id,'retired')}>Retire</button>
                          <span style={{fontSize:11,color:'var(--gray)'}}>or keep it live manually</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {transition.toGoLive.length > 0 && (
                  <div style={{marginTop:12}}>
                    <div className="section-label" style={{color:'var(--blue)'}}>Ready to go live (currently in pre-production)</div>
                    {transition.toGoLive.map(f => (
                      <div key={f.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid rgba(51,51,51,.15)'}}>
                        <span>{f.name}</span>
                        <button className="btn btn-blue" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setFlavorStatus(f.id,'live')}>Go Live</button>
                      </div>
                    ))}
                  </div>
                )}

                {transition.toReactivate.length > 0 && (
                  <div style={{marginTop:12}}>
                    <div className="section-label" style={{color:'var(--green)'}}>Scheduled to return this month (currently retired)</div>
                    {transition.toReactivate.map(f => (
                      <div key={f.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid rgba(51,51,51,.15)'}}>
                        <span>{f.name}</span>
                        <div>
                          <button className="btn btn-green" style={{fontSize:11,padding:'4px 10px',marginRight:6}} onClick={()=>setFlavorStatus(f.id,'live')}>Bring Back Live</button>
                          <button className="btn btn-outline" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setFlavorStatus(f.id,'pre_production')}>Pre-production</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* All Flavors Table */}
            <div className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
                <div><h3>All Flavors</h3><p className="sub">Edit settings, change lifecycle status, add new flavors.</p></div>
                <button className="btn btn-blue" onClick={()=>setShowAdd(true)}>+ Add Flavor</button>
              </div>

              <table>
                <thead><tr><th>Flavor</th><th>Type</th><th className="c">Base</th><th className="c">Stuffed</th><th className="c">Bin Cap</th><th className="c">Par</th><th className="c">Trigger</th><th className="c" style={{width:200}}>Actions</th></tr></thead>
                <tbody>
                  {liveClassics.length > 0 && (<>
                    <tr><td colSpan={8} className="section-label" style={{color:'var(--blue)'}}>Classics ({liveClassics.length}) — always live</td></tr>
                    {liveClassics.map(renderFlavorRow)}
                  </>)}
                  {liveSpecialties.length > 0 && (<>
                    <tr><td colSpan={8} className="section-label" style={{color:'var(--orange)'}}>Live Specialties ({liveSpecialties.length})</td></tr>
                    {liveSpecialties.map(renderFlavorRow)}
                  </>)}
                  {liveExtras.length > 0 && (<>
                    <tr><td colSpan={8} className="section-label" style={{color:'var(--green)'}}>Extras ({liveExtras.length})</td></tr>
                    {liveExtras.map(renderFlavorRow)}
                  </>)}
                  {preProdFlavs.length > 0 && (<>
                    <tr><td colSpan={8} className="section-label" style={{color:'var(--blue)'}}>Pre-production ({preProdFlavs.length}) — in Production Plan, not in Nightly Count</td></tr>
                    {preProdFlavs.map(renderFlavorRow)}
                  </>)}
                </tbody>
              </table>

              {retiredFlavs.length > 0 && (
                <div style={{marginTop:20}}>
                  <button className="btn btn-outline" onClick={()=>setShowRetired(!showRetired)} style={{width:'100%',padding:'10px'}}>
                    {showRetired ? '▾' : '▸'} Retired Flavors ({retiredFlavs.length}) — click to {showRetired ? 'hide' : 'show'}
                  </button>
                  {showRetired && (
                    <table style={{marginTop:10}}>
                      <tbody>{retiredFlavs.map(renderRetiredRow)}</tbody>
                    </table>
                  )}
                </div>
              )}
            </div>
          </>
        );
      })()}

      {settingsTab === 'schedule' && (
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
            <div><h3>Flavor Schedule</h3><p className="sub">When each specialty runs. Annual repeats auto-return every year.</p></div>
            <button className="btn btn-blue" onClick={()=>setShowScheduleAdd(true)}>+ Add Scheduled Run</button>
          </div>
          {schedule.length === 0 ? (
            <p style={{color:'var(--gray)',padding:20,textAlign:'center',fontSize:13}}>No scheduled runs yet. Add one to plan a specialty's menu window.</p>
          ) : (
            <table>
              <thead><tr><th>Flavor</th><th className="c">Starts</th><th className="c">Ends</th><th className="c">Annual?</th><th>Notes</th><th className="c">Actions</th></tr></thead>
              <tbody>{schedule.sort((a,b)=>{
                const ay = a.start_year, by = b.start_year;
                if (ay !== by) return by - ay;
                return monthIdx(b.start_month) - monthIdx(a.start_month);
              }).map(s => {
                const flav = allFlavors.find(f => f.id === s.flavor_id);
                return (
                  <tr key={s.id}>
                    <td style={{fontWeight:500}}>{flav ? flav.name : `Flavor #${s.flavor_id}`}</td>
                    <td className="c">{s.start_month} {s.start_year}</td>
                    <td className="c">{s.end_month} {s.end_year}</td>
                    <td className="c">{s.repeats_annually ? <Tag color="var(--green)">ANNUAL</Tag> : '—'}</td>
                    <td style={{fontSize:12,color:'var(--gray)'}}>{s.notes || '—'}</td>
                    <td className="c"><button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px',color:'var(--red)',borderColor:'rgba(239,83,80,.3)'}} onClick={()=>deleteSchedule(s.id)}>Delete</button></td>
                  </tr>
                );
              })}</tbody>
            </table>
          )}
        </div>
      )}

      {settingsTab === 'pantry' && (() => {
        // Build a description string showing how big 1 order_unit is
        // For multi-unit cases: "1 case = 6 × 5 lbs (30 lbs)"
        // For single-unit cases: "1 bag = 50 lbs"
        const packDescription = (ing) => {
          if (!ing.order_unit) return '—';
          const unit = ing.order_unit;
          const units = ing.units_per_order_unit;
          const grams = ing.grams_per_order_unit;

          // Parse the unit_size field (e.g. "5.0 LB", "45.0 OZ", "2.0 LB")
          // to get the per-unit size for display
          let perUnitText = '';
          if (ing.unit_size) {
            // Clean up unit_size: "5.0 LB" -> "5 lbs"
            perUnitText = ing.unit_size
              .replace(/\.0\s/g, ' ')
              .replace(/\bLB\b/g, 'lbs')
              .replace(/\bOZ\b/g, 'oz')
              .replace(/\bFOZ\b/g, 'fl oz')
              .replace(/\bCT\b/g, 'ct')
              .replace(/\bGAL\b/g, 'gal')
              .replace(/\bQT\b/g, 'qt')
              .trim();
          }

          // Total grams display
          let totalText = '';
          if (ing.category === 'ingredient' && grams) {
            const lbs = grams / 453.592;
            if (lbs >= 1) totalText = `${lbs.toFixed(1)} lbs`;
            else totalText = `${(grams / 28.3495).toFixed(1)} oz`;
          }

          // Assemble the description
          if (units && units > 1 && perUnitText) {
            // Multi-unit case: "1 case = 6 × 5 lbs (30 lbs total)"
            if (totalText) {
              return `1 ${unit} = ${units} × ${perUnitText} (${totalText} total)`;
            }
            return `1 ${unit} = ${units} × ${perUnitText}`;
          } else if (totalText) {
            // Single-unit case: "1 bag = 50 lbs"
            return `1 ${unit} = ${totalText}`;
          } else if (units) {
            return `1 ${unit} = ${units} units`;
          }
          return `1 ${unit}`;
        };

        // Supplier name lookup
        const supplierColors = {1:'var(--green)', 2:'#42A5F5', 3:'#FF7043'};

        const renderCategorySection = (categoryKey, label, description) => {
          const filtered = ingredients.filter(i => (i.category || 'ingredient') === categoryKey);
          if (filtered.length === 0) return null;

          // Group by supplier
          const bySupplier = {};
          for (const ing of filtered) {
            const sid = ing.supplier_id || 0;
            if (!bySupplier[sid]) bySupplier[sid] = [];
            bySupplier[sid].push(ing);
          }

          return (
            <div key={categoryKey} style={{marginBottom:28}}>
              <div style={{borderLeft:'3px solid var(--blue)',paddingLeft:12,marginBottom:10}}>
                <h3 style={{margin:0}}>{label}</h3>
                <p className="sub" style={{marginBottom:0,fontSize:12}}>{description}</p>
              </div>
              {Object.entries(bySupplier).map(([sid,ings]) => (
                <div key={sid} style={{marginBottom:18}}>
                  <div className="section-label" style={{color:supplierColors[sid]||'var(--gray)',fontSize:11}}>{supplierNames[sid]||'Other'} ({ings.length})</div>
                  <table>
                    <thead>
                      <tr>
                        <th style={{minWidth:160}}>Ingredient</th>
                        <th style={{fontSize:11,color:'var(--gray)'}}>Pack Size</th>
                        <th className="c" style={{width:100}}>On Hand</th>
                        <th className="c" style={{width:100}}>Par (min)</th>
                        <th style={{width:60,fontSize:11,color:'var(--gray)'}}>Unit</th>
                      </tr>
                    </thead>
                    <tbody>{ings.map(ing => (
                      <tr key={ing.id}>
                        <td style={{fontWeight:500}}>{ing.nickname || ing.name}</td>
                        <td style={{color:'var(--gray)',fontSize:12}}>{packDescription(ing)}</td>
                        <td className="c">
                          <input
                            className="input"
                            type="number"
                            step="0.25"
                            min="0"
                            placeholder="0"
                            value={getPantryVal(ing.id,'on_hand')}
                            onChange={e=>setPantryField(ing.id,'on_hand',e.target.value)}
                          />
                        </td>
                        <td className="c">
                          <input
                            className="input"
                            type="number"
                            step="0.25"
                            min="0"
                            placeholder="0"
                            value={getPantryVal(ing.id,'par')}
                            onChange={e=>setPantryField(ing.id,'par',e.target.value)}
                          />
                        </td>
                        <td style={{color:'var(--gray)',fontSize:12,whiteSpace:'nowrap'}}>{ing.order_unit ? ing.order_unit + (getPantryVal(ing.id,'on_hand') == 1 ? '' : 's') : 'unit'}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              ))}
            </div>
          );
        };

        return (
          <div>
            {/* Walk-through instructions card */}
            <div className="card" style={{borderLeft:'3px solid var(--blue)',marginBottom:14}}>
              <h3 style={{marginBottom:6}}>Pantry Walk-Through</h3>
              <p className="sub" style={{marginBottom:10}}>
                For every item you use, enter the amount you have on hand <strong>in that item's order unit</strong> (cases, bags, pails, etc).
                Partial cases = decimals. Check the "Pack Size" column to see what's in each unit.
              </p>
              <div style={{background:'var(--bg)',padding:10,borderRadius:6,fontSize:13,marginBottom:10}}>
                <strong>Quick conversions:</strong> divide (what you have) by (what's in a full case)
                <div style={{marginTop:6,lineHeight:1.7}}>
                  <div>• 3 tubs of baking powder (6 per case) → <strong>0.5</strong></div>
                  <div>• 3 boxes brownie mix (6 per case) → <strong>0.5</strong></div>
                  <div>• 2 full cases + half case butter → <strong>2.5</strong></div>
                  <div>• 12 lbs loose chocolate chips (25 lb case) → <strong>0.5</strong></div>
                  <div>• Nothing left → <strong>0</strong></div>
                </div>
              </div>
              <div style={{background:'var(--bg)',padding:10,borderRadius:6,fontSize:13}}>
                <strong>Par (minimum)</strong> = the lowest you'll ever let the pantry drop before reordering.
                For LOL butter (3-4 week lead time), set this higher (maybe 3-4 cases).
                For fast-moving items like flour or chips, 1-2 cases is usually fine.
              </div>
            </div>

            {/* Save/cancel header when edits pending */}
            {Object.keys(pantryEdits).length > 0 && (
              <div style={{position:'sticky',top:0,zIndex:10,background:'var(--bg-card)',padding:12,borderRadius:8,marginBottom:14,display:'flex',justifyContent:'space-between',alignItems:'center',boxShadow:'0 2px 8px rgba(0,0,0,.3)'}}>
                <div style={{fontSize:13}}>
                  <strong>{Object.keys(pantryEdits).length}</strong> pending change{Object.keys(pantryEdits).length !== 1 ? 's' : ''}
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button className="btn btn-outline" onClick={()=>setPantryEdits({})}>Cancel</button>
                  <button className="btn btn-green" onClick={savePantryEdits} disabled={savingPantry}>{savingPantry?'Saving...':'Save Changes'}</button>
                </div>
              </div>
            )}

            {renderCategorySection('ingredient', 'Ingredients', 'Things that go into recipes — flour, butter, chips, extracts')}
            {renderCategorySection('packaging', 'Packaging', 'Boxes, bags, parchment — what cookies go into')}
            {renderCategorySection('supply', 'Supplies', 'Gloves and other non-food usables')}
          </div>
        );
      })()}

      {settingsTab === 'employees' && (
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:10}}>
            <div>
              <h3>Employees</h3>
              <p className="sub">Who can be selected when counting bins. Deactivate to hide from the dropdown while keeping historical records.</p>
            </div>
          </div>
          <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
            <input
              className="input-wide"
              style={{flex:1,minWidth:200,maxWidth:360}}
              placeholder="Employee name"
              value={newEmpName}
              onChange={e=>setNewEmpName(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addEmployee()}
            />
            <button className="btn btn-blue" onClick={addEmployee} disabled={!newEmpName.trim()}>
              + Add Employee
            </button>
          </div>
          {employees.length === 0 ? (
            <p style={{color:'var(--gray)',padding:20,textAlign:'center',fontSize:13}}>
              No employees yet. Add the people who do nightly counts so they can be selected in the count screen.
            </p>
          ) : (
            <table>
              <thead><tr>
                <th>Name</th>
                <th className="c">Status</th>
                <th className="c">Added</th>
                <th className="c" style={{width:160}}>Actions</th>
              </tr></thead>
              <tbody>{employees.map(emp => (
                <tr key={emp.id}>
                  <td style={{fontWeight:500}}>{emp.name}</td>
                  <td className="c">
                    {emp.active
                      ? <span style={{color:'var(--green)',fontSize:12,fontWeight:600}}>● Active</span>
                      : <span style={{color:'var(--gray2)',fontSize:12}}>○ Inactive</span>}
                  </td>
                  <td className="c" style={{color:'var(--gray)',fontSize:12}}>
                    {emp.created_at ? new Date(emp.created_at).toLocaleDateString() : '—'}
                  </td>
                  <td className="c">
                    <button className="btn btn-outline" style={{fontSize:11,padding:'4px 10px',marginRight:6}}
                      onClick={()=>toggleEmployee(emp)}>
                      {emp.active ? 'Deactivate' : 'Reactivate'}
                    </button>
                    <button className="btn btn-outline" style={{fontSize:11,padding:'4px 10px',color:'var(--red)',borderColor:'rgba(239,83,80,.3)'}}
                      onClick={()=>deleteEmployee(emp)}>
                      Delete
                    </button>
                  </td>
                </tr>
              ))}</tbody>
            </table>
          )}
        </div>
      )}

      {showAdd && (
        <div className="modal-overlay" onClick={()=>setShowAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
          <h3 className="serif" style={{marginBottom:16}}>Add New Flavor</h3>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <input className="input-wide" placeholder="Flavor name" value={nf.name} onChange={e=>setNf({...nf,name:e.target.value})} autoFocus/>
            <select className="select" value={nf.type} onChange={e=>setNf({...nf,type:e.target.value})}>
              <option value="specialty">Monthly Specialty</option>
              <option value="extra">Extra</option>
              <option value="classic">Classic</option>
            </select>
            <select className="select" value={nf.base_dough_id} onChange={e=>setNf({...nf,base_dough_id:e.target.value})}>
              <option value="">Standalone (no base)</option>
              {bases.map(b=><option key={b.id} value={b.id}>{b.name} ({b.label})</option>)}
            </select>
            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--gray)',cursor:'pointer'}}>
              <input type="checkbox" checked={nf.is_stuffed} onChange={e=>setNf({...nf,is_stuffed:e.target.checked})}/> Stuffed cookie (bins hold ~56 instead of ~80)
            </label>
            <div style={{display:'flex',gap:8}}>
              <div style={{flex:1}}><label style={{fontSize:11,color:'var(--gray)'}}>Par Level (bins per location)</label><input className="input-wide" type="number" step="0.25" value={nf.par_level_bins} onChange={e=>setNf({...nf,par_level_bins:e.target.value})}/></div>
              <div style={{flex:1}}><label style={{fontSize:11,color:'var(--gray)'}}>Restock Trigger</label><input className="input-wide" type="number" step="0.25" value={nf.restock_trigger_bins} onChange={e=>setNf({...nf,restock_trigger_bins:e.target.value})}/></div>
            </div>

            <div>
              <label style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.8px'}}>Lifecycle Status</label>
              <select className="select" value={nf.status} onChange={e=>setNf({...nf,status:e.target.value})}>
                <option value="live">Live — on menu now, counts in Nightly Count</option>
                <option value="pre_production">Pre-production — in Production Plan but not Nightly Count</option>
                <option value="retired">Retired — recipe only, no activity</option>
              </select>
            </div>

            {nf.type === 'specialty' && (
              <div style={{background:'var(--bg)',padding:12,borderRadius:8,marginTop:4}}>
                <label style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.8px',marginBottom:6,display:'block'}}>Optional: Schedule Menu Run</label>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <div style={{flex:1}}>
                    <label style={{fontSize:10,color:'var(--gray)'}}>Start Month</label>
                    <select className="select" value={nf.schedule_start_month} onChange={e=>setNf({...nf,schedule_start_month:e.target.value})}>
                      <option value="">—</option>
                      {MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div style={{width:80}}>
                    <label style={{fontSize:10,color:'var(--gray)'}}>Year</label>
                    <input className="input-wide" type="number" value={nf.schedule_start_year} onChange={e=>setNf({...nf,schedule_start_year:e.target.value})}/>
                  </div>
                </div>
                <div style={{display:'flex',gap:8,marginBottom:8}}>
                  <div style={{flex:1}}>
                    <label style={{fontSize:10,color:'var(--gray)'}}>End Month</label>
                    <select className="select" value={nf.schedule_end_month} onChange={e=>setNf({...nf,schedule_end_month:e.target.value})}>
                      <option value="">—</option>
                      {MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                  <div style={{width:80}}>
                    <label style={{fontSize:10,color:'var(--gray)'}}>Year</label>
                    <input className="input-wide" type="number" value={nf.schedule_end_year} onChange={e=>setNf({...nf,schedule_end_year:e.target.value})}/>
                  </div>
                </div>
                <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12,color:'var(--gray)',cursor:'pointer'}}>
                  <input type="checkbox" checked={nf.schedule_repeats} onChange={e=>setNf({...nf,schedule_repeats:e.target.checked})}/>
                  Repeats annually (e.g. Lucky Charm every March)
                </label>
              </div>
            )}

            <div style={{display:'flex',gap:8,marginTop:6}}>
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setShowAdd(false)}>Cancel</button>
              <button className="btn btn-green" style={{flex:1}} onClick={addFlavor} disabled={!nf.name}>Add Flavor</button>
            </div>
          </div>
        </div></div>
      )}

      {showScheduleAdd && (
        <div className="modal-overlay" onClick={()=>setShowScheduleAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
          <h3 className="serif" style={{marginBottom:16}}>Schedule a Flavor Run</h3>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <select className="select" value={newSched.flavor_id} onChange={e=>setNewSched({...newSched,flavor_id:e.target.value})}>
              <option value="">Choose flavor...</option>
              {allFlavors.sort((a,b)=>a.name.localeCompare(b.name)).map(f=><option key={f.id} value={f.id}>{f.name} ({f.type})</option>)}
            </select>
            <div style={{display:'flex',gap:8}}>
              <div style={{flex:1}}>
                <label style={{fontSize:11,color:'var(--gray)'}}>Start Month</label>
                <select className="select" value={newSched.start_month} onChange={e=>setNewSched({...newSched,start_month:e.target.value})}>
                  <option value="">—</option>
                  {MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div style={{width:100}}>
                <label style={{fontSize:11,color:'var(--gray)'}}>Year</label>
                <input className="input-wide" type="number" value={newSched.start_year} onChange={e=>setNewSched({...newSched,start_year:e.target.value})}/>
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <div style={{flex:1}}>
                <label style={{fontSize:11,color:'var(--gray)'}}>End Month</label>
                <select className="select" value={newSched.end_month} onChange={e=>setNewSched({...newSched,end_month:e.target.value})}>
                  <option value="">—</option>
                  {MONTHS.map(m=><option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div style={{width:100}}>
                <label style={{fontSize:11,color:'var(--gray)'}}>Year</label>
                <input className="input-wide" type="number" value={newSched.end_year} onChange={e=>setNewSched({...newSched,end_year:e.target.value})}/>
              </div>
            </div>
            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--gray)',cursor:'pointer'}}>
              <input type="checkbox" checked={newSched.repeats_annually} onChange={e=>setNewSched({...newSched,repeats_annually:e.target.checked})}/>
              Repeats annually
            </label>
            <input className="input-wide" placeholder="Notes (optional)" value={newSched.notes} onChange={e=>setNewSched({...newSched,notes:e.target.value})}/>
            <div style={{display:'flex',gap:8,marginTop:6}}>
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setShowScheduleAdd(false)}>Cancel</button>
              <button className="btn btn-green" style={{flex:1}} onClick={addSchedule} disabled={!newSched.flavor_id||!newSched.start_month||!newSched.end_month}>Add Schedule</button>
            </div>
          </div>
        </div></div>
      )}
    </div>
  );
}

// ─── MAIN APP ───────────────────────
function App() {
  const [authed, setAuthed] = useState(false);
  const [tab, setTab] = useState('production');
  const [loc, setLoc] = useState('petoskey');
  const [flavors, setFlavors] = useState([]);
  const [dashData, setDashData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => { const saved = localStorage.getItem('jojo_inv_token'); if (saved) { AUTH_TOKEN = saved; setAuthed(true); } }, []);

  const loadData = useCallback(async () => {
    setLoading(true);
    try {
      const {data: fl} = await db('flavors','select',{filters:{status:{in:['live','pre_production']}},orderBy:'type'});
      setFlavors(fl || []);
      const dash = await api('dashboard');
      setDashData(dash);
    } catch(e) { console.error('Load error:', e); }
    setLoading(false);
  }, []);

  useEffect(() => { if (authed) loadData(); }, [authed, loadData]);

  if (!authed) return <LoginScreen onLogin={()=>setAuthed(true)}/>;
  if (loading) return <div className="login-wrap"><div style={{textAlign:'center'}}><p style={{color:'var(--gray)'}}>Loading...</p></div></div>;

  const tabs = [
    {id:'production',label:'Production'},
    {id:'prep',label:'Prep List'},
    {id:'dough',label:'Nightly Count'},
    {id:'orders',label:'Order Lists'},
    {id:'manual',label:'Orders'},
    {id:'log',label:'Log Production'},
    {id:'transfers',label:'Transfers'},
    {id:'settings',label:'Settings'},
  ];

  return (
    <div>
      <header>
        <span className="serif" style={{fontSize:16,color:'var(--blue)'}}>JoJo's Cookie Co.</span>
        <nav className="nav">
          {tabs.map(t => <button key={t.id} className={tab===t.id?'active':''} onClick={()=>setTab(t.id)}>{t.label}</button>)}
        </nav>
        <div style={{width:160}}/>
      </header>
      <main>
        {tab==='dough' && <DoughTab loc={loc} setLoc={setLoc} flavors={flavors} dashData={dashData} onSaved={loadData}/>}
        {tab==='production' && <ProductionTab dashData={dashData}/>}
        {tab==='prep' && <PrepListTab dashData={dashData}/>}
        {tab==='orders' && <OrdersTab dashData={dashData}/>}
        {tab==='manual' && <ManualOrdersTab flavors={flavors}/>}
        {tab==='log' && <LogProductionTab flavors={flavors}/>}
        {tab==='transfers' && <TransfersTab flavors={flavors}/>}
        {tab==='settings' && <SettingsTab flavors={flavors} onRefresh={loadData}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
