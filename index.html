              <td><Tag color={o.status==='fulfilled'?'var(--green)':o.status==='confirmed'?'var(--blue)':'var(--yellow)'}>{o.status?.toUpperCase()}</Tag></td>
              <td className="c" onClick={e=>e.stopPropagation()}>
                {o.status==='pending'&&<button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>updateStatus(o.id,'confirmed')}>Confirm</button>}
                {o.status==='confirmed'&&<button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>updateStatus(o.id,'fulfilled')}>Fulfill</button>}
              </td>
            </tr>
          ))}</tbody></table>
        )}
      </div>

      {/* New Order modal */}
      {showAdd && (
        <div className="modal-overlay" onClick={()=>setShowAdd(false)}><div className="modal" onClick={e=>e.stopPropagation()}>
          <h3 className="serif" style={{marginBottom:16}}>New Order</h3>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <select className="select" value={newOrder.order_type} onChange={e=>setNewOrder({...newOrder,order_type:e.target.value})}><option value="catering">Catering</option><option value="wholesale">Wholesale</option><option value="wedding">Wedding</option><option value="event">Event</option></select>
            <input className="input-wide" placeholder="Customer name" value={newOrder.customer_name} onChange={e=>setNewOrder({...newOrder,customer_name:e.target.value})}/>
            <input className="input-wide" type="date" value={newOrder.fulfillment_date} onChange={e=>setNewOrder({...newOrder,fulfillment_date:e.target.value})}/>
            <input className="input-wide" placeholder="Notes" value={newOrder.notes} onChange={e=>setNewOrder({...newOrder,notes:e.target.value})}/>
            <div style={{borderTop:'1px solid var(--border)',paddingTop:10}}>
              <p style={{fontWeight:600,fontSize:13,marginBottom:8}}>Cookie Items</p>
              {newOrder.items.map((item,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',fontSize:13,color:'var(--gray)'}}><span style={{color:'#fff'}}>{item.flavor_name}</span><span>{item.quantity} × {item.cookie_oz}oz</span></div>)}
              <div style={{display:'flex',gap:6,marginTop:8}}>
                <select className="select" style={{flex:2}} value={newItem.flavor_id} onChange={e=>setNewItem({...newItem,flavor_id:e.target.value})}><option value="">Flavor</option>{flavors.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}</select>
                <input className="input-wide" style={{flex:1}} type="number" placeholder="Qty" value={newItem.quantity} onChange={e=>setNewItem({...newItem,quantity:e.target.value})}/>
                <select className="select" style={{flex:1}} value={newItem.cookie_oz} onChange={e=>setNewItem({...newItem,cookie_oz:e.target.value})}><option value="4">4oz</option><option value="2">2oz</option><option value="1">1oz</option></select>
                <button className="btn btn-blue" onClick={addItem} style={{padding:'6px 12px'}}>+</button>
              </div>
            </div>
            <div style={{display:'flex',gap:8,marginTop:8}}><button className="btn btn-outline" style={{flex:1}} onClick={()=>setShowAdd(false)}>Cancel</button><button className="btn btn-green" style={{flex:1}} onClick={saveOrder} disabled={!newOrder.items.length}>Save</button></div>
          </div>
        </div></div>

      {/* Edit/view existing order modal */}
      {editOrder && (
        <div className="modal-overlay" onClick={()=>setEditOrder(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}}>
              <h3 className="serif" style={{margin:0}}>Edit Order</h3>
              <Tag color={editOrder.status==='fulfilled'?'var(--green)':editOrder.status==='confirmed'?'var(--blue)':'var(--yellow)'}>
                {editOrder.status?.toUpperCase()}
              </Tag>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <label style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.6px',fontWeight:600}}>Type</label>
              <select className="select" value={editOrder.order_type||'catering'}
                onChange={e=>setEditOrder({...editOrder, order_type:e.target.value})}>
                <option value="catering">Catering</option>
                <option value="wholesale">Wholesale</option>
                <option value="wedding">Wedding</option>
                <option value="event">Event</option>
              </select>

              <label style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.6px',fontWeight:600}}>Customer</label>
              <input className="input-wide" placeholder="Customer name"
                value={editOrder.customer_name||''}
                onChange={e=>setEditOrder({...editOrder, customer_name:e.target.value})}/>

              <label style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.6px',fontWeight:600}}>Fulfillment date</label>
              <input className="input-wide" type="date"
                value={editOrder.fulfillment_date||''}

          </div>
        </div>
      )}
    </div>
  );
}

// ─── LOG PRODUCTION (dough only) ────────────────────────────────────────────
// Single-purpose tab for logging cookie dough batches made.
// Each save calls /api/production which:
//   1) Writes one production_logs row per flavor
//   2) Atomically deducts ingredients from pantry based on recipes
//      (handles base doughs + sub-recipes + flavor-specific add-ons)
// Full batches only — JoJo's doesn't do half batches.
// Cookie dough containers and ice cream sandwiches are NOT logged here;
// they're tracked via nightly count only (per Colin's operational model).
function LogProductionTab({flavors, products}) {
  const [logs, setLogs] = useState([]);
  const [employees, setEmployees] = useState([]);

  // Session state — multi-flavor batch entry
  const [sessionBatches, setSessionBatches] = useState({}); // {flavorId: batchCount}
  const [sessionLoc, setSessionLoc] = useState('1');
  const [sessionBaker, setSessionBaker] = useState('');

  // Preview state (ingredient deduction preview before saving)
  const [preview, setPreview] = useState(null);
  const [previewLoading, setPreviewLoading] = useState(false);

  // Save state
  const [saving, setSaving] = useState(false);
  const [saveMsg, setSaveMsg] = useState('');
  const [lastResult, setLastResult] = useState(null); // Shown after a successful save

  const liveFlavors = (flavors || []).filter(f => f.status === 'live' || !f.status);

  const load = () => {
    db('production_logs','select',{orderBy:'date:desc',limit:30}).then(d=>setLogs(d.data||[]));
    db('employees','select',{filters:{active:true},orderBy:'name'}).then(d=>setEmployees(d.data||[]));
  };
  useEffect(() => { load(); }, []);

  // Step a flavor's batch count by `delta`. Floor at 0; full batches only.
  const stepBatches = (fId, delta) => {
    setSessionBatches(s => {
      const cur = Number(s[fId] || 0);
      const next = Math.max(0, cur + delta);
      const out = {...s};
      if (next === 0) delete out[fId];
      else out[fId] = next;
      return out;
    });
    setPreview(null); // Invalidate preview when changes happen
  };

  const clearSession = () => {
    if (Object.keys(sessionBatches).length === 0) return;
    if (!confirm('Clear all unsaved batch entries?')) return;
    setSessionBatches({});
    setPreview(null);
  };

  // Derived values
  const totalSessionBatches = Object.values(sessionBatches).reduce((s,v) => s+Number(v), 0);
  const sessionFlavorCount = Object.keys(sessionBatches).length;
  const locName = sessionLoc === '1' ? 'Petoskey' : 'Traverse City';

  // Build the batches payload for the API
  const buildBatchesPayload = () => Object.entries(sessionBatches)
    .filter(([_, n]) => n > 0)
    .map(([flavor_id, batch_count]) => ({ flavor_id: parseInt(flavor_id), batch_count: Number(batch_count) }));

  // Preview what would get deducted from pantry — dry run, doesn't write
  const fetchPreview = async () => {
    const batches = buildBatchesPayload();
    if (batches.length === 0) return;
    setPreviewLoading(true);
    setSaveMsg('');
    try {
      const result = await api('production', { batches, dryRun: true });
      setPreview(result);
    } catch(e) {
      setSaveMsg('Preview failed: ' + e.message);
    }
    setPreviewLoading(false);
  };

  // Actually save: writes production_logs AND deducts from pantry
  const saveSession = async () => {
    const batches = buildBatchesPayload();
    if (batches.length === 0) return;
    if (!sessionBaker) { setSaveMsg('Pick who baked first.'); return; }
    if (!sessionLoc) { setSaveMsg('Pick a location first.'); return; }
    setSaving(true);
    setSaveMsg('');
    try {
      const result = await api('production', {
        batches,
        location_id: parseInt(sessionLoc),
        logged_by: sessionBaker
      });
      setLastResult(result);
      setSaveMsg(`✓ Logged ${result.totalBatches} batch${result.totalBatches===1?'':'es'} — pantry updated for ${result.ingredients.length} ingredient${result.ingredients.length===1?'':'s'}.`);
      setSessionBatches({});
      setPreview(null);
      load();
      setTimeout(()=>setSaveMsg(''), 6000);
    } catch(e) {
      setSaveMsg('Error: ' + e.message);
    }
    setSaving(false);
  };

  // Group recent logs by date
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  const logsByDate = { today: [], yesterday: [], earlier: [] };
  for (const l of logs) {
    if (l.date === today) logsByDate.today.push(l);
    else if (l.date === yesterday) logsByDate.yesterday.push(l);
    else logsByDate.earlier.push(l);
  }

  // Helper: format a batch quantity nicely (1, 2, 3...)
  const fmtQty = (n, unit) => `${n} ${unit}${n===1?'':'s'}`;

  // ── Per-flavor row ─────────────────────────────────────────────────────
  const renderFlavorRow = (f) => {
    const batches = sessionBatches[f.id] || 0;
    const hasValue = batches > 0;
    return (
      <div key={f.id} className={`batch-row ${hasValue ? 'has-value' : ''}`}>
        <div className="batch-flavor">
          <span className="batch-flavor-name">{f.name}</span>
          <span className="batch-flavor-type">{f.type}</span>
        </div>
        <div className="batch-controls">
          <button className="step-btn"
            onClick={()=>stepBatches(f.id, -1)}
            disabled={batches === 0}
            title="−1 batch">−</button>
          <span className={`batch-val ${hasValue ? 'active' : ''}`}>{batches}</span>
          <button className="step-btn"
            onClick={()=>stepBatches(f.id, 1)}
            title="+1 batch">+</button>
        </div>
      </div>
    );
  };

  return (
    <div>
      {/* Session header: location + baker + grand total */}
      <div className="card">
        <h3>Log Cookie Dough Batches</h3>
        <p className="sub">Tap +/− on each flavor as you make full batches. Hit save when done — ingredients will be deducted from your pantry automatically.</p>

        <div style={{display:'flex',gap:10,marginTop:14,flexWrap:'wrap',alignItems:'center'}}>
          <div style={{display:'flex',gap:0,border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
            <button
              className={`btn ${sessionLoc==='1'?'btn-blue':'btn-outline'}`}
              style={{borderRadius:0,padding:'8px 16px',fontSize:13,border:'none'}}
              onClick={()=>setSessionLoc('1')}>Petoskey</button>
            <button
              className={`btn ${sessionLoc==='2'?'btn-blue':'btn-outline'}`}
              style={{borderRadius:0,padding:'8px 16px',fontSize:13,border:'none',borderLeft:'1px solid var(--border)'}}
              onClick={()=>setSessionLoc('2')}>Traverse City</button>
          </div>
          <select className="select" style={{flex:'1 1 200px',maxWidth:280}}
            value={sessionBaker} onChange={e=>setSessionBaker(e.target.value)}>
            <option value="">Baker / logged by...</option>

// ─── TRANSFERS ──────────────────────
function TransfersTab({flavors}) {
  const [transfers, setTransfers] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [flavor, setFlavor] = useState('');
  const [bins, setBins] = useState('');
  const [fromLoc, setFromLoc] = useState('1'); // 1=Pet (default), 2=TC
  const [storage, setStorage] = useState('fridge'); // fridge or freezer
  const [transferredBy, setTransferredBy] = useState('');
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');

  const load = () => {
    db('transfers','select',{orderBy:'date:desc',limit:20}).then(d=>setTransfers(d.data||[]));
    db('employees','select',{filters:{active:true},orderBy:'name'}).then(d=>setEmployees(d.data||[]));
  };
  useEffect(() => { load(); }, []);

  const toLoc = fromLoc === '1' ? '2' : '1';
  const fromName = fromLoc === '1' ? 'Petoskey' : 'Traverse City';
  const toName = fromLoc === '1' ? 'Traverse City' : 'Petoskey';

  // Find the latest actual count for a given flavor + location + storage
  // so we can compute the post-transfer balance.
  const getLatestCount = async (flavorId, locationId, storageType) => {
    const {data} = await db('inventory_snapshots','select',{
      filters:{
        flavor_id: flavorId,
        location_id: locationId,
        storage: storageType,
        actual_bins:{not:'is.null'}
      },
      orderBy:'created_at:desc',
      limit:1
    });
    return data && data.length > 0 && data[0].actual_bins !== null
      ? Number(data[0].actual_bins) : null;
  };

  const logTransfer = async () => {
    if (!flavor || !bins) { setMsg('Pick a flavor and enter bin count.'); return; }
    const binAmt = parseFloat(bins);
    if (isNaN(binAmt) || binAmt <= 0) { setMsg('Bin count must be greater than 0.'); return; }
    if (!transferredBy) { setMsg('Pick who transferred it.'); return; }

    setSaving(true);
    setMsg('');
    const flavorId = parseInt(flavor);
    const today = new Date().toISOString().split('T')[0];
    const nowIso = new Date().toISOString();

    try {
      // 1. Write the transfer row itself
      await db('transfers','insert',{data:{
        flavor_id: flavorId,
        from_location_id: parseInt(fromLoc),
        to_location_id: parseInt(toLoc),
        bins: binAmt,
        date: today,
        transferred_by: transferredBy
      }});

      // 2. Auto-create snapshots on BOTH sides so the nightly count
      //    pre-fill reflects the new reality. These are tagged
      //    "auto: transfer" so they can be distinguished from physical
      //    counts in the future.
      const fromLatest = await getLatestCount(flavorId, parseInt(fromLoc), storage);
      const toLatest = await getLatestCount(flavorId, parseInt(toLoc), storage);

      // From side: subtract. Clamp at 0 (can't go negative).
      if (fromLatest !== null) {
        const newFrom = Math.max(0, fromLatest - binAmt);
        await db('inventory_snapshots','insert',{data:{
          flavor_id: flavorId,
          location_id: parseInt(fromLoc),
          date: today,
          storage,
          actual_bins: newFrom,
          counted_by: `auto: transfer (-${binAmt} to ${toName})`,
          created_at: nowIso
        }});
      }
      // To side: add. If no prior count exists at the destination,
      // start it at the transferred amount.
      const newTo = (toLatest || 0) + binAmt;
      await db('inventory_snapshots','insert',{data:{
        flavor_id: flavorId,
        location_id: parseInt(toLoc),
        date: today,
        storage,
        actual_bins: newTo,
        counted_by: `auto: transfer (+${binAmt} from ${fromName})`,
        created_at: nowIso
      }});

      const flavorName = flavors.find(f=>f.id===flavorId)?.name || 'flavor';
      setMsg(`✓ Logged ${binAmt} bin${binAmt===1?'':'s'} of ${flavorName} ${fromName} → ${toName}`);
      setTimeout(()=>setMsg(''), 5000);
      setFlavor(''); setBins('');
      load();
    } catch(e) {
      setMsg('Error: ' + e.message);
    }
    setSaving(false);
  };

  return (
    <div>
      <div className="card">
        <h3>Transfer Dough Between Locations</h3>
        <p className="sub">Subtracts from the source location's count and adds to the destination — nightly count will physically verify both sides.</p>

        {/* Direction toggle */}
        <div style={{display:'flex',gap:0,border:'1px solid var(--border)',borderRadius:8,overflow:'hidden',marginTop:14,maxWidth:420}}>
          <button
            className={`btn ${fromLoc==='1'?'btn-blue':'btn-outline'}`}
            style={{flex:1,borderRadius:0,padding:'10px',fontSize:13,border:'none'}}
            onClick={()=>setFromLoc('1')}>Petoskey → TC</button>
          <button
            className={`btn ${fromLoc==='2'?'btn-blue':'btn-outline'}`}
            style={{flex:1,borderRadius:0,padding:'10px',fontSize:13,border:'none',borderLeft:'1px solid var(--border)'}}
            onClick={()=>setFromLoc('2')}>TC → Petoskey</button>
        </div>

        <div style={{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}}>
          <select className="select" style={{flex:'2 1 200px'}} value={flavor} onChange={e=>setFlavor(e.target.value)}>
            <option value="">Select flavor</option>
            {flavors.map(f=><option key={f.id} value={f.id}>{f.name}</option>)}
          </select>
          <input className="input-wide" style={{flex:'1 1 80px',minWidth:80}}
            type="number" step="0.25" placeholder="Bins"
            value={bins} onChange={e=>setBins(e.target.value)}/>
        </div>

        {/* Storage choice */}
        <div style={{display:'flex',gap:8,marginTop:8}}>
          <button
            className={`btn ${storage==='fridge'?'btn-blue':'btn-outline'}`}
            style={{flex:1,padding:'10px',fontSize:13}}
            onClick={()=>setStorage('fridge')}>❄ Fridge</button>
          <button
            className={`btn ${storage==='freezer'?'btn-blue':'btn-outline'}`}
            style={{flex:1,padding:'10px',fontSize:13}}
            onClick={()=>setStorage('freezer')}>🧊 Freezer</button>
        </div>

        <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap',alignItems:'center'}}>
          <select className="select" style={{flex:'1 1 200px'}}
            value={transferredBy} onChange={e=>setTransferredBy(e.target.value)}>
            <option value="">Transferred by...</option>
            {employees.map(e=><option key={e.id} value={e.name}>{e.name}</option>)}
          </select>
          <button className="btn btn-blue"
            style={{flex:'1 1 140px',padding:'10px',fontSize:14}}
            disabled={saving}
            onClick={logTransfer}>
            {saving ? 'Logging...' : `Log Transfer →`}
          </button>
        </div>

        {msg && (
          <div style={{marginTop:10,padding:'8px 12px',borderRadius:6,
            background: msg.startsWith('✓') ? 'rgba(76,175,80,.12)' : 'rgba(239,83,80,.12)',
            color: msg.startsWith('✓') ? 'var(--green)' : 'var(--red)',
            fontSize:13,fontWeight:500}}>
            {msg}
          </div>
        )}
      </div>

      <div className="card">
        <h3>Recent Transfers</h3>
        {transfers.length===0 ? (
          <p style={{color:'var(--gray)',padding:20,textAlign:'center'}}>No transfers yet.</p>
        ) : (
          <table style={{marginTop:10}}>
            <thead><tr><th>Date</th><th>Flavor</th><th className="c">Bins</th><th>Direction</th><th>By</th></tr></thead>
            <tbody>{transfers.map(t => {
              const f = flavors.find(f=>f.id===t.flavor_id);
              const dirArrow = t.from_location_id === 1 ? 'Petoskey → TC' : 'TC → Petoskey';
              return (
                <tr key={t.id}>
                  <td>{t.date}</td>
                  <td style={{fontWeight:500}}>{f?.name || '?'}</td>
                  <td className="c" style={{fontWeight:700}}>{t.bins}</td>
                  <td style={{color:'var(--blue)',fontSize:12}}>{dirArrow}</td>
                  <td style={{color:'var(--gray)',fontSize:12}}>{t.transferred_by || '—'}</td>
                </tr>
              );
            })}</tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ─── INVENTORY (side-by-side comparison view) ──────────────────────────────
// Simple read-only inventory dashboard for managers. Shows the latest count
// per (flavor, location, storage) in a Petoskey vs TC side-by-side layout.
// One query pulls the last 30 days of snapshots, then we pick the most recent
// per (flavor, location, storage) client-side. Much faster than looping queries.
function InventoryTab({flavors, products}) {
  const [inventory, setInventory] = useState({});  // {flavorId: {pet: {fridge, freezer, fridgeAt, freezerAt}, tc: {...}}}
  const [productInv, setProductInv] = useState({}); // {productId: {pet: {fridge, freezer, fridgeAt, freezerAt, total, totalAt}, tc: {...}}}
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [hideEmpty, setHideEmpty] = useState(false);

  useEffect(() => {
    (async () => {
      setLoading(true);
      // Pull last 60 days of snapshots in one shot — covers any reasonable
      // gap in counting. Snapshots are small rows so this is fast.
      const cutoff = new Date(Date.now() - 60 * 86400000).toISOString();
      const [{data: snaps}, {data: prodSnaps}] = await Promise.all([
        db('inventory_snapshots','select',{
          filters:{created_at:{gte:cutoff}},
          orderBy:'created_at:desc'
        }),
        db('product_snapshots','select',{
          filters:{created_at:{gte:cutoff}},
          orderBy:'created_at:desc'
        })
      ]);

      // Build flavor inventory map (cookie flavors, with fridge/freezer)
      const inv = {};
      for (const s of (snaps || [])) {
        const fId = s.flavor_id;
        const locKey = s.location_id === 1 ? 'pet' : s.location_id === 2 ? 'tc' : null;
        if (!locKey) continue;
        const storage = s.storage || 'fridge';
        if (!inv[fId]) inv[fId] = { pet: {}, tc: {} };
        const slot = inv[fId][locKey];
        if (slot[storage] === undefined) {
          slot[storage] = s.actual_bins !== null ? Number(s.actual_bins) : null;
          slot[storage + 'At'] = s.created_at;
        }
      }
      setInventory(inv);

      // Build product inventory map. Some products track storage (buttercream,
      // cream cheese) — show fridge+freezer. Others (cookie dough, sandwiches)
      // are single-count — use 'total' slot.
      const pInv = {};
      for (const s of (prodSnaps || [])) {
        const pId = s.product_id;
        const locKey = s.location_id === 1 ? 'pet' : s.location_id === 2 ? 'tc' : null;
        if (!locKey) continue;
        const storage = s.storage || 'fridge';
        if (!pInv[pId]) pInv[pId] = { pet: {}, tc: {} };
        const slot = pInv[pId][locKey];
        // Look up the product to decide if it tracks storage
        const prod = (products || []).find(p => p.id === pId);
        if (prod && prod.tracks_storage) {
          // Fridge/freezer breakdown like cookie bins
          if (slot[storage] === undefined) {
            slot[storage] = s.quantity !== null ? Number(s.quantity) : null;
            slot[storage + 'At'] = s.created_at;
          }
        } else {
          // Single-count: only the most recent snapshot regardless of storage
          if (slot.total === undefined) {
            slot.total = s.quantity !== null ? Number(s.quantity) : null;
            slot.totalAt = s.created_at;
          }
        }
      }
      setProductInv(pInv);
      setLoading(false);
    })();
  }, [products]);

  // Format a date as "today / yesterday / Mar 14"
  const fmtWhen = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    const now = new Date();
    const ms = now - d;
    const hours = ms / 3600000;
    if (hours < 18) return 'today';
    if (hours < 42) return 'yesterday';
    const days = Math.floor(hours / 24);
    if (days < 7) return `${days}d ago`;
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  };

  // Staleness: red if >3 days old, yellow if >24h
  const stalenessClass = (iso) => {
    if (!iso) return 'stale-none';
    const hours = (Date.now() - new Date(iso).getTime()) / 3600000;
    if (hours > 72) return 'stale-red';
    if (hours > 30) return 'stale-yellow';
    return 'stale-ok';
  };

  const fmtBins = (v) => {
    if (v === undefined || v === null) return '—';
    if (v === 0) return '0';
    // Show as fraction for clean halves/quarters
    if (v === 0.25) return '¼';
    if (v === 0.5) return '½';
    if (v === 0.75) return '¾';
    if (Number.isInteger(v)) return String(v);
    // Mixed numbers: 1.5 → "1½", 2.25 → "2¼"
    const whole = Math.floor(v);
    const frac = v - whole;
    if (frac === 0.25) return `${whole}¼`;
    if (frac === 0.5) return `${whole}½`;
    if (frac === 0.75) return `${whole}¾`;
    return String(v);
  };

  const locTotal = (entry) => {
    if (!entry) return 0;
    return (entry.fridge || 0) + (entry.freezer || 0);
  };

  // Filter flavors: only show live, optionally filter by search and empty
  const visibleFlavors = flavors
    .filter(f => f.status === 'live' || !f.status)
    .filter(f => !search || f.name.toLowerCase().includes(search.toLowerCase()))
    .filter(f => {
      if (!hideEmpty) return true;
      const inv = inventory[f.id];
      if (!inv) return false;
      return locTotal(inv.pet) > 0 || locTotal(inv.tc) > 0;
    })
    .sort((a,b) => {
      // Sort by type first (classic, specialty, extra), then name
      const typeOrder = {classic:0, specialty:1, extra:2};
      const tDiff = (typeOrder[a.type] ?? 9) - (typeOrder[b.type] ?? 9);
      if (tDiff !== 0) return tDiff;
      return a.name.localeCompare(b.name);
    });

  // Compute grand totals across all flavors per location
  let petGrandFridge = 0, petGrandFreezer = 0, tcGrandFridge = 0, tcGrandFreezer = 0;
  for (const f of visibleFlavors) {
    const inv = inventory[f.id];
    if (!inv) continue;
    petGrandFridge += inv.pet.fridge || 0;
    petGrandFreezer += inv.pet.freezer || 0;
    tcGrandFridge += inv.tc.fridge || 0;
    tcGrandFreezer += inv.tc.freezer || 0;
  }
  const petGrand = petGrandFridge + petGrandFreezer;
  const tcGrand = tcGrandFridge + tcGrandFreezer;

  if (loading) return <div className="card"><p style={{color:'var(--gray)',padding:20,textAlign:'center'}}>Loading inventory...</p></div>;

  return (
    <div className="inv-page">
      {/* Header summary cards */}
      <div className="inv-summary">
        <div className="inv-sum-card">
          <div className="inv-sum-label">Petoskey Total</div>
          <div className="inv-sum-value">{fmtBins(petGrand)} <span className="inv-sum-unit">bins</span></div>
          <div className="inv-sum-breakdown">
            <span><span className="icon">❄</span>{fmtBins(petGrandFridge)} fridge</span>
            <span><span className="icon">🧊</span>{fmtBins(petGrandFreezer)} freezer</span>
          </div>
        </div>
        <div className="inv-sum-card">
          <div className="inv-sum-label">Traverse City Total</div>
          <div className="inv-sum-value">{fmtBins(tcGrand)} <span className="inv-sum-unit">bins</span></div>
          <div className="inv-sum-breakdown">
            <span><span className="icon">❄</span>{fmtBins(tcGrandFridge)} fridge</span>
            <span><span className="icon">🧊</span>{fmtBins(tcGrandFreezer)} freezer</span>
          </div>
        </div>
        <div className="inv-sum-card inv-sum-card-combined">
          <div className="inv-sum-label">Combined Total</div>
          <div className="inv-sum-value">{fmtBins(petGrand + tcGrand)} <span className="inv-sum-unit">bins</span></div>
          <div className="inv-sum-breakdown">
            <span>across {visibleFlavors.length} flavors</span>
          </div>
        </div>
      </div>

      {/* Controls */}
      <div className="card" style={{padding:'12px 16px'}}>
        <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
          <input
            className="input"
            style={{flex:'1 1 200px',maxWidth:300}}
            type="text"
            placeholder="Search flavor..."
            value={search}
            onChange={e=>setSearch(e.target.value)}
          />
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--gray)',cursor:'pointer'}}>
            <input type="checkbox" checked={hideEmpty} onChange={e=>setHideEmpty(e.target.checked)}/>
            Hide flavors with zero stock at both locations
          </label>
          <div style={{marginLeft:'auto',fontSize:11,color:'var(--gray)',display:'flex',gap:12,alignItems:'center'}}>
            <span><span className="stale-dot stale-ok"/> Fresh</span>
            <span><span className="stale-dot stale-yellow"/> &gt;24h</span>
            <span><span className="stale-dot stale-red"/> &gt;3d</span>
          </div>
        </div>
      </div>

      {/* Main comparison grid */}
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div className="inv-grid-header">
          <div className="inv-cell-flavor">Flavor</div>
          <div className="inv-cell-loc">
            <div className="inv-loc-name">Petoskey</div>
            <div className="inv-loc-sub">Fridge · Freezer · Total</div>
          </div>
          <div className="inv-cell-loc">
            <div className="inv-loc-name">Traverse City</div>
            <div className="inv-loc-sub">Fridge · Freezer · Total</div>
          </div>
          <div className="inv-cell-combined">Combined</div>
        </div>
        {visibleFlavors.length === 0 && (
          <p style={{padding:20,textAlign:'center',color:'var(--gray)'}}>No flavors match.</p>
        )}
        {visibleFlavors.map(f => {
          const inv = inventory[f.id] || {pet:{}, tc:{}};
          const petTotal = locTotal(inv.pet);
          const tcTotal = locTotal(inv.tc);
          const combined = petTotal + tcTotal;
          const par = f.par_level_bins ? Number(f.par_level_bins) : 0;
          const restock = f.restock_trigger_bins ? Number(f.restock_trigger_bins) : 0;
          // Use the more recent of fridge/freezer for staleness per location
          const petLatestAt = [inv.pet.fridgeAt, inv.pet.freezerAt].filter(Boolean).sort().pop();
          const tcLatestAt = [inv.tc.fridgeAt, inv.tc.freezerAt].filter(Boolean).sort().pop();

          return (
            <div key={f.id} className="inv-row">
              <div className="inv-cell-flavor">
                <div style={{fontWeight:600}}>{f.name}</div>
                <div style={{fontSize:10,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.6px',marginTop:2}}>
                  {f.type}{par ? ` · par ${fmtBins(par)}` : ''}
                </div>
              </div>

              {/* Petoskey */}
              <div className={`inv-cell-loc ${combined > 0 && petTotal < restock ? 'inv-low' : ''}`} data-loc="Petoskey">
                <div className="inv-numbers">
                  <span className="inv-num inv-fridge" title="Fridge">
                    <span className="inv-num-icon">❄</span> {fmtBins(inv.pet.fridge)}
                  </span>
                  <span className="inv-num inv-freezer" title="Freezer">
                    <span className="inv-num-icon">🧊</span> {fmtBins(inv.pet.freezer)}
                  </span>
                  <span className="inv-num inv-total" title="Total">= {fmtBins(petTotal)}</span>
                </div>
                <div className="inv-staleness">
                  <span className={`stale-dot ${stalenessClass(petLatestAt)}`}/>
                  <span>last count: {fmtWhen(petLatestAt)}</span>
                </div>
              </div>

              {/* Traverse City */}
              <div className={`inv-cell-loc ${combined > 0 && tcTotal < restock ? 'inv-low' : ''}`} data-loc="Traverse City">
                <div className="inv-numbers">
                  <span className="inv-num inv-fridge" title="Fridge">
                    <span className="inv-num-icon">❄</span> {fmtBins(inv.tc.fridge)}
                  </span>
                  <span className="inv-num inv-freezer" title="Freezer">
                    <span className="inv-num-icon">🧊</span> {fmtBins(inv.tc.freezer)}
                  </span>
                  <span className="inv-num inv-total" title="Total">= {fmtBins(tcTotal)}</span>
                </div>
                <div className="inv-staleness">
                  <span className={`stale-dot ${stalenessClass(tcLatestAt)}`}/>
                  <span>last count: {fmtWhen(tcLatestAt)}</span>
                </div>
              </div>

              {/* Combined */}
              <div className="inv-cell-combined">
                <div className="inv-combined-num">{fmtBins(combined)}</div>
                <div className="inv-combined-sub">
                  {par > 0 && (
                    <span style={{color: combined >= par ? 'var(--green)' : combined >= restock ? 'var(--yellow)' : 'var(--red)'}}>
                      {combined >= par ? '✓ at par' : combined >= restock ? 'below par' : 'restock'}
                    </span>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Products section: cookie dough, ice cream sandwiches, buttercream bags.
          Same Petoskey vs TC side-by-side layout, but rendering differs based
          on whether the product tracks_storage (fridge/freezer split) or not. */}
      {(products || []).filter(p => p.status === 'live' || !p.status).length > 0 && (() => {
        const liveProducts = (products || []).filter(p => p.status === 'live' || !p.status);
        const productTypeMeta = {
          cookie_dough: { label: 'Cookie Dough', icon: '🍪' },
          ice_cream_sandwich: { label: 'Ice Cream Sandwiches', icon: '🍨' },
          buttercream_bag: { label: 'Buttercream & Filling Bags', icon: '🧁' },
        };
        // Group products by type, sorted within each by name
        const grouped = {};
        for (const p of liveProducts) {
          if (!grouped[p.product_type]) grouped[p.product_type] = [];
          grouped[p.product_type].push(p);
        }
        for (const k of Object.keys(grouped)) grouped[k].sort((a,b) => a.name.localeCompare(b.name));

        const renderProductRow = (p) => {
          const inv = productInv[p.id] || { pet: {}, tc: {} };
          const tracksStorage = p.tracks_storage;
          // Compute totals based on whether this product tracks storage
          const petTotal = tracksStorage
            ? (inv.pet.fridge || 0) + (inv.pet.freezer || 0)
            : (inv.pet.total || 0);
          const tcTotal = tracksStorage
            ? (inv.tc.fridge || 0) + (inv.tc.freezer || 0)
            : (inv.tc.total || 0);
          const combined = petTotal + tcTotal;
          const par = p.par_level ? Number(p.par_level) : 0;
          const restock = p.restock_trigger ? Number(p.restock_trigger) : 0;
          const petLatestAt = tracksStorage
            ? [inv.pet.fridgeAt, inv.pet.freezerAt].filter(Boolean).sort().pop()
            : inv.pet.totalAt;
          const tcLatestAt = tracksStorage
            ? [inv.tc.fridgeAt, inv.tc.freezerAt].filter(Boolean).sort().pop()
            : inv.tc.totalAt;
          const unitLabel = p.unit_name + (combined === 1 ? '' : 's');

          // Filter by search
          if (search && !p.name.toLowerCase().includes(search.toLowerCase())) return null;
          if (hideEmpty && combined === 0) return null;

          return (
            <div key={p.id} className="inv-row">
              <div className="inv-cell-flavor">
                <div style={{fontWeight:600}}>{p.name}</div>
                <div style={{fontSize:10,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.6px',marginTop:2}}>
                  {unitLabel}{par ? ` · par ${fmtBins(par)}` : ''}
                </div>
              </div>

              {/* Petoskey */}
              <div className={`inv-cell-loc ${combined > 0 && petTotal < restock ? 'inv-low' : ''}`} data-loc="Petoskey">
                <div className="inv-numbers">
                  {tracksStorage ? (
                    <>
                      <span className="inv-num inv-fridge" title="Fridge">
                        <span className="inv-num-icon">❄</span> {fmtBins(inv.pet.fridge)}
                      </span>
                      <span className="inv-num inv-freezer" title="Freezer">
                        <span className="inv-num-icon">🧊</span> {fmtBins(inv.pet.freezer)}
                      </span>
                      <span className="inv-num inv-total" title="Total">= {fmtBins(petTotal)}</span>
                    </>
                  ) : (
                    <span className="inv-num inv-total" title="Total">{fmtBins(inv.pet.total)}</span>
                  )}
                </div>
                <div className="inv-staleness">
                  <span className={`stale-dot ${stalenessClass(petLatestAt)}`}/>
                  <span>last count: {fmtWhen(petLatestAt)}</span>
                </div>
              </div>

              {/* Traverse City */}
              <div className={`inv-cell-loc ${combined > 0 && tcTotal < restock ? 'inv-low' : ''}`} data-loc="Traverse City">
                <div className="inv-numbers">
                  {tracksStorage ? (
                    <>
                      <span className="inv-num inv-fridge" title="Fridge">
                        <span className="inv-num-icon">❄</span> {fmtBins(inv.tc.fridge)}
                      </span>
                      <span className="inv-num inv-freezer" title="Freezer">
                        <span className="inv-num-icon">🧊</span> {fmtBins(inv.tc.freezer)}
                      </span>
                      <span className="inv-num inv-total" title="Total">= {fmtBins(tcTotal)}</span>
                    </>
                  ) : (
                    <span className="inv-num inv-total" title="Total">{fmtBins(inv.tc.total)}</span>
                  )}
                </div>
                <div className="inv-staleness">
                  <span className={`stale-dot ${stalenessClass(tcLatestAt)}`}/>
                  <span>last count: {fmtWhen(tcLatestAt)}</span>
                </div>
              </div>

              {/* Combined */}
              <div className="inv-cell-combined">
                <div className="inv-combined-num">{fmtBins(combined)}</div>
                <div className="inv-combined-sub">
                  {par > 0 && (
                    <span style={{color: combined >= par ? 'var(--green)' : combined >= restock ? 'var(--yellow)' : 'var(--red)'}}>
                      {combined >= par ? '✓ at par' : combined >= restock ? 'below par' : 'restock'}
                    </span>
                  )}
                </div>
              </div>
            </div>
          );
        };

        // Render in fixed type order: cookie_dough, ice_cream_sandwich, buttercream_bag
        const typeOrder = ['cookie_dough','ice_cream_sandwich','buttercream_bag'];
        return typeOrder.filter(t => grouped[t]).map(t => {
          const meta = productTypeMeta[t] || { label: t, icon: '📦' };
          const rows = grouped[t].map(renderProductRow).filter(Boolean);
          if (rows.length === 0) return null;
          return (
            <div key={t} className="card" style={{padding:0,overflow:'hidden',marginTop:14}}>
              <div className="inv-product-header">
                <span style={{fontSize:18}}>{meta.icon}</span> {meta.label}
              </div>
              <div className="inv-grid-header">
                <div className="inv-cell-flavor">Product</div>
                <div className="inv-cell-loc">
                  <div className="inv-loc-name">Petoskey</div>
                </div>
                <div className="inv-cell-loc">
                  <div className="inv-loc-name">Traverse City</div>
                </div>
                <div className="inv-cell-combined">Combined</div>
              </div>
              {rows}
            </div>
          );
        });
      })()}
    </div>
  );
}


// ─── SYNC ───────────────────────────
function SyncTab() {
  const [syncing, setSyncing] = useState(null);
  const [results, setResults] = useState({});
  const [shopifyDays, setShopifyDays] = useState(7);
  const syncClover = async () => { setSyncing('clover'); try { const r = await api('clover',{since:new Date(Date.now()-86400000).toISOString()}); setResults(p=>({...p,clover:r.results})); } catch(e) { setResults(p=>({...p,clover:{errors:[e.message]}})); } setSyncing(null); };
  const syncShopify = async (days) => { 
    setSyncing('shopify'); 
    try { 
      const r = await api('shopify', { days: days || shopifyDays }); 
      setResults(p=>({...p,shopify:r.results, shopifyError:null})); 
    } catch(e) { 
      setResults(p=>({...p,shopify:null, shopifyError:e.message})); 
    } 
    setSyncing(null); 
  };
  return (
    <div>
      <div className="card"><h3>Sync Sales Data</h3><p className="sub">Pull sales from Clover and Shopify to feed the production plan and velocity calculations.</p>
        <div style={{display:'flex',gap:12,marginTop:16,flexWrap:'wrap'}}>
          <button className="btn btn-green" onClick={syncClover} disabled={syncing} style={{flex:1,padding:12,minWidth:200}}>{syncing==='clover'?'Syncing...':'Sync Clover (In-Store)'}</button>
          <div style={{flex:2,display:'flex',gap:8,alignItems:'center',minWidth:300}}>
            <select className="select" style={{width:120}} value={shopifyDays} onChange={e=>setShopifyDays(parseInt(e.target.value))}>
              <option value={1}>Last 24hr</option>
              <option value={7}>Last 7 days</option>
              <option value={14}>Last 14 days</option>
              <option value={30}>Last 30 days</option>
            </select>
            <button className="btn btn-blue" onClick={()=>syncShopify()} disabled={syncing} style={{flex:1,padding:12}}>{syncing==='shopify'?'Syncing Shopify...':'Sync Shopify (Online)'}</button>
          </div>
        </div>
      </div>
      {results.shopifyError && <div className="card" style={{borderLeft:'3px solid var(--red)'}}><h3 style={{color:'var(--red)'}}>Shopify Error</h3><p style={{fontSize:13,marginTop:8,color:'var(--red)'}}>{results.shopifyError}</p><p style={{fontSize:12,color:'var(--gray)',marginTop:4}}>Check that SHOPIFY_ACCESS_TOKEN and SHOPIFY_STORE_DOMAIN env vars are set in Vercel.</p></div>}
      {results.shopify && <div className="card" style={{borderLeft:'3px solid var(--blue)'}}>
        <h3>Shopify Sync Results</h3>
        <div style={{display:'flex',gap:16,marginTop:12,flexWrap:'wrap'}}>
          <div style={{textAlign:'center'}}><div className="serif" style={{fontSize:24,color:'var(--blue)'}}>{results.shopify.inserted||0}</div><div style={{fontSize:11,color:'var(--gray)'}}>New sales added</div></div>
          <div style={{textAlign:'center'}}><div className="serif" style={{fontSize:24,color:'var(--green)'}}>{results.shopify.matched||0}</div><div style={{fontSize:11,color:'var(--gray)'}}>Cookies matched</div></div>
          <div style={{textAlign:'center'}}><div className="serif" style={{fontSize:24,color:'var(--orange)'}}>{results.shopify.boxes||0}</div><div style={{fontSize:11,color:'var(--gray)'}}>Box cookies</div></div>
          <div style={{textAlign:'center'}}><div className="serif" style={{fontSize:24,color:'var(--gray)'}}>{results.shopify.skipped_duplicates||0}</div><div style={{fontSize:11,color:'var(--gray)'}}>Already synced</div></div>
        </div>
        {results.shopify.unmatched?.length>0&&<div style={{marginTop:12}}><p style={{color:'var(--yellow)',fontSize:12}}>Unmatched items: {[...new Set(results.shopify.unmatched)].join(', ')}</p></div>}
        {results.shopify.debug_titles&&<div style={{marginTop:12,borderTop:'1px solid var(--border)',paddingTop:8}}>
          <p style={{fontSize:11,color:'var(--gray)'}}>Debug — {results.shopify.debug_order_count} orders, {results.shopify.debug_titles.length} unique line items:</p>
          <p style={{fontSize:11,color:'var(--gray2)',marginTop:4,wordBreak:'break-all'}}>{results.shopify.debug_titles.join(' | ')}</p>
          {results.shopify.debug_variants?.length>0&&<><p style={{fontSize:11,color:'var(--blue)',marginTop:8}}>Variants ({results.shopify.debug_variants.length}):</p><p style={{fontSize:11,color:'var(--gray2)',marginTop:2,wordBreak:'break-all'}}>{results.shopify.debug_variants.join(' | ')}</p></>}
          {results.shopify.debug_item_attrs?.length>0&&<><p style={{fontSize:11,color:'var(--orange)',marginTop:8}}>Line item attributes ({results.shopify.debug_item_attrs.length}):</p><p style={{fontSize:11,color:'var(--gray2)',marginTop:2,wordBreak:'break-all'}}>{results.shopify.debug_item_attrs.join(' | ')}</p></>}
          {(!results.shopify.debug_variants?.length && !results.shopify.debug_item_attrs?.length)&&<p style={{fontSize:11,color:'var(--red)',marginTop:8}}>No variants or line item attributes found — individual cookies may be stored elsewhere</p>}
        </div>}
      </div>}
      {results.clover && <div className="card"><h3>Clover Results</h3><p style={{fontSize:13,marginTop:8}}>Petoskey: {results.clover.petoskey||0} | TC: {results.clover.tc||0} | Matched: {results.clover.matched||0}</p>{results.clover.unmatched?.length>0&&<p style={{color:'var(--yellow)',fontSize:12,marginTop:4}}>Unmatched: {[...new Set(results.clover.unmatched)].join(', ')}</p>}{results.clover.errors?.length>0&&<p style={{color:'var(--red)',fontSize:12,marginTop:4}}>Errors: {results.clover.errors.join(', ')}</p>}</div>}
    </div>
  );
}

// ─── SETTINGS ───────────────────────
function SettingsTab({flavors, onRefresh}) {
  const [settingsTab, setSettingsTab] = useState('flavors');
  const [showAdd, setShowAdd] = useState(false);
  const [nf, setNf] = useState({name:'',type:'specialty',base_dough_id:'',is_stuffed:false,par_level_bins:6,restock_trigger_bins:3,status:'live',schedule_start_month:'',schedule_start_year:2026,schedule_end_month:'',schedule_end_year:2026,schedule_repeats:false});
  const [bases, setBases] = useState([]);
  const [pantryItems, setPantryItems] = useState([]);
  const [pantryEdits, setPantryEdits] = useState({});
  const [savingPantry, setSavingPantry] = useState(false);
  const [ingredients, setIngredients] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [newEmpName, setNewEmpName] = useState('');

  // Flavor lifecycle state
  const [allFlavors, setAllFlavors] = useState([]);   // includes retired
  const [schedule, setSchedule] = useState([]);        // flavor_schedule rows
  const [flavorEdits, setFlavorEdits] = useState({}); // {flavorId: {field: val}}
  const [savingFlavor, setSavingFlavor] = useState(null);
  const [showScheduleAdd, setShowScheduleAdd] = useState(false);
  const [newSched, setNewSched] = useState({flavor_id:'',start_month:'',start_year:2026,end_month:'',end_year:2026,repeats_annually:false,notes:''});
  const [showRetired, setShowRetired] = useState(false);

  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const monthIdx = m => MONTHS.indexOf(m);

  // Defer the parent dashboard reload until the user leaves Settings.
  // The dashboard endpoint runs ~8 sequential DB queries per flavor, so calling
  // it after every flavor add/edit caused multi-second lag. Settings has its
  // own local state (allFlavors) that updates instantly via loadAllFlavors().
  const dirtyRef = useRef(false);
  const markDirty = () => { dirtyRef.current = true; };
  useEffect(() => {
    return () => { if (dirtyRef.current) onRefresh(); };
  }, []);

  useEffect(() => {
    db('base_doughs','select').then(d=>setBases(d.data||[]));
    loadPantry();
    loadEmployees();
    loadAllFlavors();
    loadSchedule();
  }, []);

  const loadAllFlavors = async () => {
    const {data} = await db('flavors','select',{orderBy:'type'});
    setAllFlavors(data || []);
  };

  const loadSchedule = async () => {
    const {data} = await db('flavor_schedule','select',{orderBy:'start_year'});
    setSchedule(data || []);
  };

  const loadEmployees = async () => {
    const {data} = await db('employees','select',{orderBy:'name'});
    setEmployees(data || []);
  };

  const addEmployee = async () => {
    const name = newEmpName.trim();
    if (!name) return;
    await db('employees','insert',{data:{name, active:true}});
    setNewEmpName('');
    loadEmployees();
  };

  const toggleEmployee = async (emp) => {
    await db('employees','update',{id:emp.id, data:{active:!emp.active}});
    loadEmployees();
  };

  const deleteEmployee = async (emp) => {
    if (!confirm(`Delete ${emp.name}? This cannot be undone. (Consider deactivating instead to preserve history.)`)) return;
    await db('employees','delete',{id:emp.id});
    loadEmployees();
  };

  const loadPantry = async () => {
    const {data: p} = await db('pantry','select',{orderBy:'ingredient_id'});
    const {data: ings} = await db('ingredients','select',{filters:{active:true},orderBy:'name'});
    setPantryItems(p || []);
    setIngredients(ings || []);
  };

  const addFlavor = async () => {
    if (!nf.name) return;
    // Insert the flavor
    const {data: inserted} = await db('flavors','insert',{data:{
      name:nf.name,
      type:nf.type,
      base_dough_id:nf.base_dough_id?parseInt(nf.base_dough_id):null,
      is_stuffed:nf.is_stuffed,
      bin_capacity_cookies:nf.is_stuffed?56:80,
      par_level_bins:parseFloat(nf.par_level_bins),
      restock_trigger_bins:parseFloat(nf.restock_trigger_bins),
      batch_size_cookies:300,
      status: nf.status,
      active: nf.status !== 'retired'
    }});
    // If a schedule was specified, create the schedule entry too
    if (inserted && inserted[0] && nf.schedule_start_month && nf.schedule_end_month) {
      await db('flavor_schedule','insert',{data:{
        flavor_id: inserted[0].id,
        start_month: nf.schedule_start_month,
        start_year: parseInt(nf.schedule_start_year),
        end_month: nf.schedule_end_month,
        end_year: parseInt(nf.schedule_end_year),
        repeats_annually: nf.schedule_repeats,
        notes: null
      }});
    }
    setShowAdd(false);
    setNf({name:'',type:'specialty',base_dough_id:'',is_stuffed:false,par_level_bins:6,restock_trigger_bins:3,status:'live',schedule_start_month:'',schedule_start_year:2026,schedule_end_month:'',schedule_end_year:2026,schedule_repeats:false});
    loadAllFlavors();
    loadSchedule();
    markDirty();
  };

  // Change flavor status: pre_production | live | retired
  const setFlavorStatus = async (flavorId, newStatus) => {
    setSavingFlavor(flavorId);
    await db('flavors','update',{id:flavorId, data:{
      status: newStatus,
      active: newStatus !== 'retired'
    }});
    await loadAllFlavors();
    markDirty();
    setSavingFlavor(null);
  };

  // Inline flavor edits
  const setFlavorField = (flavorId, field, val) => {
    setFlavorEdits(prev => ({...prev, [flavorId]: {...(prev[flavorId]||{}), [field]: val}}));
  };

  const saveFlavorEdit = async (flavorId) => {
    const edits = flavorEdits[flavorId];
    if (!edits) return;
    setSavingFlavor(flavorId);
    const data = {};
    if ('name' in edits) data.name = edits.name;
    if ('par_level_bins' in edits) data.par_level_bins = parseFloat(edits.par_level_bins);
    if ('restock_trigger_bins' in edits) data.restock_trigger_bins = parseFloat(edits.restock_trigger_bins);
    if ('is_stuffed' in edits) {
      data.is_stuffed = edits.is_stuffed;
      data.bin_capacity_cookies = edits.is_stuffed ? 56 : 80;
    }
    if ('base_dough_id' in edits) data.base_dough_id = edits.base_dough_id ? parseInt(edits.base_dough_id) : null;
    await db('flavors','update',{id:flavorId, data});
    setFlavorEdits(prev => { const n = {...prev}; delete n[flavorId]; return n; });
    await loadAllFlavors();
    markDirty();
    setSavingFlavor(null);
  };

  const cancelFlavorEdit = (flavorId) => {
    setFlavorEdits(prev => { const n = {...prev}; delete n[flavorId]; return n; });
  };

  // Schedule operations
  const addSchedule = async () => {
    if (!newSched.flavor_id || !newSched.start_month || !newSched.end_month) return;
    await db('flavor_schedule','insert',{data:{
      flavor_id: parseInt(newSched.flavor_id),
      start_month: newSched.start_month,
      start_year: parseInt(newSched.start_year),
      end_month: newSched.end_month,
      end_year: parseInt(newSched.end_year),
      repeats_annually: newSched.repeats_annually,
      notes: newSched.notes || null
    }});
    setShowScheduleAdd(false);
    setNewSched({flavor_id:'',start_month:'',start_year:2026,end_month:'',end_year:2026,repeats_annually:false,notes:''});
    loadSchedule();
  };

  const deleteSchedule = async (id) => {
    if (!confirm('Delete this scheduled run?')) return;
    await db('flavor_schedule','delete',{id});
    loadSchedule();
  };

  // Month transition helper: determine what needs to change based on current date
  const getMonthTransitionPlan = () => {
    const now = new Date();
    const currentMonth = MONTHS[now.getMonth()];
    const currentYear = now.getFullYear();

    // Does a scheduled run "cover" this month? (accounting for annual repeats)
    const isActiveNow = (sched) => {
      const sMonth = monthIdx(sched.start_month), eMonth = monthIdx(sched.end_month);
      const sYear = sched.start_year, eYear = sched.end_year;
      const mIdx = monthIdx(currentMonth);

      if (sched.repeats_annually) {
        // Annual: ignore year, check month range
        if (sMonth <= eMonth) return mIdx >= sMonth && mIdx <= eMonth;
        return mIdx >= sMonth || mIdx <= eMonth; // wraps (e.g. Nov-Jan)
      }
      // One-off: must be within date range
      const curDate = currentYear * 12 + mIdx;
      const startDate = sYear * 12 + sMonth;
      const endDate = eYear * 12 + eMonth;
      return curDate >= startDate && curDate <= endDate;
    };

    const shouldBeLiveFlavorIds = new Set(
      schedule.filter(isActiveNow).map(s => s.flavor_id)
    );

    // Specialties currently live that shouldn't be (past their run)
    const toRetire = allFlavors.filter(f =>
      f.type === 'specialty' &&
      f.status === 'live' &&
      !shouldBeLiveFlavorIds.has(f.id)
    );

    // Specialties currently pre_production that should be live now
    const toGoLive = allFlavors.filter(f =>
      f.type === 'specialty' &&
      f.status === 'pre_production' &&
      shouldBeLiveFlavorIds.has(f.id)
    );

    // Retired specialties that are scheduled to run now (e.g. annual repeats)
    const toReactivate = allFlavors.filter(f =>
      f.type === 'specialty' &&
      f.status === 'retired' &&
      shouldBeLiveFlavorIds.has(f.id)
    );

    return { toRetire, toGoLive, toReactivate, currentMonth, currentYear };
  };

  const savePantryEdits = async () => {
    setSavingPantry(true);
    for (const [ingId, vals] of Object.entries(pantryEdits)) {
      const ingIdNum = parseInt(ingId);
      const existing = pantryItems.find(p => p.ingredient_id === ingIdNum);
      const ing = ingredients.find(i => i.id === ingIdNum);
      const data = {
        quantity_on_hand: parseFloat(vals.on_hand || 0),
        par_level: parseFloat(vals.par || 0),
        unit: ing?.order_unit || 'unit',
        updated_by: 'manager'
      };
      if (existing) {
        await db('pantry','update',{id:existing.id, data});
      } else {
        // Create new pantry row if it doesn't exist yet
        await db('pantry','insert',{data: {ingredient_id: ingIdNum, ...data}});
      }
    }
    setPantryEdits({});
    setSavingPantry(false);
    loadPantry();
  };

  const getPantryVal = (ingId, field) => {
    if (pantryEdits[ingId] && pantryEdits[ingId][field] !== undefined) return pantryEdits[ingId][field];
    const p = pantryItems.find(pi => pi.ingredient_id === ingId);
    return p ? (field === 'on_hand' ? p.quantity_on_hand : p.par_level) : 0;
  };

  const setPantryField = (ingId, field, val) => {
    setPantryEdits(prev => ({...prev, [ingId]: {...(prev[ingId]||{}), [field]: val}}));
  };

  const supplierNames = {1:'GFS',2:'Webstaurant',3:'Amazon'};

  return (
    <div>
      <div className="tab-pills">
        <button className={settingsTab==='flavors'?'active':''} onClick={()=>setSettingsTab('flavors')}>Flavors</button>
        <button className={settingsTab==='schedule'?'active':''} onClick={()=>setSettingsTab('schedule')}>Schedule</button>
        <button className={settingsTab==='pantry'?'active':''} onClick={()=>setSettingsTab('pantry')}>Pantry & Par Levels</button>
        <button className={settingsTab==='employees'?'active':''} onClick={()=>setSettingsTab('employees')}>Employees</button>
      </div>

      {settingsTab === 'flavors' && (() => {
        const liveFlavs = allFlavors.filter(f => f.status === 'live');
        const preProdFlavs = allFlavors.filter(f => f.status === 'pre_production');
        const retiredFlavs = allFlavors.filter(f => f.status === 'retired');
        const liveClassics = liveFlavs.filter(f => f.type === 'classic');
        const liveSpecialties = liveFlavs.filter(f => f.type === 'specialty');
        const liveExtras = liveFlavs.filter(f => f.type === 'extra');
        const transition = getMonthTransitionPlan();
        const needsTransition = transition.toRetire.length > 0 || transition.toGoLive.length > 0 || transition.toReactivate.length > 0;

        const renderFlavorRow = (f) => {
          const editing = flavorEdits[f.id];
          const isSaving = savingFlavor === f.id;
          const baseLetters = ['','A','B','C','D','F'];
          return (
            <tr key={f.id}>
              <td style={{fontWeight:500}}>
                {editing && 'name' in editing ? (
                  <input className="input-wide" style={{maxWidth:180}} value={editing.name} onChange={e=>setFlavorField(f.id,'name',e.target.value)}/>
                ) : (
                  <span onClick={()=>setFlavorField(f.id,'name',f.name)} style={{cursor:'text'}}>{f.name}</span>
                )}
              </td>
              <td>
                <Tag color={f.type==='classic'?'var(--blue)':f.type==='specialty'?'var(--orange)':'var(--green)'}>{f.type.toUpperCase()}</Tag>
              </td>
              <td className="c">
                {editing ? (
                  <select className="select" style={{width:80}} value={editing.base_dough_id ?? (f.base_dough_id||'')} onChange={e=>setFlavorField(f.id,'base_dough_id',e.target.value)}>
                    <option value="">—</option>
                    {bases.map(b=><option key={b.id} value={b.id}>{b.label||b.name}</option>)}
                  </select>
                ) : (f.base_dough_id ? baseLetters[f.base_dough_id] || '?' : '—')}
              </td>
              <td className="c">
                {editing ? (
                  <input type="checkbox" checked={editing.is_stuffed ?? f.is_stuffed} onChange={e=>setFlavorField(f.id,'is_stuffed',e.target.checked)}/>
                ) : (f.is_stuffed ? '✓' : '—')}
              </td>
              <td className="c" style={{color:'var(--gray)',fontSize:12}}>{f.bin_capacity_cookies}</td>
              <td className="c">
                {editing ? (
                  <input className="input" type="number" step="0.25" value={editing.par_level_bins ?? f.par_level_bins} onChange={e=>setFlavorField(f.id,'par_level_bins',e.target.value)}/>
                ) : f.par_level_bins}
              </td>
              <td className="c">
                {editing ? (
                  <input className="input" type="number" step="0.25" value={editing.restock_trigger_bins ?? f.restock_trigger_bins} onChange={e=>setFlavorField(f.id,'restock_trigger_bins',e.target.value)}/>
                ) : f.restock_trigger_bins}
              </td>
              <td className="c" style={{whiteSpace:'nowrap'}}>
                {editing ? (
                  <>
                    <button className="btn btn-green" style={{fontSize:10,padding:'3px 8px',marginRight:4}} onClick={()=>saveFlavorEdit(f.id)} disabled={isSaving}>{isSaving?'...':'Save'}</button>
                    <button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>cancelFlavorEdit(f.id)}>Cancel</button>
                  </>
                ) : (
                  <>
                    <button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px',marginRight:4}} onClick={()=>setFlavorField(f.id,'name',f.name)}>Edit</button>
                    {f.type !== 'classic' && f.status !== 'retired' && (
                      <button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px',color:'var(--red)',borderColor:'rgba(239,83,80,.3)'}} onClick={()=>{if(confirm(`Retire ${f.name}? Bins will sell through as-is.`))setFlavorStatus(f.id,'retired');}} disabled={isSaving}>Retire</button>
                    )}
                    {f.status === 'pre_production' && (
                      <button className="btn btn-blue" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>setFlavorStatus(f.id,'live')} disabled={isSaving}>Go Live</button>
                    )}
                  </>
                )}
              </td>
            </tr>
          );
        };

        const renderRetiredRow = (f) => {
          const isSaving = savingFlavor === f.id;
          return (
            <tr key={f.id} style={{opacity:.65}}>
              <td style={{fontWeight:500}}>{f.name}</td>
              <td><Tag color="var(--gray)">{f.type.toUpperCase()}</Tag></td>
              <td className="c" colSpan={5} style={{fontSize:12,color:'var(--gray)'}}>Retired — recipe preserved</td>
              <td className="c" style={{whiteSpace:'nowrap'}}>
                <button className="btn btn-green" style={{fontSize:10,padding:'3px 8px',marginRight:4}} onClick={()=>setFlavorStatus(f.id,'live')} disabled={isSaving}>Bring Back</button>
                <button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px'}} onClick={()=>setFlavorStatus(f.id,'pre_production')} disabled={isSaving}>Pre-production</button>
              </td>
            </tr>
          );
        };

        return (
          <>
            {/* Menu Overview */}
            <div className="card">
              <h3>Menu Overview</h3>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:10,marginTop:10}}>
                <div style={{background:'var(--bg)',borderRadius:8,padding:12,borderLeft:'3px solid var(--green)'}}>
                  <div className="serif" style={{fontSize:22,fontWeight:700,color:'var(--green)'}}>{liveFlavs.length}</div>
                  <div style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.8px'}}>Live on Menu</div>
                  <div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>{liveClassics.length} classics · {liveSpecialties.length} specialties · {liveExtras.length} extras</div>
                </div>
                <div style={{background:'var(--bg)',borderRadius:8,padding:12,borderLeft:'3px solid var(--blue)'}}>
                  <div className="serif" style={{fontSize:22,fontWeight:700,color:'var(--blue)'}}>{preProdFlavs.length}</div>
                  <div style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.8px'}}>Pre-production</div>
                  <div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>{preProdFlavs.length > 0 ? preProdFlavs.map(f=>f.name).join(', ') : 'None scheduled'}</div>
                </div>
                <div style={{background:'var(--bg)',borderRadius:8,padding:12,borderLeft:'3px solid var(--gray2)'}}>
                  <div className="serif" style={{fontSize:22,fontWeight:700,color:'var(--gray)'}}>{retiredFlavs.length}</div>
                  <div style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'.8px'}}>Retired</div>
                  <div style={{fontSize:11,color:'var(--gray)',marginTop:4}}>Ready to bring back</div>
                </div>
              </div>
            </div>

            {/* Month Transition Card (only shows when needed) */}
            {needsTransition && (
              <div className="card" style={{borderLeft:'3px solid var(--yellow)'}}>
                <h3 style={{color:'var(--yellow)'}}>⚠ Menu Transition Needed — {transition.currentMonth} {transition.currentYear}</h3>
                <p className="sub">The schedule says your menu should look different right now. Review and apply.</p>

                {transition.toRetire.length > 0 && (
                  <div style={{marginTop:12}}>
                    <div className="section-label" style={{color:'var(--red)'}}>Should be retired (past scheduled run)</div>
                    {transition.toRetire.map(f => (
                      <div key={f.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid rgba(51,51,51,.15)'}}>
                        <span>{f.name}</span>
                        <div>
                          <button className="btn btn-outline" style={{fontSize:11,padding:'4px 10px',marginRight:6}} onClick={()=>setFlavorStatus(f.id,'retired')}>Retire</button>
                          <span style={{fontSize:11,color:'var(--gray)'}}>or keep it live manually</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {transition.toGoLive.length > 0 && (
                  <div style={{marginTop:12}}>
                    <div className="section-label" style={{color:'var(--blue)'}}>Ready to go live (currently in pre-production)</div>
                    {transition.toGoLive.map(f => (
                      <div key={f.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid rgba(51,51,51,.15)'}}>
                        <span>{f.name}</span>
                        <button className="btn btn-blue" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setFlavorStatus(f.id,'live')}>Go Live</button>
                      </div>
                    ))}
                  </div>
                )}

                {transition.toReactivate.length > 0 && (
                  <div style={{marginTop:12}}>
                    <div className="section-label" style={{color:'var(--green)'}}>Scheduled to return this month (currently retired)</div>
                    {transition.toReactivate.map(f => (
                      <div key={f.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid rgba(51,51,51,.15)'}}>
                        <span>{f.name}</span>
                        <div>
                          <button className="btn btn-green" style={{fontSize:11,padding:'4px 10px',marginRight:6}} onClick={()=>setFlavorStatus(f.id,'live')}>Bring Back Live</button>
                          <button className="btn btn-outline" style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setFlavorStatus(f.id,'pre_production')}>Pre-production</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* All Flavors Table */}
            <div className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
                <div><h3>All Flavors</h3><p className="sub">Edit settings, change lifecycle status, add new flavors.</p></div>
                <button className="btn btn-blue" onClick={()=>setShowAdd(true)}>+ Add Flavor</button>
              </div>

              <table>
                <thead><tr><th>Flavor</th><th>Type</th><th className="c">Base</th><th className="c">Stuffed</th><th className="c">Bin Cap</th><th className="c">Par</th><th className="c">Trigger</th><th className="c" style={{width:200}}>Actions</th></tr></thead>
                <tbody>
                  {liveClassics.length > 0 && (<>
                    <tr><td colSpan={8} className="section-label" style={{color:'var(--blue)'}}>Classics ({liveClassics.length}) — always live</td></tr>
                    {liveClassics.map(renderFlavorRow)}
                  </>)}
                  {liveSpecialties.length > 0 && (<>
                    <tr><td colSpan={8} className="section-label" style={{color:'var(--orange)'}}>Live Specialties ({liveSpecialties.length})</td></tr>
                    {liveSpecialties.map(renderFlavorRow)}
                  </>)}
                  {liveExtras.length > 0 && (<>
                    <tr><td colSpan={8} className="section-label" style={{color:'var(--green)'}}>Extras ({liveExtras.length})</td></tr>
                    {liveExtras.map(renderFlavorRow)}
                  </>)}
                  {preProdFlavs.length > 0 && (<>
                    <tr><td colSpan={8} className="section-label" style={{color:'var(--blue)'}}>Pre-production ({preProdFlavs.length}) — in Production Plan, not in Nightly Count</td></tr>
                    {preProdFlavs.map(renderFlavorRow)}
                  </>)}
                </tbody>
              </table>

              {retiredFlavs.length > 0 && (
                <div style={{marginTop:20}}>
                  <button className="btn btn-outline" onClick={()=>setShowRetired(!showRetired)} style={{width:'100%',padding:'10px'}}>
                    {showRetired ? '▾' : '▸'} Retired Flavors ({retiredFlavs.length}) — click to {showRetired ? 'hide' : 'show'}
                  </button>
                  {showRetired && (
                    <table style={{marginTop:10}}>
                      <tbody>{retiredFlavs.map(renderRetiredRow)}</tbody>
                    </table>
                  )}
                </div>
              )}
            </div>
          </>
        );
      })()}

      {settingsTab === 'schedule' && (
        <div className="card">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
            <div><h3>Flavor Schedule</h3><p className="sub">When each specialty runs. Annual repeats auto-return every year.</p></div>
            <button className="btn btn-blue" onClick={()=>setShowScheduleAdd(true)}>+ Add Scheduled Run</button>
          </div>
          {schedule.length === 0 ? (
            <p style={{color:'var(--gray)',padding:20,textAlign:'center',fontSize:13}}>No scheduled runs yet. Add one to plan a specialty's menu window.</p>
          ) : (
            <table>
              <thead><tr><th>Flavor</th><th className="c">Starts</th><th className="c">Ends</th><th className="c">Annual?</th><th>Notes</th><th className="c">Actions</th></tr></thead>
              <tbody>{schedule.sort((a,b)=>{
                const ay = a.start_year, by = b.start_year;
                if (ay !== by) return by - ay;
                return monthIdx(b.start_month) - monthIdx(a.start_month);
              }).map(s => {
                const flav = allFlavors.find(f => f.id === s.flavor_id);
                return (
                  <tr key={s.id}>
                    <td style={{fontWeight:500}}>{flav ? flav.name : `Flavor #${s.flavor_id}`}</td>
                    <td className="c">{s.start_month} {s.start_year}</td>
                    <td className="c">{s.end_month} {s.end_year}</td>
                    <td className="c">{s.repeats_annually ? <Tag color="var(--green)">ANNUAL</Tag> : '—'}</td>
                    <td style={{fontSize:12,color:'var(--gray)'}}>{s.notes || '—'}</td>
                    <td className="c"><button className="btn btn-outline" style={{fontSize:10,padding:'3px 8px',color:'var(--red)',borderColor:'rgba(239,83,80,.3)'}} onClick={()=>deleteSchedule(s.id)}>Delete</button></td>
                  </tr>
                );
              })}</tbody>
            </table>
          )}
        </div>
      )}

      {settingsTab === 'pantry' && (() => {
        // Build a description string showing how big 1 order_unit is
        // For multi-unit cases: "1 case = 6 × 5 lbs (30 lbs)"
        // For single-unit cases: "1 bag = 50 lbs"
        const packDescription = (ing) => {
          if (!ing.order_unit) return '—';
          const unit = ing.order_unit;
          const units = ing.units_per_order_unit;
          const grams = ing.grams_per_order_unit;

          // Parse the unit_size field (e.g. "5.0 LB", "45.0 OZ", "2.0 LB")
          // to get the per-unit size for display
          let perUnitText = '';
          if (ing.unit_size) {
            // Clean up unit_size: "5.0 LB" -> "5 lbs"
            perUnitText = ing.unit_size
              .replace(/\.0\s/g, ' ')
              .replace(/\bLB\b/g, 'lbs')
              .replace(/\bOZ\b/g, 'oz')
              .replace(/\bFOZ\b/g, 'fl oz')
              .replace(/\bCT\b/g, 'ct')
              .replace(/\bGAL\b/g, 'gal')
              .replace(/\bQT\b/g, 'qt')
              .trim();
          }

          // Total grams display
          let totalText = '';
          if (ing.category === 'ingredient' && grams) {
            const lbs = grams / 453.592;
            if (lbs >= 1) totalText = `${lbs.toFixed(1)} lbs`;
            else totalText = `${(grams / 28.3495).toFixed(1)} oz`;
          }

          // Assemble the description
          if (units && units > 1 && perUnitText) {
            // Multi-unit case: "1 case = 6 × 5 lbs (30 lbs total)"
            if (totalText) {
              return `1 ${unit} = ${units} × ${perUnitText} (${totalText} total)`;
            }
            return `1 ${unit} = ${units} × ${perUnitText}`;
          } else if (totalText) {
            // Single-unit case: "1 bag = 50 lbs"
            return `1 ${unit} = ${totalText}`;
          } else if (units) {
            return `1 ${unit} = ${units} units`;
          }
          return `1 ${unit}`;
        };

        // Supplier name lookup
        const supplierColors = {1:'var(--green)', 2:'#42A5F5', 3:'#FF7043'};

        const renderCategorySection = (categoryKey, label, description) => {
          const filtered = ingredients.filter(i => (i.category || 'ingredient') === categoryKey);
          if (filtered.length === 0) return null;

          // Group by supplier
          const bySupplier = {};
          for (const ing of filtered) {
            const sid = ing.supplier_id || 0;
            if (!bySupplier[sid]) bySupplier[sid] = [];
            bySupplier[sid].push(ing);
          }

          return (
            <div key={categoryKey} style={{marginBottom:28}}>
              <div style={{borderLeft:'3px solid var(--blue)',paddingLeft:12,marginBottom:10}}>
                <h3 style={{margin:0}}>{label}</h3>
                <p className="sub" style={{marginBottom:0,fontSize:12}}>{description}</p>
              </div>
              {Object.entries(bySupplier).map(([sid,ings]) => (
                <div key={sid} style={{marginBottom:18}}>
                  <div className="section-label" style={{color:supplierColors[sid]||'var(--gray)',fontSize:11}}>{supplierNames[sid]||'Other'} ({ings.length})</div>
                  <table>
                    <thead>
                      <tr>
                        <th style={{minWidth:160}}>Ingredient</th>
                        <th style={{fontSize:11,color:'var(--gray)'}}>Pack Size</th>
                        <th className="c" style={{width:100}}>On Hand</th>
                        <th className="c" style={{width:100}}>Par (min)</th>
                        <th style={{width:60,fontSize:11,color:'var(--gray)'}}>Unit</th>
                      </tr>
                    </thead>
                    <tbody>{ings.map(ing => (
                      <tr key={ing.id}>
                        <td style={{fontWeight:500}}>{ing.nickname || ing.name}</td>
                        <td style={{color:'var(--gray)',fontSize:12}}>{packDescription(ing)}</td>
                        <td className="c">
                          <input
                            className="input"
                            type="number"
                            step="0.25"
                            min="0"
                            placeholder="0"
                            value={getPantryVal(ing.id,'on_hand')}
                            onChange={e=>setPantryField(ing.id,'on_hand',e.target.value)}
                          />
                        </td>
                        <td className="c">
                          <input
                            className="input"
                            type="number"
                            step="0.25"
                            min="0"
                            placeholder="0"
                            value={getPantryVal(ing.id,'par')}
                            onChange={e=>setPantryField(ing.id,'par',e.target.value)}
                          />
                        </td>
                        <td style={{color:'var(--gray)',fontSize:12,whiteSpace:'nowrap'}}>{ing.order_unit ? ing.order_unit + (getPantryVal(ing.id,'on_hand') == 1 ? '' : 's') : 'unit'}</td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
              ))}
            </div>
          );
        };

        return (
          <div>
            {/* Walk-through instructions card */}
            <div className="card" style={{borderLeft:'3px solid var(--blue)',marginBottom:14}}>
              <h3 style={{marginBottom:6}}>Pantry Walk-Through</h3>
              <p className="sub" style={{marginBottom:10}}>
                For every item you use, enter the amount you have on hand <strong>in that item's order unit</strong> (cases, bags, pails, etc).
                Partial cases = decimals. Check the "Pack Size" column to see what's in each unit.
              </p>
              <div style={{background:'var(--bg)',padding:10,borderRadius:6,fontSize:13,marginBottom:10}}>
                <strong>Quick conversions:</strong> divide (what you have) by (what's in a full case)
                <div style={{marginTop:6,lineHeight:1.7}}>
                  <div>• 3 tubs of baking powder (6 per case) → <strong>0.5</strong></div>
                  <div>• 3 boxes brownie mix (6 per case) → <strong>0.5</strong></div>
                  <div>• 2 full cases + half case butter → <strong>2.5</strong></div>
                  <div>• 12 lbs loose chocolate chips (25 lb case) → <strong>0.5</strong></div>
                  <div>• Nothing left → <strong>0</strong></div>
                </div>
              </div>
              <div style={{background:'var(--bg)',padding:10,borderRadius:6,fontSize:13}}>
                <strong>Par (minimum)</strong> = the lowest you'll ever let the pantry drop before reordering.
                For LOL butter (3-4 week lead time), set this higher (maybe 3-4 cases).
                For fast-moving items like flour or chips, 1-2 cases is usually fine.
              </div>
            </div>

            {/* Save/cancel header when edits pending */}
            {Object.keys(pantryEdits).length > 0 && (
