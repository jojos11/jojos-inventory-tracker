<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoJo's Cookie Co. — Inventory Tracker</title>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#A2CCEB;--bg:#1A1A1A;--card:#242424;--border:#333;--gray:#999;--gray2:#666;--green:#4CAF50;--yellow:#FFB300;--red:#EF5350;--orange:#FF9800}
body{background:var(--bg);color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh}
input,select,textarea,button{font-family:'DM Sans',sans-serif}
.serif{font-family:'Playfair Display',serif}
header{background:var(--card);border-bottom:2px solid var(--blue);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-logo{height:36px;object-fit:contain}
.nav{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.nav button{padding:7px 12px;border-radius:6px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:transparent;color:var(--gray);transition:all .15s;white-space:nowrap}
.nav button.active{background:var(--blue);color:#000}
.loc-toggle{display:flex;gap:2px;background:var(--bg);border-radius:6px;padding:2px;border:1px solid var(--border)}
.loc-toggle button{padding:6px 12px;border-radius:5px;border:none;cursor:pointer;font-size:11px;font-weight:600;background:transparent;color:var(--gray)}
.loc-toggle button.active{background:var(--blue);color:#000}
main{padding:20px;max-width:1200px;margin:0 auto}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:14px 18px;flex:1;min-width:120px}
.stat-val{font-size:24px;font-weight:700;font-family:'Playfair Display',serif}
.stat-lbl{font-size:11px;color:var(--gray);margin-top:2px}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:18px;margin-bottom:14px}
.card h3{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .sub{font-size:12px;color:var(--gray);margin:4px 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border)}
th.c{text-align:center}
td{padding:7px 12px;border-bottom:1px solid rgba(51,51,51,.15)}
td.c{text-align:center}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0;margin-right:7px}
.tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;margin-left:6px}
.btn{padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-blue{background:var(--blue);color:#000}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--gray)}
.btn-outline:hover{border-color:var(--gray)}
.bar-wrap{display:flex;align-items:center;gap:5px}
.bar{width:50px;height:4px;border-radius:2px;background:#333;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .3s}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;padding:10px 12px 4px}
.input{width:52px;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:5px 6px;color:#fff;font-size:13px;text-align:center}
.input:focus{border-color:var(--blue);outline:none}
.input-wide{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:#fff;font-size:13px}
.input-wide:focus{border-color:var(--blue);outline:none}
.select{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 12px;color:#fff;font-size:13px;width:100%}
.select:focus{border-color:var(--blue);outline:none}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:24px;max-width:560px;width:90%;max-height:85vh;overflow-y:auto}
.clickable-row{cursor:pointer;transition:background .12s}
.clickable-row:hover{background:rgba(162,204,235,.06)}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:8px}
.alert-critical{background:rgba(239,83,80,.12);border:1px solid rgba(239,83,80,.25);color:var(--red)}
.alert-warning{background:rgba(255,179,0,.1);border:1px solid rgba(255,179,0,.2);color:var(--yellow)}
.alert-transfer{background:rgba(162,204,235,.1);border:1px solid rgba(162,204,235,.2);color:var(--blue)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:40px;text-align:center;width:360px}
.login-logo{width:120px;height:120px;border-radius:50%;object-fit:cover;margin-bottom:20px;border:3px solid var(--blue)}
.prep-group{background:var(--bg);border-radius:10px;padding:14px;margin-bottom:10px}
.prep-group h4{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.prep-item{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid rgba(51,51,51,.15)}
.prep-item:last-child{border-bottom:none}
.tab-pills{display:flex;gap:4px;margin-bottom:12px}
.tab-pills button{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--gray);font-size:12px;font-weight:600;cursor:pointer}
.tab-pills button.active{background:var(--blue);color:#000;border-color:var(--blue)}

/* ─── Nightly Count Screen ─── */
.count-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(51,51,51,.25);flex-wrap:wrap}
.count-row:hover{background:rgba(162,204,235,.03)}
.count-row .flav-name{flex:1;min-width:140px;font-weight:500;font-size:14px}
.count-row .prev-count{font-size:11px;color:var(--gray);font-weight:400;margin-left:6px}
.count-row .variance-warn{font-size:10px;color:var(--yellow);margin-left:6px;font-weight:600}
.quick-btns{display:flex;gap:3px;flex-wrap:wrap}
.quick-btn{min-width:34px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:#ccc;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;font-family:inherit}
.quick-btn:hover{border-color:var(--gray)}
.quick-btn.active{background:var(--blue);color:#000;border-color:var(--blue)}
.quick-btn.custom{background:var(--card);color:var(--blue);font-style:italic}
.quick-btn.not-stocked{background:transparent;color:var(--gray2);font-size:10px;padding:6px 10px}
.quick-btn.not-stocked.active{background:var(--gray2);color:#fff;border-color:var(--gray2)}
.custom-input{width:56px;background:var(--bg);border:1px solid var(--blue);border-radius:6px;padding:6px 8px;color:#fff;font-size:13px;text-align:center;font-family:inherit}
.step-btn{min-width:32px;width:32px;height:32px;padding:0;border-radius:6px;border:1px solid var(--blue);background:rgba(162,204,235,.08);color:var(--blue);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;font-family:inherit;line-height:1}
.step-btn:hover{background:var(--blue);color:#000}
.step-btn:active{transform:scale(.95)}
.step-val{min-width:30px;padding:0 6px;text-align:center;font-size:14px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.step-val.provisional{color:var(--yellow);font-style:italic;opacity:.7;font-weight:600}
.provisional-input{border-color:var(--yellow) !important;color:var(--yellow) !important;font-style:italic;opacity:.85}
.provisional-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 16px;background:rgba(162,204,235,.08);border:1px solid rgba(162,204,235,.25);border-radius:8px;margin-top:10px;font-size:13px;color:#fff;line-height:1.4}
.step-divider{width:1px;height:24px;background:var(--border);margin:0 4px}

/* Log Production: per-flavor batch entry rows. One row per cookie flavor,
   with the flavor name on the left and a [−] N [+] stepper on the right.
   Rows highlight subtly when they have a non-zero batch count to give the
   manager a visual scan of what's queued to save. */
.batch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s}
.batch-row:last-child{border-bottom:none}
.batch-row:hover{background:rgba(162,204,235,.03)}
.batch-row.has-value{background:rgba(76,175,80,.06);border-left:3px solid var(--green)}
.batch-flavor{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.batch-flavor-name{font-weight:600;color:#fff;font-size:14px}
.batch-flavor-type{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.6px}
.batch-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.batch-val{min-width:32px;padding:0 8px;text-align:center;font-size:16px;font-weight:700;color:var(--gray);font-variant-numeric:tabular-nums}
.batch-val.active{color:var(--green);font-size:18px}

/* Storage rows: fridge and freezer label columns align vertically.
   The label is a fixed-width column; the buttons live in the second column
   and wrap WITHIN that column, so they always start at the same X coordinate
   under fridge and freezer rows. */
.storage-grid{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.storage-row{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center}
.storage-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.8px;color:#fff;padding:6px 8px;border-radius:6px;background:rgba(162,204,235,.08);border-left:3px solid var(--blue);text-transform:uppercase}
.storage-fridge{background:rgba(162,204,235,.12);border-left-color:var(--blue);color:#fff}
.storage-freezer{background:rgba(180,210,240,.08);border-left-color:#7FB3D9;color:#fff}
.storage-icon{font-size:18px;line-height:1;filter:drop-shadow(0 0 4px rgba(162,204,235,.4))}
.use-last-btn{padding:5px 12px;font-size:11px;font-weight:600;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--blue);cursor:pointer;transition:all .12s;font-family:inherit}
.use-last-btn:hover{border-color:var(--blue);background:rgba(162,204,235,.08)}
.count-row.counted{background:rgba(76,175,80,.04)}
.count-row.not-stocked{opacity:.6}

/* ─── Inventory comparison page ──────────────────────────────────────── */
.inv-page{display:flex;flex-direction:column;gap:14px}
.inv-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.inv-sum-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.inv-sum-card-combined{background:rgba(162,204,235,.06);border-color:rgba(162,204,235,.25)}
.inv-sum-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.inv-sum-value{font-size:28px;font-weight:700;color:#fff;margin-top:4px;font-variant-numeric:tabular-nums}
.inv-sum-unit{font-size:12px;color:var(--gray);font-weight:400}
.inv-sum-breakdown{display:flex;gap:14px;margin-top:6px;font-size:12px;color:#ccc;font-weight:600}
.inv-sum-breakdown .icon{font-size:16px;margin-right:3px}
.inv-grid-header{display:grid;grid-template-columns:1.4fr 1fr 1fr .6fr;gap:12px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.inv-loc-name{color:var(--blue);font-size:12px;letter-spacing:.4px}
.inv-loc-sub{font-size:9px;color:var(--gray2);margin-top:2px;text-transform:none;letter-spacing:0;font-weight:400}
.inv-row{display:grid;grid-template-columns:1.4fr 1fr 1fr .6fr;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(51,51,51,.4);align-items:center}
.inv-row:hover{background:rgba(162,204,235,.03)}
.inv-row:last-child{border-bottom:none}
.inv-cell-flavor{display:flex;flex-direction:column}
.inv-cell-loc{display:flex;flex-direction:column;gap:4px;padding:6px 10px;border-radius:6px;background:rgba(0,0,0,.15)}
.inv-cell-loc.inv-low{background:rgba(239,83,80,.08);border:1px solid rgba(239,83,80,.2)}
.inv-numbers{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.inv-num{font-size:15px;font-weight:700;color:#fff;display:inline-flex;align-items:baseline;gap:5px}
.inv-num-icon{font-size:18px;line-height:1;filter:drop-shadow(0 0 4px rgba(162,204,235,.4))}
.inv-fridge{color:#fff}
.inv-freezer{color:#fff}
.inv-total{color:var(--blue);font-weight:700;font-size:14px;margin-left:auto}
.inv-staleness{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--gray)}
.inv-cell-combined{text-align:right}
.inv-combined-num{font-size:22px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.inv-combined-sub{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-top:2px}
.stale-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gray2)}
.stale-dot.stale-ok{background:var(--green)}
.stale-dot.stale-yellow{background:var(--yellow)}
.stale-dot.stale-red{background:var(--red)}
.stale-dot.stale-none{background:var(--gray2)}
.inv-product-header{padding:14px 16px;background:linear-gradient(90deg,rgba(162,204,235,.08),transparent);border-bottom:1px solid var(--border);font-size:13px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
@media (max-width:768px){
  .inv-grid-header{display:none}
  .inv-row{grid-template-columns:1fr;gap:8px;padding:14px 12px}
  .inv-cell-flavor{border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:4px}
  .inv-cell-loc::before{content:attr(data-loc);display:block;font-size:10px;color:var(--blue);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:3px}
  .inv-cell-combined{text-align:left;border-top:1px solid var(--border);padding-top:6px;display:flex;justify-content:space-between;align-items:center}
}

/* Count status banner */
.count-status{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.count-chip{flex:1;min-width:180px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:10px}
.count-chip .icon{font-size:16px}
.count-chip.ok{border-left:3px solid var(--green)}
.count-chip.stale{border-left:3px solid var(--yellow)}
.count-chip.missing{border-left:3px solid var(--red)}
.count-chip .label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px}
.count-chip .value{font-size:13px;font-weight:600;margin-top:1px}
.count-chip .who{font-size:11px;color:var(--gray);margin-top:1px}

/* Production plan */
.plan-section{background:var(--bg);border-radius:8px;padding:12px;margin-bottom:10px}
.plan-section h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.plan-row{display:grid;grid-template-columns:minmax(140px,2fr) 1fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(51,51,51,.15);font-size:13px}
.plan-row:last-child{border-bottom:none}
.plan-row .flav{font-weight:500}
.plan-row .num{text-align:center;font-weight:600}
.plan-row .small{font-size:11px;color:var(--gray)}
.plan-row .batches{background:var(--blue);color:#000;padding:4px 10px;border-radius:6px;font-weight:700;text-align:center;min-width:60px}
.plan-row.critical .flav{color:var(--red)}
.stocked-chips{display:flex;flex-wrap:wrap;gap:6px}
.stocked-chip{padding:4px 10px;border-radius:6px;background:rgba(76,175,80,.08);color:var(--green);font-size:12px}
.summary-box{background:var(--bg);border:1px solid var(--blue);border-radius:10px;padding:14px;margin-top:12px}
.summary-box h4{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;margin-bottom:8px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:8px}
.summary-item{text-align:center}
.summary-item .val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--blue)}
.summary-item .lbl{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}

/* Variance confirm modal */
.confirm-modal{background:var(--card);border:2px solid var(--yellow);border-radius:12px;padding:20px;max-width:420px}
@media(max-width:900px){
  header{flex-direction:column;gap:8px;padding:10px 14px}
  .nav{flex-wrap:wrap;justify-content:center}
  .header-logo{height:28px}
  .plan-row{grid-template-columns:1fr 1fr;font-size:12px}
  .plan-row .small{display:none}
}
@media(max-width:600px){
  .stats{flex-direction:column}
  .stat{min-width:auto}
  main{padding:12px}
  .nav button{font-size:10px;padding:6px 8px}
  .count-row .flav-name{min-width:100%}
  .quick-btn{min-width:30px;padding:5px 6px;font-size:11px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const CIRCLE_LOGO = '/api/config'; // placeholder - will use text instead
const { useState, useEffect, useCallback, useRef } = React;

let AUTH_TOKEN = null;
const api = async (endpoint, body = {}) => {
  const r = await fetch(`/api/${endpoint}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${AUTH_TOKEN}` },
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
};
const db = (table, action, opts = {}) => api('db', { table, action, ...opts });

const sColor = (cur, par) => !par ? '#666' : cur/par >= .7 ? 'var(--green)' : cur/par >= .4 ? 'var(--yellow)' : 'var(--red)';
const Dot = ({color}) => <span className="dot" style={{background:color}}/>;
const Tag = ({children,color}) => <span className="tag" style={{background:(color||'var(--blue)')+'20',color:color||'var(--blue)'}}>{children}</span>;
const Bar = ({pct,color}) => {
  const safePct = isNaN(pct) ? 0 : pct;
  return (
    <div className="bar-wrap">
      <div className="bar"><div className="bar-fill" style={{width:`${Math.min(safePct,100)}%`,background:color}}/></div>
      <span style={{fontSize:11,color,fontWeight:600,minWidth:32}}>{Math.round(safePct)}%</span>
    </div>
  );
};
const Stat = ({value,label,color}) => (
  <div className="stat">
    <div className="stat-val" style={{color:color||'#fff'}}>{value}</div>
    <div className="stat-lbl">{label}</div>
  </div>
);

// ─── LOGIN ──────────────────────────
function LoginScreen({onLogin}) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const tryLogin = async () => {
    setLoading(true); setErr('');
    AUTH_TOKEN = pw;
    try {
      await db('flavors', 'select', { limit: 1 });
      localStorage.setItem('jojo_inv_token', pw);
      onLogin();
    } catch(e) { setErr('Invalid password'); AUTH_TOKEN = null; }
    setLoading(false);
  };
  return (
    <div className="login-wrap">
      <div className="login-box">
        <div style={{width:100,height:100,borderRadius:'50%',background:'var(--blue)',margin:'0 auto 20px',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <span className="serif" style={{fontSize:28,color:'#000',fontWeight:700}}>JJ</span>
        </div>
        <h2 className="serif" style={{fontSize:22,marginBottom:4}}>Inventory Tracker</h2>
        <p style={{color:'var(--gray)',fontSize:13,marginBottom:24}}>JoJo's Cookie Co.</p>
        <input className="input-wide" type="password" placeholder="Enter password" value={pw}
          onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&tryLogin()}
          style={{marginBottom:12,textAlign:'center'}} autoFocus />
        {err && <p style={{color:'var(--red)',fontSize:12,marginBottom:8}}>{err}</p>}
        <button className="btn btn-blue" onClick={tryLogin} disabled={loading}
          style={{width:'100%',padding:'10px',fontSize:14}}>{loading?'Checking...':'Sign In'}</button>
      </div>
    </div>
  );
}

// ─── NIGHTLY COUNT TAB (replaces old DoughTab + InitialSetup) ───────────────
function DoughTab({loc, setLoc, flavors, products, dashData, onSaved}) {
  const locId = loc === 'petoskey' ? 1 : 2;
  const locName = loc === 'petoskey' ? 'Petoskey' : 'Traverse City';
  const storageKey = `jojo_count_draft_${locId}`;

  // Nightly count only operates on LIVE flavors — pre_production flavors have no bins yet
  const liveFlavors = flavors.filter(f => f.status === 'live' || !f.status);
  const liveProducts = (products || []).filter(p => p.status === 'live' || !p.status);

  const [employees, setEmployees] = useState([]);
  const [countedBy, setCountedBy] = useState('');
  // counts now stores {flavorId: {fridge: '0.5', freezer: '2'}}
  const [counts, setCounts] = useState({});
  const [notStocked, setNotStocked] = useState({}); // {flavorId: true}
  // productCounts: {productId: '12'} — single number per product
  const [productCounts, setProductCounts] = useState({});
  const [productNotStocked, setProductNotStocked] = useState({}); // {productId: true}
  const [notes, setNotes] = useState('');
  const [saving, setSaving] = useState(false);
  const [confirmFlavor, setConfirmFlavor] = useState(null); // variance confirm
  const [saveMsg, setSaveMsg] = useState('');

  // Previous counts (for reference + variance detection)
  // prevCounts now stores {flavorId: {fridge, freezer, total}}
  const [prevCounts, setPrevCounts] = useState({});
  const [prevProductCounts, setPrevProductCounts] = useState({}); // {productId: number}

  // Tracks which counts the employee has explicitly touched/confirmed this session.
  // Shape: {flavorId: {fridge: true, freezer: true}}
  // Pre-filled values from last night appear in counts (so steppers and presets
  // start from the right place) but DON'T count as "complete" until the employee
  // taps a button to confirm. This avoids accidentally saving stale numbers if
  // a flavor was skipped.
  const [confirmed, setConfirmed] = useState({});
  const [productConfirmed, setProductConfirmed] = useState({}); // {productId: true}

  // Load employees + previous night's counts + any local draft on mount / loc change
  useEffect(() => {
    (async () => {
      const {data: emps} = await db('employees','select',{filters:{active:true},orderBy:'name'});
      setEmployees(emps || []);

      // Get previous (most recent) count per flavor at this location.
      // OPTIMIZATION: previously this fired 2 queries per flavor (one for fridge,
      // one for freezer), serially. With 18+ flavors that's 36+ round-trips
      // before the page can render. Now: one bulk query pulls the last 60 days
      // of snapshots for this location, and we pick the latest per
      // (flavor, storage) client-side. Two queries total (snapshots + products)
      // regardless of flavor count.
      const cutoff = new Date(Date.now() - 60 * 86400000).toISOString();
      const [{data: allSnaps}, {data: allProdSnaps}] = await Promise.all([
        db('inventory_snapshots','select',{
          filters:{location_id:locId, created_at:{gte:cutoff}},
          orderBy:'created_at:desc'
        }),
        db('product_snapshots','select',{
          filters:{location_id:locId, created_at:{gte:cutoff}},
          orderBy:'created_at:desc'
        })
      ]);

      // Build the "previous count" map for flavors. Snapshots are pre-sorted
      // by created_at:desc, so the first match per (flavor_id, storage) wins.
      const prev = {};
      const seen = new Set();
      for (const s of (allSnaps || [])) {
        const key = `${s.flavor_id}_${s.storage || 'fridge'}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const storage = s.storage || 'fridge';
        const bins = s.actual_bins !== null ? Number(s.actual_bins) : null;
        if (bins === null) continue;
        if (!prev[s.flavor_id]) prev[s.flavor_id] = { fridge: null, freezer: null, total: 0 };
        prev[s.flavor_id][storage] = bins;
      }
      // Compute totals
      for (const fId of Object.keys(prev)) {
        const p = prev[fId];
        p.total = (p.fridge || 0) + (p.freezer || 0);
      }
      setPrevCounts(prev);

      // Same bulk-pick pattern for products
      const prevProd = {};
      const seenP = new Set();
      for (const s of (allProdSnaps || [])) {
        if (seenP.has(s.product_id)) continue;
        seenP.add(s.product_id);
        if (s.quantity !== null) prevProd[s.product_id] = Number(s.quantity);
      }
      setPrevProductCounts(prevProd);

      // Build the pre-fill state from last counts FIRST. Then we overlay any
      // in-progress draft on top so the user's edits aren't lost on refresh.
      //
      // Previous design: drafts blocked pre-fill entirely (all-or-nothing).
      // The bug: a single touched flavor created a draft, which then prevented
      // every OTHER flavor from getting its "last count" seed on subsequent
      // loads — Triple Chip would show "last: 5" in the header but `−` in the
      // stepper because pre-fill never ran.
      //
      // New design: pre-fill is the foundation, draft is an overlay. For any
      // flavor the user touched, the draft value wins. For flavors they
      // haven't gotten to yet, pre-fill still applies.

      // Step 1: build pre-fill maps from `prev` (last-count snapshots)
      const seedCounts = {};
      const seedConfirmed = {};
      for (const fId of Object.keys(prev)) {
        const p = prev[fId];
        const entry = {};
        const confEntry = {};
        if (p.fridge !== null && p.fridge !== undefined) {
          entry.fridge = String(p.fridge);
          confEntry.fridge = true;
        }
        if (p.freezer !== null && p.freezer !== undefined) {
          entry.freezer = String(p.freezer);
          confEntry.freezer = true;
        }
        if (Object.keys(entry).length > 0) {
          seedCounts[fId] = entry;
          seedConfirmed[fId] = confEntry;
        }
      }
      const seedProd = {};
      const seedProdConfirmed = {};
      for (const pId of Object.keys(prevProd)) {
        seedProd[pId] = String(prevProd[pId]);
        seedProdConfirmed[pId] = true;
      }

      // Step 2: load draft (if any) and overlay it on top of the pre-fill
      let draftCountedBy = '', draftNotes = '';
      let draftNotStocked = {}, draftProdNotStocked = {};
      try {
        const raw = localStorage.getItem(storageKey);
        if (raw) {
          const draft = JSON.parse(raw);
          const ageMs = Date.now() - (draft.savedAt || 0);
          if (ageMs < 18 * 3600000) {
            // Overlay draft counts per-flavor (draft wins for touched flavors,
            // pre-fill stays for untouched ones)
            if (draft.counts) {
              for (const fId of Object.keys(draft.counts)) {
                seedCounts[fId] = {...(seedCounts[fId] || {}), ...draft.counts[fId]};
              }
            }
            // Same overlay for confirmed flags
            if (draft.confirmed) {
              for (const fId of Object.keys(draft.confirmed)) {
                seedConfirmed[fId] = {...(seedConfirmed[fId] || {}), ...draft.confirmed[fId]};
              }
            }
            // Not-stocked, product counts, and product confirmed are full replacements
            // (they're sparse maps where presence = user touched)
            if (draft.notStocked) draftNotStocked = draft.notStocked;
            if (draft.productCounts) {
              for (const pId of Object.keys(draft.productCounts)) {
                seedProd[pId] = draft.productCounts[pId];
              }
            }
            if (draft.productConfirmed) {
              for (const pId of Object.keys(draft.productConfirmed)) {
                seedProdConfirmed[pId] = draft.productConfirmed[pId];
              }
            }
            if (draft.productNotStocked) draftProdNotStocked = draft.productNotStocked;
            if (draft.countedBy) draftCountedBy = draft.countedBy;
            if (draft.notes) draftNotes = draft.notes;

            // For any flavor marked not-stocked in the draft, clear its pre-fill
            // (not-stocked overrides actual count values)
            for (const fId of Object.keys(draftNotStocked)) {
              delete seedCounts[fId];
              delete seedConfirmed[fId];
            }
            for (const pId of Object.keys(draftProdNotStocked)) {
              delete seedProd[pId];
              delete seedProdConfirmed[pId];
            }
          } else {
            // Older than 18h: stale, throw it out
            localStorage.removeItem(storageKey);
          }
        }
      } catch(e) { /* ignore parse errors */ }

      // Step 3: apply everything in one shot
      setCounts(seedCounts);
      setConfirmed(seedConfirmed);
      setNotStocked(draftNotStocked);
      setProductCounts(seedProd);
      setProductConfirmed(seedProdConfirmed);
      setProductNotStocked(draftProdNotStocked);
      if (draftCountedBy) setCountedBy(draftCountedBy);
      if (draftNotes) setNotes(draftNotes);
    })();
  }, [locId, flavors, products]);

  // Persist draft whenever it changes
  useEffect(() => {
    if (Object.keys(counts).length === 0 && Object.keys(notStocked).length === 0 &&
        Object.keys(productCounts).length === 0 && Object.keys(productNotStocked).length === 0 &&
        !countedBy && !notes) return;
    try {
      localStorage.setItem(storageKey, JSON.stringify({
        counts, notStocked, confirmed, productCounts, productNotStocked, productConfirmed, countedBy, notes, savedAt: Date.now()
      }));
    } catch(e) { /* quota or disabled */ }
  }, [counts, notStocked, confirmed, productCounts, productNotStocked, productConfirmed, countedBy, notes, storageKey]);

  // Mark a field as confirmed (i.e., employee has touched it this session)
  const markConfirmed = (fId, storage) => {
    setConfirmed(cf => ({
      ...cf,
      [fId]: { ...(cf[fId] || {}), [storage]: true }
    }));
  };

  // Set count for a specific storage (fridge or freezer)
  const setCount = (fId, storage, val) => {
    setCounts(c => ({
      ...c,
      [fId]: { ...(c[fId] || {}), [storage]: val }
    }));
    markConfirmed(fId, storage);
    setNotStocked(ns => {
      if (ns[fId]) { const next = {...ns}; delete next[fId]; return next; }
      return ns;
    });
  };

  // Step count up or down by 0.25, floor at 0. Used by the +/− buttons next to
  // each storage row so employees can fine-tune the value after picking a preset.
  // If current value is empty, +/− starts from 0.
  const stepCount = (fId, storage, delta) => {
    setCounts(c => {
      const current = c[fId]?.[storage];
      const num = current !== undefined && current !== '' ? parseFloat(current) : 0;
      const next = Math.max(0, Math.round((num + delta) * 4) / 4);  // snap to 0.25
      return {
        ...c,
        [fId]: { ...(c[fId] || {}), [storage]: String(next) }
      };
    });
    markConfirmed(fId, storage);
    setNotStocked(ns => {
      if (ns[fId]) { const next = {...ns}; delete next[fId]; return next; }
      return ns;
    });
  };

  const toggleNotStocked = (fId) => {
    setNotStocked(ns => {
      const next = {...ns};
      if (next[fId]) delete next[fId];
      else next[fId] = true;
      return next;
    });
    setCounts(c => { const n = {...c}; delete n[fId]; return n; });
    // When toggling not-stocked off, the seeded values are gone, so confirmed
    // state for this flavor is also cleared (no longer relevant).
    setConfirmed(cf => { const n = {...cf}; delete n[fId]; return n; });
  };

  // Get total bins entered for a flavor (fridge + freezer)
  const getFlavorTotal = (fId) => {
    const c = counts[fId];
    if (!c) return null;
    const fridge = c.fridge !== undefined && c.fridge !== '' ? parseFloat(c.fridge) : null;
    const freezer = c.freezer !== undefined && c.freezer !== '' ? parseFloat(c.freezer) : null;
    if (fridge === null && freezer === null) return null;
    return (fridge || 0) + (freezer || 0);
  };

  // A flavor is "complete" if Not Stocked OR both fridge AND freezer are
  // confirmed by the employee. Confirmed means they've explicitly touched
  // a button for that field this session — not just that a value exists
  // (since values pre-fill from last night's counts).
  const isFlavorComplete = (fId) => {
    if (notStocked[fId]) return true;
    const cf = confirmed[fId];
    if (!cf) return false;
    return !!cf.fridge && !!cf.freezer;
  };

  // Variance check uses TOTAL bins vs previous TOTAL
  const hasVariance = (fId) => {
    const prev = prevCounts[fId];
    if (!prev || prev.total === undefined) return false;
    const total = getFlavorTotal(fId);
    if (total === null) return false;
    if (prev.total === 0 && total > 3) return true; // big jump from zero
    if (prev.total > 0) {
      if (total > prev.total * 2.5) return true;
      if (total < prev.total * 0.3 && prev.total > 1) return true;
    }
    return false;
  };

  // Product completion + helpers
  // A product is "complete" if Not Stocked OR has been confirmed by the employee
  // (i.e. they've touched its input this session, even if the value was pre-filled).
  const isProductComplete = (pId) => {
    if (productNotStocked[pId]) return true;
    return !!productConfirmed[pId];
  };

  const setProductCount = (pId, val) => {
    setProductCounts(c => ({...c, [pId]: val}));
    setProductConfirmed(pc => ({...pc, [pId]: true}));
    setProductNotStocked(ns => {
      if (ns[pId]) { const next = {...ns}; delete next[pId]; return next; }
      return ns;
    });
  };

  const toggleProductNotStocked = (pId) => {
    setProductNotStocked(ns => {
      const next = {...ns};
      if (next[pId]) delete next[pId];
      else next[pId] = true;
      return next;
    });
    setProductCounts(c => { const n = {...c}; delete n[pId]; return n; });
    setProductConfirmed(pc => { const n = {...pc}; delete n[pId]; return n; });
  };

  // Completion status for save button — must complete BOTH cookies and products
  const totalFlavors = liveFlavors.length;
  const completedFlavors = liveFlavors.filter(f => isFlavorComplete(f.id)).length;
  const totalProducts = liveProducts.length;
  const completedProducts = liveProducts.filter(p => isProductComplete(p.id)).length;
  const totalItems = totalFlavors + totalProducts;
  const completedItems = completedFlavors + completedProducts;
  const ready = countedBy && completedItems === totalItems;

  // Count items that have pre-filled values but haven't been confirmed yet.
  // These are the "if nothing changed, just tap to confirm" items.
  const provisionalFlavors = liveFlavors.filter(f => {
    if (notStocked[f.id]) return false;
    if (isFlavorComplete(f.id)) return false;
    const c = counts[f.id] || {};
    return (c.fridge !== undefined && c.fridge !== '') || (c.freezer !== undefined && c.freezer !== '');
  });
  const provisionalProducts = liveProducts.filter(p => {
    if (productNotStocked[p.id]) return false;
    if (isProductComplete(p.id)) return false;
    return productCounts[p.id] !== undefined && productCounts[p.id] !== '';
  });
  const provisionalCount = provisionalFlavors.length + provisionalProducts.length;

  // Confirm all pre-filled values at once — for when the count hasn't changed
  // since last night. One click vs. tapping every single row.
  const confirmAllProvisional = () => {
    setConfirmed(cf => {
      const next = {...cf};
      for (const f of provisionalFlavors) {
        const c = counts[f.id] || {};
        next[f.id] = {...(next[f.id] || {})};
        if (c.fridge !== undefined && c.fridge !== '') next[f.id].fridge = true;
        if (c.freezer !== undefined && c.freezer !== '') next[f.id].freezer = true;
      }
      return next;
    });
    setProductConfirmed(pc => {
      const next = {...pc};
      for (const p of provisionalProducts) next[p.id] = true;
      return next;
    });
  };

  const doSave = async () => {
    setSaving(true);
    setSaveMsg('');
    const today = new Date().toISOString().split('T')[0];

    try {
      // Save cookie flavor counts (fridge + freezer per flavor)
      for (const f of liveFlavors) {
        const isNotStocked = !!notStocked[f.id];
        const c = counts[f.id] || {};

        // Get fridge value
        const fridgeRaw = c.fridge;
        const fridgeVal = isNotStocked
          ? null
          : (fridgeRaw === '' || fridgeRaw === undefined ? null : parseFloat(fridgeRaw));

        // Get freezer value
        const freezerRaw = c.freezer;
        const freezerVal = isNotStocked
          ? null
          : (freezerRaw === '' || freezerRaw === undefined ? null : parseFloat(freezerRaw));

        // Save fridge row
        await db('inventory_snapshots','upsert',{
          onConflict: 'flavor_id,location_id,date,storage',
          data:{
            flavor_id: f.id,
            location_id: locId,
            date: today,
            storage: 'fridge',
            actual_bins: fridgeVal,
            calculated_bins: fridgeVal,
            counted_by: countedBy,
            notes: notes || null
          }
        });

        // Save freezer row
        await db('inventory_snapshots','upsert',{
          onConflict: 'flavor_id,location_id,date,storage',
          data:{
            flavor_id: f.id,
            location_id: locId,
            date: today,
            storage: 'freezer',
            actual_bins: freezerVal,
            calculated_bins: freezerVal,
            counted_by: countedBy,
            notes: notes || null
          }
        });
      }

      // Save product counts (one row per product per location per date)
      for (const p of liveProducts) {
        const isNS = !!productNotStocked[p.id];
        const raw = productCounts[p.id];
        const qty = isNS ? null : (raw === '' || raw === undefined ? null : parseFloat(raw));

        await db('product_snapshots','upsert',{
          onConflict: 'product_id,location_id,date',
          data:{
            product_id: p.id,
            location_id: locId,
            date: today,
            quantity: qty,
            counted_by: countedBy,
            notes: notes || null
          }
        });
      }

      // Clear draft
      localStorage.removeItem(storageKey);
      setCounts({});
      setNotStocked({});
      setConfirmed({});
      setProductCounts({});
      setProductNotStocked({});
      setProductConfirmed({});
      setNotes('');

      // Check if the other location still needs a count
      const otherLocId = locId === 1 ? 2 : 1;
      const otherLocName = locId === 1 ? 'Traverse City' : 'Petoskey';
      const otherCf = dashData?.countFreshness?.[otherLocId];
      const otherDone = otherCf && !otherCf.missing && otherCf.hoursAgo !== null && otherCf.hoursAgo < 18;

      if (!otherDone) {
        setSaveMsg(`✓ ${locName} saved — don't forget ${otherLocName}!`);
        setTimeout(()=>setSaveMsg(''), 6000);
      } else {
        setSaveMsg(`✓ Count saved for ${locName} — both locations complete!`);
        setTimeout(()=>setSaveMsg(''), 4000);
      }
      if (onSaved) onSaved();
    } catch(e) {
      setSaveMsg('Error saving: ' + e.message);
    }
    setSaving(false);
  };

  const handleSaveClick = () => {
    // Check for any unconfirmed variances (uses TOTAL, not per-storage)
    const variant = liveFlavors.find(f => {
      if (notStocked[f.id]) return false;
      return hasVariance(f.id);
    });
    if (variant) {
      setConfirmFlavor(variant);
      return;
    }
    doSave();
  };

  const renderFlavorRow = (f) => {
    const c = counts[f.id] || {};
    const fridgeVal = c.fridge !== undefined ? String(c.fridge) : '';
    const freezerVal = c.freezer !== undefined ? String(c.freezer) : '';
    const isNS = !!notStocked[f.id];
    const prev = prevCounts[f.id];
    const presets = ['0','0.25','0.5','0.75','1','2','3','4','5'];
    const counted = isFlavorComplete(f.id);
    const variance = hasVariance(f.id);
    const total = getFlavorTotal(f.id);

    // Helper to render a single preset bank for fridge or freezer.
    // Layout: [−] [value display] [+] | preset buttons | custom
    // The stepper lets employees nudge by 0.25 without typing or using prompts.
    // Provisional values (pre-filled from last night, not yet confirmed) show
    // grayed-out / italic so it's obvious they need to be confirmed.
    const presetBank = (storage, value) => {
      const showCustom = value !== '' && !presets.includes(value);
      const isConfirmed = !!confirmed[f.id]?.[storage];
      const isProvisional = value !== '' && !isConfirmed;
      const displayVal = value === '' ? '—' :
        value === '0.25' ? '¼' :
        value === '0.5' ? '½' :
        value === '0.75' ? '¾' :
        value;
      return (
        <div className="quick-btns">
          <button
            className="step-btn"
            onClick={()=>stepCount(f.id, storage, -0.25)}
            title="Decrease by ¼ bin">−</button>
          <span className={`step-val ${isProvisional ? 'provisional' : ''}`}
                title={isProvisional ? 'From last count — tap any button to confirm' : 'Current value'}>
            {displayVal}
          </span>
          <button
            className="step-btn"
            onClick={()=>stepCount(f.id, storage, 0.25)}
            title="Increase by ¼ bin">+</button>
          <span className="step-divider"/>
          {presets.map(p => (
            <button key={p}
              className={`quick-btn ${value===p && isConfirmed && !isNS ? 'active' : ''}`}
              onClick={()=>setCount(f.id, storage, p)}>
              {p === '0.25' ? '¼' : p === '0.5' ? '½' : p === '0.75' ? '¾' : p}
            </button>
          ))}
          {showCustom ? (
            <input
              className="custom-input"
              type="number" step="0.25" min="0"
              value={value}
              onChange={e=>setCount(f.id, storage, e.target.value)}
              onBlur={e=>{ if (e.target.value === '') setCounts(c=>{ const n={...c}; const fc={...(n[f.id]||{})}; delete fc[storage]; n[f.id]=fc; return n; }); }}
            />
          ) : (
            <button className="quick-btn custom" onClick={()=>{
              const prevForStorage = prev ? prev[storage] : undefined;
              const v = prompt(`${storage === 'fridge' ? 'Fridge' : 'Freezer'} count for ${f.name} (bins, decimals OK):`, prevForStorage != null ? String(prevForStorage) : '');
              if (v !== null && v !== '') setCount(f.id, storage, v);
            }}>custom</button>
          )}
        </div>
      );
    };

    return (
      <div key={f.id} className={`count-row ${counted ? 'counted' : ''} ${isNS ? 'not-stocked' : ''}`}>
        <div className="flav-name">
          {f.name}
          {prev && prev.total !== undefined && (
            <span className="prev-count">last: {prev.total} ({prev.fridge ?? 0}f + {prev.freezer ?? 0}fz)</span>
          )}
          {total !== null && !isNS && (
            <span className="prev-count" style={{color:'var(--green)',fontWeight:600}}>= {total} total</span>
          )}
          {variance && <span className="variance-warn">⚠ variance</span>}
        </div>

        {!isNS && (
          <div className="storage-grid">
            <div className="storage-row">
              <span className="storage-label storage-fridge">
                <span className="storage-icon">❄</span> FRIDGE
              </span>
              {presetBank('fridge', fridgeVal)}
            </div>
            <div className="storage-row">
              <span className="storage-label storage-freezer">
                <span className="storage-icon">🧊</span> FREEZER
              </span>
              {presetBank('freezer', freezerVal)}
            </div>
            {prev && (prev.fridge !== null || prev.freezer !== null) && (
              <div style={{display:'flex',justifyContent:'flex-end',marginTop:2}}>
                <button
                  className="use-last-btn"
                  onClick={()=>{
                    // One-tap shortcut: apply previous count as current and mark confirmed
                    setCounts(c => {
                      const next = {...c, [f.id]: {...(c[f.id] || {})}};
                      if (prev.fridge !== null && prev.fridge !== undefined) next[f.id].fridge = String(prev.fridge);
                      if (prev.freezer !== null && prev.freezer !== undefined) next[f.id].freezer = String(prev.freezer);
                      return next;
                    });
                    setConfirmed(cf => {
                      const next = {...cf, [f.id]: {...(cf[f.id] || {})}};
                      if (prev.fridge !== null && prev.fridge !== undefined) next[f.id].fridge = true;
                      if (prev.freezer !== null && prev.freezer !== undefined) next[f.id].freezer = true;
                      return next;
                    });
                    setNotStocked(ns => {
                      if (ns[f.id]) { const n = {...ns}; delete n[f.id]; return n; }
                      return ns;
                    });
                  }}
                  title="Use last count's values for this flavor">
                  ↺ Use last count
                </button>
              </div>
            )}
          </div>
        )}

        <div style={{marginTop:isNS ? 0 : 8}}>
          <button
            className={`quick-btn not-stocked ${isNS ? 'active' : ''}`}
            style={{width:'100%'}}
            onClick={()=>toggleNotStocked(f.id)}>
            {isNS ? '✓ Not stocked at this location' : 'Not stocked at this location'}
          </button>
        </div>
      </div>
    );
  };

  // Nightly count only shows live flavors — pre_production flavors have no bins yet
  const classics = liveFlavors.filter(f=>f.type==='classic');
  const specialties = liveFlavors.filter(f=>f.type==='specialty');
  const extras = liveFlavors.filter(f=>f.type==='extra');

  const countFreshness = dashData?.countFreshness || {};
  const fmtHours = (h) => {
    if (h === null || h === undefined) return 'never';
    if (h < 1) return 'just now';
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h/24);
    return `${d}d ${h%24}h ago`;
  };

  return (
    <div>
      {/* Location switcher — big and unmissable */}
      <div className="card" style={{padding:'14px 16px',marginBottom:12}}>
        <div style={{fontSize:11,color:'var(--gray)',textTransform:'uppercase',letterSpacing:'1px',fontWeight:700,marginBottom:10}}>
          Which location are you counting tonight?
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[
            {id:1, key:'petoskey', name:'Petoskey'},
            {id:2, key:'tc', name:'Traverse City'}
          ].map(location => {
            const active = loc === location.key;
            const cf = countFreshness[location.id];
            const done = cf && !cf.missing && cf.hoursAgo !== null && cf.hoursAgo < 18;
            return (
              <button key={location.key}
                onClick={()=>setLoc(location.key)}
                style={{
                  padding:'16px 14px',
                  borderRadius:10,
                  border: active ? '2px solid var(--blue)' : '2px solid var(--border)',
                  background: active ? 'rgba(162,204,235,.08)' : 'var(--bg)',
                  color:'#fff',
                  cursor:'pointer',
                  textAlign:'left',
                  fontFamily:'inherit',
                  transition:'all .15s'
                }}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                  <span className="serif" style={{fontSize:17,fontWeight:700,color:active?'var(--blue)':'#fff'}}>
                    {location.name}
                  </span>
                  {done
                    ? <span style={{fontSize:11,color:'var(--green)',fontWeight:700}}>✓ COUNTED</span>
                    : <span style={{fontSize:11,color:'var(--yellow)',fontWeight:700}}>○ NEEDS COUNT</span>}
                </div>
                <div style={{fontSize:11,color:'var(--gray)'}}>
                  {cf && !cf.missing
                    ? <>Last count {fmtHours(cf.hoursAgo)}{cf.countedBy ? ` by ${cf.countedBy}` : ''}</>
                    : 'No count on record'}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,flexWrap:'wrap',gap:10}}>
          <div>
            <h3>Counting {locName}</h3>
            <p className="sub">Count each flavor before close. Draft auto-saves. Tap Save when done.</p>
          </div>
          <div style={{fontSize:12,color:'var(--gray)'}}>
            {completedItems} of {totalItems} counted
          </div>
        </div>

        {Object.keys(prevCounts).length > 0 && (
          <div className="provisional-banner">
            <div>
              <strong style={{color:'var(--blue)'}}>Counts pre-filled</strong> from last count.
              Just update the flavors that changed — the rest will save as-is.
            </div>
          </div>
        )}

        <div style={{display:'flex',gap:10,marginTop:10,marginBottom:4,flexWrap:'wrap'}}>
          <select className="select" style={{flex:1,minWidth:200,maxWidth:300}}
            value={countedBy} onChange={e=>setCountedBy(e.target.value)}>
            <option value="">Counted by...</option>
            {employees.map(e=><option key={e.id} value={e.name}>{e.name}</option>)}
          </select>
          {employees.length === 0 && (
            <span style={{fontSize:11,color:'var(--yellow)',alignSelf:'center'}}>
              Add employees in Settings first
            </span>
          )}
        </div>
      </div>

      {classics.length > 0 && <div className="card">
        <h3 style={{color:'var(--blue)',marginBottom:4}}>Classics</h3>
        <div>{classics.map(renderFlavorRow)}</div>
      </div>}

      {specialties.length > 0 && <div className="card">
        <h3 style={{color:'var(--orange)',marginBottom:4}}>Monthly Specialties</h3>
        <div>{specialties.map(renderFlavorRow)}</div>
      </div>}

      {extras.length > 0 && <div className="card">
        <h3 style={{color:'var(--green)',marginBottom:4}}>Extras</h3>
        <div>{extras.map(renderFlavorRow)}</div>
      </div>}

      {/* Product sections */}
      {(() => {
        const renderProductRow = (p) => {
          const val = productCounts[p.id] !== undefined ? String(productCounts[p.id]) : '';
          const isNS = !!productNotStocked[p.id];
          const prev = prevProductCounts[p.id];
          const counted = isProductComplete(p.id);
          const isProvisional = val !== '' && !productConfirmed[p.id] && !isNS;
          return (
            <div key={p.id} className={`count-row ${counted ? 'counted' : ''} ${isNS ? 'not-stocked' : ''}`}>
              <div className="flav-name">
                {p.name}
                {prev !== undefined && <span className="prev-count">last: {prev}</span>}
                {isProvisional && <span className="prev-count" style={{color:'var(--yellow)',fontStyle:'italic'}}>tap to confirm</span>}
              </div>
              {!isNS && (
                <div style={{display:'flex',alignItems:'center',gap:8,marginTop:6,flexWrap:'wrap',width:'100%'}}>
                  <input
                    className={`input-wide ${isProvisional ? 'provisional-input' : ''}`}
                    style={{maxWidth:140}}
                    type="number" min="0" step="1"
                    placeholder={`# of ${p.unit_name}s`}
                    value={val}
                    onChange={e=>setProductCount(p.id, e.target.value)}
                    onFocus={()=>{ if (isProvisional) setProductConfirmed(pc => ({...pc, [p.id]: true})); }}
                  />
                  <span style={{fontSize:11,color:'var(--gray)'}}>{p.unit_name}{val==='1'?'':'s'}</span>
                  {isProvisional && (
                    <button className="btn btn-blue" style={{padding:'6px 12px',fontSize:11}}
                      onClick={()=>setProductConfirmed(pc => ({...pc, [p.id]: true}))}>
                      ✓ Confirm
                    </button>
                  )}
                </div>
              )}
              <div style={{marginTop:isNS ? 0 : 8,width:'100%'}}>
                <button
                  className={`quick-btn not-stocked ${isNS ? 'active' : ''}`}
                  style={{width:'100%'}}
                  onClick={()=>toggleProductNotStocked(p.id)}>
                  {isNS ? '✓ Not stocked at this location' : 'Not stocked at this location'}
                </button>
              </div>
            </div>
          );
        };
        const cookieDough = liveProducts.filter(p => p.product_type === 'cookie_dough');
        const sandwiches = liveProducts.filter(p => p.product_type === 'ice_cream_sandwich');
        const buttercreamBags = liveProducts.filter(p => p.product_type === 'buttercream_bag');
        return (
          <>
            {cookieDough.length > 0 && <div className="card">
              <h3 style={{color:'var(--blue)',marginBottom:4}}>🍪 Cookie Dough Containers</h3>
              <p className="sub">Count containers per flavor. 7oz each.</p>
              <div>{cookieDough.map(renderProductRow)}</div>
            </div>}
            {sandwiches.length > 0 && <div className="card">
              <h3 style={{color:'var(--orange)',marginBottom:4}}>🥪 Ice Cream Sandwiches</h3>
              <p className="sub">Total assembled sandwiches at this location.</p>
              <div>{sandwiches.map(renderProductRow)}</div>
            </div>}
            {buttercreamBags.length > 0 && <div className="card">
              <h3 style={{color:'var(--green)',marginBottom:4}}>🧁 Buttercream Bags</h3>
              <p className="sub">Total bags ready for sale.</p>
              <div>{buttercreamBags.map(renderProductRow)}</div>
            </div>}
          </>
        );
      })()}

      <div className="card">
        <input className="input-wide" placeholder="Notes (optional — spilled bin, found extras, etc.)"
          value={notes} onChange={e=>setNotes(e.target.value)}/>
        <div style={{display:'flex',gap:10,marginTop:12,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn btn-outline"
            onClick={()=>{
              if (confirm('Clear all entries for this count?')) {
                setCounts({}); setNotStocked({}); setConfirmed({});
                setProductCounts({}); setProductNotStocked({}); setProductConfirmed({});
                setNotes('');
                localStorage.removeItem(storageKey);
              }
            }}>Clear</button>
          <button className="btn btn-green"
            onClick={handleSaveClick}
            disabled={!ready || saving}
            style={{padding:'10px 24px',fontSize:14,flex:1,maxWidth:300}}>
            {saving ? 'Saving…' : ready ? `✓ Save Count for ${locName}` : countedBy ? `Count all items (${totalItems - completedItems} left)` : 'Select employee & count all items'}
          </button>
          {saveMsg && <span style={{color: saveMsg.startsWith('✓') ? 'var(--green)' : 'var(--red)',fontSize:13,fontWeight:600}}>{saveMsg}</span>}
        </div>
      </div>

      {/* Variance confirm modal */}
      {confirmFlavor && (() => {
        const cf = counts[confirmFlavor.id] || {};
        const total = getFlavorTotal(confirmFlavor.id);
        const prev = prevCounts[confirmFlavor.id];
        return (
          <div className="modal-overlay" onClick={()=>setConfirmFlavor(null)}>
            <div className="confirm-modal" onClick={e=>e.stopPropagation()}>
              <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:16,color:'var(--yellow)',marginBottom:10}}>⚠ Double-check this count</h3>
              <p style={{fontSize:13,lineHeight:1.5,marginBottom:14}}>
                <strong>{confirmFlavor.name}</strong>: you entered <strong>{cf.fridge ?? 0} fridge + {cf.freezer ?? 0} freezer = {total} total</strong> bins.<br/>
                Last count was <strong>{prev?.total ?? 0} total</strong> ({prev?.fridge ?? 0} fridge + {prev?.freezer ?? 0} freezer).<br/>
                <span style={{color:'var(--gray)'}}>That's a big change. Make sure the number is right.</span>
              </p>
              <div style={{display:'flex',gap:10}}>
                <button className="btn btn-outline" style={{flex:1}} onClick={()=>setConfirmFlavor(null)}>Go back & fix</button>
                <button className="btn btn-blue" style={{flex:1}} onClick={()=>{setConfirmFlavor(null);doSave();}}>Yes, that's right</button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ─── PRODUCTION PLAN ────────────────────────────────────────────────────────
function ProductionTab({dashData}) {
  const plan = dashData?.productionPlan || [];
  const alerts = dashData?.alerts || [];
  const projDays = dashData?.projectionDays || 7;
  const countFreshness = dashData?.countFreshness || {};
  const thisWeek = dashData?.thisWeek || {totalBatches:0,byBase:{},byFlavor:{}};
  const batchesByBase = dashData?.summary?.batchesByBase || {};
  const weekOfMonth = plan[0]?.weekOfMonth;

  const needs = plan.filter(p=>p.needsProduction);
  const stocked = plan.filter(p=>!p.needsProduction);
  const totalBatches = needs.reduce((s,p)=>s+p.batches,0);

  const fmtHours = (h) => {
    if (h === null || h === undefined) return 'never';
    if (h < 1) return 'just now';
    if (h < 24) return `${h}h ago`;
    const d = Math.floor(h/24);
    return `${d}d ${h%24}h ago`;
  };

  const renderCountChip = (locId, locName) => {
    const cf = countFreshness[locId];
    if (!cf || cf.missing) {
      return (
        <div className="count-chip missing">
          <span className="icon">●</span>
          <div><div className="label">{locName}</div><div className="value">No count yet</div></div>
        </div>
      );
    }
    const klass = cf.stale ? 'stale' : 'ok';
    return (
      <div className={`count-chip ${klass}`}>
        <span className="icon">{cf.stale ? '⚠' : '✓'}</span>
        <div>
          <div className="label">{locName}</div>
          <div className="value">Counted {fmtHours(cf.hoursAgo)}</div>
          {cf.countedBy && <div className="who">by {cf.countedBy}</div>}
        </div>
      </div>
    );
  };

  return (
    <div>
      {/* Count status */}
      <div className="count-status">
        {renderCountChip(1, 'Petoskey')}
        {renderCountChip(2, 'Traverse City')}
      </div>

      <div className="stats">
        <Stat value={totalBatches} label="Batches to Make"/>
        <Stat value={needs.length} label="Flavors Need Dough" color="var(--orange)"/>
        <Stat value={stocked.length} label="Stocked" color="var(--green)"/>
        <Stat value={`${projDays}d`} label="Projection"/>
      </div>

      {/* Alerts */}
      {alerts.length > 0 && (
        <div className="card">
          <h3>⚠️ Alerts</h3>
          <div style={{marginTop:10}}>
            {alerts.map((a,i) => <div key={i} className={`alert alert-${a.type}`}>{a.message}</div>)}
          </div>
        </div>
      )}

      {/* This week's production so far */}
      {thisWeek.totalBatches > 0 && (
        <div className="card" style={{padding:'14px 18px'}}>
          <h3 style={{fontSize:13,marginBottom:8}}>This Week's Production So Far</h3>
          <div style={{display:'flex',gap:16,flexWrap:'wrap',alignItems:'center'}}>
            <div><span className="serif" style={{fontSize:22,fontWeight:700,color:'var(--green)'}}>{thisWeek.totalBatches}</span> <span style={{fontSize:12,color:'var(--gray)'}}>batches logged</span></div>
            {Object.entries(thisWeek.byBase).sort((a,b)=>b[1]-a[1]).map(([base,cnt]) => (
              <div key={base} style={{fontSize:12,color:'var(--gray)'}}>
                <span style={{color:'#fff',fontWeight:600}}>{cnt}</span> {cnt===1?'batch':'batches'} <span>{base}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Batch-to-base summary for upcoming production */}
      {Object.keys(batchesByBase).length > 0 && (
        <div className="card" style={{padding:'14px 18px'}}>
          <h3 style={{fontSize:13,marginBottom:10}}>Next Production Cycle — Base Dough Summary</h3>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {Object.entries(batchesByBase).sort((a,b)=>b[1]-a[1]).map(([base,cnt]) => (
              <div key={base} style={{background:'var(--bg)',borderRadius:8,padding:'8px 14px',display:'flex',alignItems:'center',gap:8}}>
                <span className="serif" style={{fontSize:20,fontWeight:700,color:'var(--blue)'}}>{cnt}</span>
                <span style={{fontSize:12,color:'var(--gray)'}}>{cnt===1?'batch':'batches'} of <span style={{color:'#fff',fontWeight:600}}>{base}</span></span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Production plan — flavors needing production */}
      <div className="card">
        <h3>Production Plan <Tag>next {projDays} days</Tag>{weekOfMonth && <Tag color="var(--gray)">Week {weekOfMonth} of month</Tag>}</h3>
        <p className="sub">Bins needed for the next dough-making cycle (you make dough Mon/Tue). Math shown under each flavor — if a number looks off, check that flavor's par level in Settings.</p>
        {needs.length > 0 ? (
          <table>
            <thead><tr>
              <th>Flavor</th>
              <th className="c">On Hand</th>
              <th className="c">Velocity /wk</th>
              <th className="c">Demand {projDays}d</th>
              <th className="c">Projected End</th>
              <th className="c">Batches</th>
            </tr></thead>
            <tbody>{needs.map(p => (
              <React.Fragment key={p.flavor.id}>
                <tr className={p.critical?'critical':''}>
                  <td>
                    <Dot color={p.critical?'var(--red)':p.batches>=3?'var(--yellow)':'var(--blue)'}/>
                    <span style={{fontWeight:500}}>{p.flavor.name}</span>
                    {p.track === 'specialty' && <Tag color="var(--blue)">SPECIALTY</Tag>}
                    {p.tcNeedsTransfer && <Tag color="var(--blue)">TC TRANSFER</Tag>}
                    {p.upcomingDemand > 0 && <Tag color="var(--orange)">+{p.upcomingDemand} order</Tag>}
                    {!p.velocityReliable && <Tag color="var(--gray)">LIMITED DATA</Tag>}
                  </td>
                  <td className="c" style={{fontWeight:600}}>{p.current}
                    <div style={{fontSize:10,color:'var(--gray)',fontWeight:400}}>
                      P:{p.petoskey} <span style={{opacity:.7}}>({p.petFridge ?? 0}f+{p.petFreezer ?? 0}fz)</span>
                      {' '}TC:{p.tc} <span style={{opacity:.7}}>({p.tcFridge ?? 0}f+{p.tcFreezer ?? 0}fz)</span>
                    </div>
                  </td>
                  <td className="c" style={{color:'var(--gray)'}}>{p.velocity}</td>
                  <td className="c" style={{color:'var(--gray)'}}>{p.totalDemand}</td>
                  <td className="c" style={{color:p.endingWithoutProduction<0?'var(--red)':p.endingWithoutProduction<p.targetEnding?'var(--yellow)':'var(--gray)',fontWeight:p.endingWithoutProduction<0?700:400}}>{p.endingWithoutProduction}</td>
                  <td className="c">
                    <span className="serif" style={{background:'rgba(162,204,235,.15)',color:'var(--blue)',fontWeight:700,padding:'4px 12px',borderRadius:6,fontSize:14}}>{p.batches}</span>
                  </td>
                </tr>
                {/* Math breakdown — small grey row under the main row so Marisa can sanity-check */}
                <tr className={p.critical?'critical':''}>
                  <td colSpan={6} style={{padding:'0 12px 8px 32px',fontSize:11,color:'var(--gray)',borderTop:'none',fontStyle:'italic',lineHeight:1.5}}>
                    <span style={{color:'var(--blue)'}}>{p.planLogic}</span>
                    {p.formulaMath ? <span> · {p.formulaMath}</span> : null}
                    {p.binsWillMake > 0 && <span style={{color:'var(--gray)'}}> · makes ~{p.binsWillMake} bins</span>}
                  </td>
                </tr>
              </React.Fragment>
            ))}</tbody>
          </table>
        ) : (
          <p style={{color:'var(--green)',padding:20,textAlign:'center'}}>✓ All flavors stocked for the next production cycle.</p>
        )}

        {stocked.length > 0 && (
          <div style={{marginTop:14}}>
            <div className="section-label" style={{color:'var(--green)'}}>Stocked — Skip This Week</div>
            <div className="stocked-chips" style={{padding:'0 12px'}}>
              {stocked.map(p => (
                <span key={p.flavor.id} className="stocked-chip" title={p.planLogic}>
                  {p.flavor.name} ({p.current})
                </span>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── PREP LIST ──────────────────────
function PrepListTab({dashData}) {
  const [prepData, setPrepData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    (async () => {
      try {
        const plan = dashData?.productionPlan?.filter(p=>p.needsProduction).map(p=>({flavor_id:p.flavor.id,batch_count:p.batches})) || [];
        if (plan.length === 0) { setPrepData({ bases:[], subRecipes:[], addOns:[], totalBatches:0 }); setLoading(false); return; }
        const data = await api('prep-list', { batches: plan });
        setPrepData(data);
      } catch(e) { console.error(e); }
      setLoading(false);
    })();
  }, [dashData]);

  if (loading) return <div className="card"><p style={{color:'var(--gray)',padding:20,textAlign:'center'}}>Building prep list...</p></div>;
  if (!prepData || prepData.totalBatches === 0) return <div className="card"><p style={{color:'var(--green)',padding:20,textAlign:'center'}}>✓ No production planned — no prep needed.</p></div>;

  const typeColors = { frosting:'var(--blue)', center:'var(--orange)', glaze:'var(--yellow)' };

  return (
    <div>
      <div className="stats">
        <Stat value={prepData.totalBatches} label="Total Batches"/>
        <Stat value={prepData.bases.length} label="Base Doughs to Mix"/>
        <Stat value={prepData.subRecipes.length} label="Frostings/Centers"/>
        <Stat value={prepData.addOns.length} label="Add-On Ingredients"/>
      </div>

      <div className="card">
        <h3>🥣 Base Doughs to Mix</h3>
        <p className="sub">Mix these bases first. Each batch makes ~300 cookies worth of dough.</p>
        {prepData.bases.map((b,i) => (
          <div key={i} className="prep-group">
            <h4>
              <span style={{color:'var(--blue)'}} className="serif">{b.totalBatches}×</span>
              {b.base.name || b.base.label}
              <span style={{fontSize:11,color:'var(--gray)',fontWeight:400}}>for {b.flavors.map(f=>`${f.name} (${f.batches})`).join(', ')}</span>
            </h4>
            {b.ingredients.map((ing,j) => (
              <div key={j} className="prep-item">
                <span>{ing.name}</span>
                <span style={{color:'var(--blue)',fontWeight:600}}>{ing.total_grams.toLocaleString()}g</span>
              </div>
            ))}
          </div>
        ))}
      </div>

      {prepData.subRecipes.length > 0 && (
        <div className="card">
          <h3>🧁 Frostings, Centers & Glazes</h3>
          <p className="sub">Prep these alongside or after base doughs.</p>
          {prepData.subRecipes.map((sr,i) => (
            <div key={i} className="prep-group">
              <h4>
                <Tag color={typeColors[sr.subRecipe.type]||'var(--gray)'}>{sr.subRecipe.type.toUpperCase()}</Tag>
                {sr.subRecipe.name}
                <span style={{fontSize:11,color:'var(--gray)',fontWeight:400}}>for {sr.flavors.map(f=>f.name).join(', ')} ({sr.totalCookies} cookies)</span>
              </h4>
              {sr.ingredients.map((ing,j) => (
                <div key={j} className="prep-item">
                  <span>{ing.name}</span>
                  <span style={{color:'var(--orange)',fontWeight:600}}>{ing.total_grams.toLocaleString()}g</span>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {prepData.addOns.length > 0 && (
        <div className="card">
          <h3>🍫 Add-On Ingredients to Pull</h3>
          <p className="sub">Pull these from pantry before production day. Amounts for all planned batches.</p>
          <table>
            <thead><tr><th>Ingredient</th><th className="c">Amount</th><th>Used In</th></tr></thead>
            <tbody>{prepData.addOns.map((ao,i) => (
              <tr key={i}>
                <td style={{fontWeight:500}}>{ao.name}</td>
                <td className="c" style={{fontWeight:600,color:'var(--green)'}}>{ao.total_grams.toLocaleString()}g</td>
                <td style={{fontSize:12,color:'var(--gray)'}}>{ao.flavors.map(f=>f.name).join(', ')}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ─── ORDER LISTS ────────────────────
function OrdersTab({dashData}) {
  const [orderData, setOrderData] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    (async () => {
      try {
        const plan = dashData?.productionPlan?.filter(p=>p.needsProduction).map(p=>({flavor_id:p.flavor.id,batch_count:p.batches})) || [];
        const data = await api('orders', { batches: plan });
        setOrderData(data);
      } catch(e) { console.error(e); }
      setLoading(false);
    })();
  }, [dashData]);
  if (loading) return <div className="card"><p style={{color:'var(--gray)',padding:20,textAlign:'center'}}>Calculating order lists...</p></div>;
  const supColors = {'GFS':'var(--green)','Webstaurant':'#42A5F5','Amazon':'#FF7043'};
  const supDelivery = {'GFS':'Order Tue → Arrives Wed','Webstaurant':'Order Tue → Arrives Fri','Amazon':'Order Tue → Arrives Fri'};
  return (
    <div>
      <div className="card" style={{padding:'14px 18px',marginBottom:14}}><h3>Tuesday Order Lists</h3><p className="sub" style={{marginBottom:0}}>Based on production plan and pantry levels. Only shows ingredients used in recipes.</p></div>
      {(orderData?.orderLists||[]).map(ol => (
        <div key={ol.supplier.id} className="card" style={{borderLeft:`3px solid ${supColors[ol.supplier.name]||'var(--gray)'}`,marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <div>
              <h3 style={{fontSize:16}}>{ol.supplier.name} <Tag color={supColors[ol.supplier.name]}>{ol.itemsToOrder} to order</Tag></h3>
              <p className="sub" style={{marginBottom:0}}>{supDelivery[ol.supplier.name]||''}</p>
            </div>
          </div>
          <table>
            <thead><tr><th>Item</th><th className="c">On Hand</th><th className="c">Par</th><th className="c">Order</th><th>Level</th></tr></thead>
            <tbody>
              {ol.items.filter(i=>i.need_to_order>0).map(i => {
                const sc = i.status === 'no-par' ? '#666' : sColor(i.on_hand, i.par_level);
                return (
                  <tr key={i.ingredient.id}>
                    <td><Dot color={sc}/><span style={{fontWeight:500}}>{i.ingredient.nickname||i.ingredient.name}</span></td>
                    <td className="c">{i.on_hand} {i.unit}</td>
                    <td className="c" style={{color:'var(--gray)'}}>{i.par_level || '—'}</td>
                    <td className="c"><span style={{fontWeight:700,color:sc,background:sc.replace('var(','rgba(').replace(')','')+',0.12)',padding:'3px 10px',borderRadius:5}}>{i.need_to_order} {i.unit}</span></td>
                    <td><Bar pct={i.par_level > 0 ? i.on_hand/i.par_level*100 : 0} color={sc}/></td>
                  </tr>
                );
              })}
              {ol.items.filter(i=>i.need_to_order<=0).length > 0 && (
                <tr><td colSpan={5} className="section-label" style={{color:'var(--green)'}}>Stocked</td></tr>
              )}
              {ol.items.filter(i=>i.need_to_order<=0).map(i => (
                <tr key={i.ingredient.id}>
                  <td><Dot color="var(--green)"/><span style={{fontWeight:500,color:'var(--gray)'}}>{i.ingredient.nickname||i.ingredient.name}</span></td>
                  <td className="c" style={{color:'var(--gray)'}}>{i.on_hand} {i.unit}</td>
                  <td className="c" style={{color:'var(--gray)'}}>{i.par_level || '—'}</td>
                  <td className="c" style={{color:'var(--green)'}}>—</td>
                  <td><Bar pct={i.par_level > 0 ? i.on_hand/i.par_level*100 : 0} color="var(--green)"/></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ))}
    </div>
  );
}

// ─── MANUAL ORDERS ──────────────────
function ManualOrdersTab({flavors}) {
  const [orders, setOrders] = useState([]);
  const [showAdd, setShowAdd] = useState(false);
  const [editOrder, setEditOrder] = useState(null); // The order being viewed/edited
  const [newOrder, setNewOrder] = useState({order_type:'catering',customer_name:'',fulfillment_date:'',notes:'',items:[]});
  const [newItem, setNewItem] = useState({flavor_id:'',quantity:'',cookie_oz:4});

  const load = () => db('manual_orders','select',{select:'*, manual_order_items(*)',orderBy:'fulfillment_date'}).then(d=>setOrders(d.data||[]));
  useEffect(() => { load(); }, []);

  const addItem = () => {
    if (!newItem.flavor_id || !newItem.quantity) return;
    setNewOrder({...newOrder, items:[...newOrder.items, {...newItem, flavor_name: flavors.find(f=>f.id==newItem.flavor_id)?.name}]});
    setNewItem({flavor_id:'',quantity:'',cookie_oz:4});
  };

  const saveOrder = async () => {
    try {
      const {data} = await db('manual_orders','insert',{data:{order_type:newOrder.order_type, customer_name:newOrder.customer_name, fulfillment_date:newOrder.fulfillment_date||null, notes:newOrder.notes, location_id:1}});
      if (data?.[0]) for (const item of newOrder.items) await db('manual_order_items','insert',{data:{manual_order_id:data[0].id, flavor_id:parseInt(item.flavor_id), quantity:parseInt(item.quantity), cookie_oz:parseFloat(item.cookie_oz), pack_size: item.cookie_oz==1?'mini-1oz':item.cookie_oz==2?'mini-2oz':'standard'}});
      setShowAdd(false); setNewOrder({order_type:'catering',customer_name:'',fulfillment_date:'',notes:'',items:[]}); load();
    } catch(e) { alert('Error: ' + e.message); }
  };

  const updateStatus = async (id, status) => { await db('manual_orders','update',{id,data:{status}}); load(); };

  // Save edits to an existing order's top-level fields (customer, date, notes, type)
  const saveOrderEdits = async () => {
    if (!editOrder) return;
    try {
      await db('manual_orders','update',{id:editOrder.id, data:{
        customer_name: editOrder.customer_name || null,
        fulfillment_date: editOrder.fulfillment_date || null,
        notes: editOrder.notes || null,
        order_type: editOrder.order_type
      }});
      await load();
      setEditOrder(null);
    } catch(e) { alert('Error saving order: ' + e.message); }
  };

  // Delete a single item from an existing order
  const deleteOrderItem = async (itemId) => {
    if (!confirm('Remove this item from the order?')) return;
    try {
      await db('manual_order_items','delete',{id:itemId});
      // Reload both the order list and the open modal
      const {data} = await db('manual_orders','select',{
        select:'*, manual_order_items(*)',
        filters:{id:editOrder.id}
      });
      if (data?.[0]) setEditOrder(data[0]);
      load();
    } catch(e) { alert('Error removing item: ' + e.message); }
  };

  // Add an item to an existing order
  const [addItemTo, setAddItemTo] = useState({flavor_id:'',quantity:'',cookie_oz:4});
  const addItemToOrder = async () => {
    if (!editOrder || !addItemTo.flavor_id || !addItemTo.quantity) return;
    try {
      const cookie_oz = parseFloat(addItemTo.cookie_oz);
      await db('manual_order_items','insert',{data:{
        manual_order_id: editOrder.id,
        flavor_id: parseInt(addItemTo.flavor_id),
        quantity: parseInt(addItemTo.quantity),
        cookie_oz,
        pack_size: cookie_oz==1?'mini-1oz':cookie_oz==2?'mini-2oz':'standard'
      }});
      setAddItemTo({flavor_id:'',quantity:'',cookie_oz:4});
      // Refresh the open modal
      const {data} = await db('manual_orders','select',{
        select:'*, manual_order_items(*)',
        filters:{id:editOrder.id}
      });
      if (data?.[0]) setEditOrder(data[0]);
      load();
    } catch(e) { alert('Error adding item: ' + e.message); }
  };

  // Delete an entire order (with all its items via cascade — or manual cleanup)
  const deleteWholeOrder = async () => {
    if (!editOrder) return;
    if (!confirm(`Delete this order for ${editOrder.customer_name || 'unnamed customer'}? This cannot be undone.`)) return;
    try {
      // Delete items first (no cascade defined on the FK)
      for (const item of (editOrder.manual_order_items || [])) {
        await db('manual_order_items','delete',{id:item.id});
      }
      await db('manual_orders','delete',{id:editOrder.id});
      setEditOrder(null);
      load();
    } catch(e) { alert('Error deleting order: ' + e.message); }
  };

  return (
    <div>
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <div><h3>Catering & Wholesale Orders</h3><p className="sub">Manual orders outside Shopify/Clover. Click any row to view or edit.</p></div>
          <button className="btn btn-blue" onClick={()=>setShowAdd(true)}>+ New Order</button>
        </div>
        {orders.length===0?<p style={{color:'var(--gray)',textAlign:'center',padding:20}}>No orders yet.</p>:(
          <table><thead><tr><th>Customer</th><th>Type</th><th className="c">Cookies</th><th className="c">Due</th><th>Status</th><th></th></tr></thead>
          <tbody>{orders.map(o=>(
            <tr key={o.id} className="clickable-row" onClick={()=>setEditOrder({...o, manual_order_items: o.manual_order_items || []})}>
              <td style={{fontWeight:500}}>{o.customer_name||'—'}</td>
              <td><Tag color={o.order_type==='wholesale'?'var(--green)':'var(--orange)'}>{o.order_type.toUpperCase()}</Tag></td>
              <td className="c">{o.manual_order_items?.reduce((s,i)=>s+i.quantity,0)||0}</td>
              <td className="c">{o.fulfillment_date||'—'}</td>
